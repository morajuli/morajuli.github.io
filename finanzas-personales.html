<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- Privacidad: connect-src 'none' impide cualquier petición de red (fetch, XHR, WebSocket, beacons). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; connect-src 'none'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#14202b">
  <meta name="description" content="Sistema financiero personal: ingresos, gastos, ahorro, inversiones, deudas y patrimonio. Funciona 100% en tu navegador.">
  <title>Finanzas personales</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <style>
/* =========================================================================
 * Finanzas personales — estilos
 * Mobile-first. Tokens en :root; tema oscuro automático o manual.
 * Sin fuentes externas (privacidad / sin red): pila tipográfica del sistema
 * con cifras tabulares para que los montos se alineen.
 * ========================================================================= */

:root {
  --bg: #edf0ef;
  --surface: #ffffff;
  --surface-2: #f4f6f5;
  --ink: #14202b;
  --ink-2: #435160;
  --muted: #6f7d8a;
  --line: #dbe1df;
  --line-2: #e8ecea;
  --muted-line: #a9b3bc;

  --accent: #0f6c5a;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe8;

  --income: #1c8752;
  --expense: #c0433a;
  --saving: #2a68ad;
  --invest: #6d49bf;
  --debt: #b06f17;
  --warn: #b98208;
  --neutral: #5d6b78;

  --hero: #14202b;
  --hero-2: #1d2c38;
  --hero-ink: #f0f4f3;
  --hero-muted: #98abb8;
  --hero-accent: #46c39a;

  --r-xl: 22px;
  --r-lg: 16px;
  --r: 12px;
  --r-sm: 8px;
  --shadow: 0 1px 2px rgba(20, 32, 43, .05), 0 6px 20px rgba(20, 32, 43, .05);
  --shadow-lg: 0 18px 50px rgba(10, 18, 26, .28);

  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Ubuntu, Cantarell, "Noto Sans", Arial, sans-serif;
  --tab-h: 64px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1216; --surface: #141c22; --surface-2: #1a242b; --ink: #e5ebee; --ink-2: #b4c0c8; --muted: #84929d;
    --line: #25313a; --line-2: #1f2a31; --muted-line: #4c5a65;
    --accent: #3cb68f; --accent-ink: #06231a; --accent-soft: #163a2f;
    --income: #4cc08a; --expense: #f07a6e; --saving: #6aa5ea; --invest: #a98af0; --debt: #e2a24a; --warn: #e5b33f; --neutral: #93a1ad;
    --hero: #18252f; --hero-2: #213240; --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1216; --surface: #141c22; --surface-2: #1a242b; --ink: #e5ebee; --ink-2: #b4c0c8; --muted: #84929d;
  --line: #25313a; --line-2: #1f2a31; --muted-line: #4c5a65;
  --accent: #3cb68f; --accent-ink: #06231a; --accent-soft: #163a2f;
  --income: #4cc08a; --expense: #f07a6e; --saving: #6aa5ea; --invest: #a98af0; --debt: #e2a24a; --warn: #e5b33f; --neutral: #93a1ad;
  --hero: #18252f; --hero-2: #213240; --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}

/* ---------------- Base ---------------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
body.no-scroll { overflow: hidden; }
h1, h2, h3 { line-height: 1.2; margin: 0; letter-spacing: -.01em; }
h1 { font-size: 1.5rem; font-weight: 700; }
h2 { font-size: 1rem; font-weight: 650; }
h3 { font-size: .95rem; font-weight: 600; }
p { margin: 0 0 .6em; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code { background: var(--surface-2); padding: .1em .35em; border-radius: 5px; font-size: .88em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 0; background: var(--ink); color: var(--bg); padding: 8px 12px; z-index: 100; }
.skip:focus { left: 8px; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.center { text-align: center; }
.pos { color: var(--income); }
.neg { color: var(--expense); }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.tiny { width: 14px; height: 14px; vertical-align: -2px; }
.noscript { padding: 24px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* ---------------- Montos ---------------- */
.amt { white-space: nowrap; font-variant-numeric: tabular-nums; }
.amt .cur { font-size: .64em; font-weight: 500; opacity: .62; margin-right: .1em; position: relative; top: -.32em; }
.amt.pos { color: var(--income); }
.amt.neg { color: var(--expense); }
.amt.neutral { color: var(--ink-2); }

/* ---------------- Estructura ---------------- */
.app { min-height: 100vh; min-height: 100dvh; }
.sidebar { display: none; }
.main { min-width: 0; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 6px;
  padding: 10px 12px calc(10px) 14px; padding-top: max(10px, env(safe-area-inset-top));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line-2);
}
.topbar-title { flex: 1; font-weight: 650; font-size: 1.02rem; }
.brand-mini svg, .brand svg { width: 30px; height: 30px; display: block; }
.brand-mini rect, .brand rect { fill: var(--hero); }
.brand-mini path, .brand path { stroke: var(--hero-accent); stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
#view { outline: none; padding-bottom: calc(var(--tab-h) + 28px + env(safe-area-inset-bottom)); }
.page { max-width: 1180px; margin: 0 auto; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 14px; }
.boot { padding: 60px 20px; text-align: center; color: var(--muted); }

.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface); border-top: 1px solid var(--line);
}
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .7rem; color: var(--muted); text-decoration: none; padding: 6px 0; }
.tabbar a.on { color: var(--ink); font-weight: 600; }
.tabbar a.on .ico { stroke: var(--accent); }
.tab-add {
  justify-self: center; width: 54px; height: 54px; border-radius: 18px; border: 0; background: var(--hero); color: var(--hero-accent);
  display: grid; place-items: center; transform: translateY(-10px); box-shadow: 0 8px 22px rgba(20, 32, 43, .3); cursor: pointer;
}
.tab-add .ico { width: 28px; height: 28px; stroke-width: 2.4; }

@media (min-width: 960px) {
  .app { display: grid; grid-template-columns: 252px 1fr; }
  .sidebar {
    display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
    padding: 18px 14px; border-right: 1px solid var(--line); background: var(--surface);
  }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; padding: 4px 6px 6px; }
  .brand span { font-weight: 700; font-size: 1.05rem; line-height: 1.05; display: flex; flex-direction: column; }
  .brand small { font-weight: 500; font-size: .78rem; color: var(--muted); }
  .sidebar nav { display: flex; flex-direction: column; gap: 12px; }
  .nav-group h3 { font-size: .74rem; font-weight: 600; color: var(--muted); padding: 0 10px 4px; }
  .nav-group a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; color: var(--ink-2); text-decoration: none; font-size: .92rem; }
  .nav-group a .ico { width: 18px; height: 18px; color: var(--muted); }
  .nav-group a:hover { background: var(--surface-2); }
  .nav-group a.on { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
  .nav-group a.on .ico { color: var(--accent); }
  .side-foot { margin-top: auto; font-size: .76rem; color: var(--muted); display: flex; gap: 6px; align-items: center; padding: 0 8px; }
  .tabbar, .brand-mini { display: none; }
  .topbar { padding: 12px 24px; }
  #view { padding-bottom: 40px; }
  .page { padding: 20px 24px 8px; gap: 16px; }
}

/* ---------------- Botones y controles ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 40px; padding: 8px 14px;
  border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 560;
  cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn .ico { width: 17px; height: 17px; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.primary:hover { background: var(--ink-2); }
.btn.danger { background: var(--expense); border-color: var(--expense); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger-text { color: var(--expense); }
.btn.small { min-height: 32px; padding: 5px 10px; font-size: .84rem; border-radius: 9px; }
.btn.block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:disabled { opacity: .3; cursor: default; }
.link { font-size: .85rem; font-weight: 560; white-space: nowrap; }
.link-btn { background: none; border: 0; color: var(--accent); padding: 4px 0; cursor: pointer; font-size: .85rem; font-weight: 560; }

input, select, textarea {
  width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  font-size: 16px; /* evita zoom en iOS */
}
textarea { resize: vertical; min-height: 64px; }
input[type="color"] { padding: 4px; height: 42px; }
input[type="range"] { padding: 0; min-height: 28px; accent-color: var(--accent); }
input[type="checkbox"] { width: 20px; height: 20px; min-height: 0; accent-color: var(--accent); }
select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field .lbl { font-size: .82rem; font-weight: 600; color: var(--ink-2); }
.field .lbl em { font-style: normal; font-weight: 400; color: var(--muted); }
.field .hint, .hint { font-size: .78rem; color: var(--muted); }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--expense); }
.field-error { color: var(--expense); font-size: .8rem; margin: 2px 0 0; }
.switch { display: flex; align-items: center; gap: 10px; padding: 6px 0; cursor: pointer; font-size: .92rem; }
.switch.compact { align-self: end; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---------------- Tarjetas ---------------- */
.card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-head h2 { display: flex; align-items: center; gap: 8px; }
.card-head h2 .ico { width: 18px; height: 18px; color: var(--muted); }
.card-sub { color: var(--muted); font-size: .85rem; margin-top: -6px; }
.h3 { margin: 16px 0 8px; font-size: .9rem; color: var(--ink-2); }
.foot-note { font-size: .8rem; color: var(--muted); margin: 0; }
.lead { font-size: 1.02rem; }
.disclaimer { font-size: .8rem; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
.page-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.page-head p { color: var(--muted); margin: 4px 0 0; font-size: .9rem; max-width: 70ch; }
.page-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid-2 { display: grid; gap: 14px; grid-template-columns: 1fr; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (min-width: 900px) { .grid-2 { grid-template-columns: 1fr 1fr; align-items: start; } }

/* ---------------- KPIs ---------------- */
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 11px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.card .kpi { background: var(--surface-2); border-color: transparent; }
.kpi-label { font-size: .78rem; color: var(--muted); font-weight: 560; }
.kpi-value { font-size: clamp(1.02rem, 4.6vw, 1.22rem); font-weight: 680; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; }
.kpi-sub { font-size: .76rem; color: var(--muted); }
@media (min-width: 640px) { .kpis.four, .kpis.five, .kpis.six, .kpis.seven { grid-template-columns: repeat(3, minmax(0, 1fr)); } .kpis.three { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1100px) { .kpis.four { grid-template-columns: repeat(4, 1fr); } .kpis.five { grid-template-columns: repeat(5, 1fr); } .kpis.seven { grid-template-columns: repeat(4, 1fr); } }
.card .kpis.six { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 640px) { .card .kpis.six { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

.delta { font-size: .78rem; font-weight: 600; white-space: nowrap; }
.delta.up { color: var(--income); }
.delta.down { color: var(--expense); }
.delta.inv.up { color: var(--expense); }
.delta.inv.down { color: var(--income); }
.delta.flat { color: var(--muted); }

/* ---------------- Hero (patrimonio) ---------------- */
.hero {
  background: radial-gradient(120% 140% at 100% 0%, var(--hero-2) 0%, var(--hero) 55%); color: var(--hero-ink);
  border-radius: var(--r-xl); padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 14px; overflow: hidden;
}
.hero-top { display: flex; justify-content: space-between; gap: 14px; align-items: flex-end; }
.hero-label { font-size: .82rem; color: var(--hero-muted); font-weight: 560; }
.hero-value { font-size: clamp(2rem, 9vw, 3.1rem); font-weight: 720; letter-spacing: -.035em; line-height: 1.05; margin: 2px 0 4px; }
.hero-sub { font-size: .8rem; color: var(--hero-muted); }
.hero-spark { width: 38%; max-width: 280px; min-width: 96px; height: 54px; }
.hero-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: rgba(255, 255, 255, .08); border-radius: 12px; overflow: hidden; }
.hero-stat { background: var(--hero); padding: 10px 12px; color: var(--hero-ink); text-decoration: none; display: flex; flex-direction: column; font-weight: 650; }
.hero-stat:hover { background: var(--hero-2); text-decoration: none; }
.hero-stat span:first-child { font-size: .74rem; color: var(--hero-muted); font-weight: 500; }
.hero-foot { font-size: .76rem; color: var(--hero-muted); margin: 0; }
@media (min-width: 640px) { .hero-grid { grid-template-columns: repeat(4, 1fr); } .hero { padding: 22px 24px 18px; } }

/* ---------------- Acciones rápidas ---------------- */
.quick { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -14px; padding: 0 14px; }
.quick::-webkit-scrollbar { display: none; }
.quick-btn {
  display: inline-flex; align-items: center; gap: 5px; flex: none; padding: 8px 13px 8px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .88rem; cursor: pointer;
}
.quick-btn .ico { width: 16px; height: 16px; stroke-width: 2.4; }
.t-income .ico, .quick-btn.t-income .ico { color: var(--income); }
.quick-btn.t-expense .ico { color: var(--expense); }
.quick-btn.t-neutral .ico { color: var(--neutral); }
.quick-btn.t-saving .ico { color: var(--saving); }
.quick-btn.t-invest .ico { color: var(--invest); }
.quick-btn.t-debt .ico { color: var(--debt); }
@media (min-width: 960px) { .quick { margin: 0; padding: 0; flex-wrap: wrap; } }

/* ---------------- Dashboard ---------------- */
.dash-grid { display: grid; gap: 14px; }
@media (min-width: 1000px) { .dash-grid { grid-template-columns: 1.15fr 1fr; align-items: start; } }
.margin-value { font-size: 1.9rem; font-weight: 720; letter-spacing: -.02em; margin: 2px 0 6px; }
.margin-value.neg { color: var(--expense); }
details.calc summary, details.more summary, .filter-more summary, details summary { cursor: pointer; font-size: .85rem; font-weight: 600; color: var(--ink-2); }
.calc-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: .88rem; border-bottom: 1px dashed var(--line); }
.calc-row.total { border-bottom: 0; font-weight: 700; }
.calc { margin-top: 4px; }
.split { display: grid; gap: 16px; align-items: center; }
@media (min-width: 520px) { .split { grid-template-columns: auto 1fr; } }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { min-width: 0; }
.bar-top { display: flex; justify-content: space-between; gap: 8px; font-size: .88rem; }
.bar-label { display: flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-val { display: flex; gap: 6px; align-items: baseline; font-weight: 600; white-space: nowrap; }
.bar-val small { font-weight: 500; }
.bar-track { height: 6px; background: var(--surface-2); border-radius: 4px; margin-top: 4px; overflow: hidden; }
.bar-track span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; flex: none; }
.insights { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ins { position: relative; padding: 8px 10px 8px 30px; background: var(--surface-2); border-radius: 10px; font-size: .9rem; }
.ins::before { position: absolute; left: 10px; top: 8px; font-weight: 700; }
.ins.up::before { content: "↑"; color: var(--ink-2); }
.ins.down::before { content: "↓"; color: var(--ink-2); }
.ins.flat::before { content: "→"; color: var(--muted); }
.ins.info::before { content: "·"; color: var(--accent); font-size: 1.4rem; line-height: .8; }
.bs { display: grid; gap: 18px; }
@media (min-width: 700px) { .bs { grid-template-columns: 1fr 1fr; } }
.bs-col h3 { font-size: .82rem; color: var(--muted); margin-bottom: 4px; }
.bs-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line-2); color: var(--ink); text-decoration: none; font-size: .92rem; }
a.bs-row:hover { text-decoration: none; color: var(--accent); }
.bs-total { display: flex; justify-content: space-between; padding: 8px 0 0; font-weight: 700; }
.bs-net { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 6px; margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); font-weight: 700; }
.bs-net span:first-child { font-size: .85rem; font-weight: 600; }
.bs-net .amt { font-size: 1.25rem; }
.goal-mini { display: grid; gap: 12px; }
.gm { color: var(--ink); text-decoration: none; display: flex; flex-direction: column; gap: 4px; }
.gm:hover { text-decoration: none; }
.gm-top { display: flex; justify-content: space-between; font-size: .9rem; font-weight: 600; }
.upcoming { list-style: none; padding: 0; margin: 0; }
.upcoming li { display: grid; grid-template-columns: 56px 1fr auto; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: .9rem; }
.up-date { color: var(--muted); font-size: .82rem; }
.nudge { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-radius: 12px; border: 1px dashed var(--muted-line); font-size: .86rem; color: var(--ink-2); }
.nudge span { flex: 1; min-width: 200px; }
.pending-card { border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.pending-list { display: flex; flex-direction: column; gap: 10px; }
.pending { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--line-2); }
.pending > div:first-child { display: flex; flex-direction: column; }
.pending .muted { font-size: .8rem; }
.pending-actions { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------------- Bienvenida ---------------- */
.welcome { background: var(--surface); border-radius: var(--r-xl); padding: 24px 20px; border: 1px solid var(--line-2); max-width: 720px; margin: 10px auto; }
.welcome h1 { font-size: 1.7rem; margin-bottom: 8px; }
.welcome > p { color: var(--ink-2); }
.steps { padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; margin: 16px 0; }
.welcome-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.privacy-note, .privacy { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); font-size: .9rem; margin: 14px 0; }
.privacy-note .ico, .privacy > .ico { color: var(--accent); margin-top: 2px; }
.privacy { margin: 0; }
.privacy h2 { margin-bottom: 4px; }

/* ---------------- Movimientos ---------------- */
.tx-list { display: flex; flex-direction: column; }
.tx-day { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); font-weight: 600; padding: 12px 2px 4px; border-bottom: 1px solid var(--line-2); }
.tx-day:first-child { padding-top: 0; }
.tx-row {
  display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 11px; align-items: center; width: 100%; text-align: left;
  background: none; border: 0; border-bottom: 1px solid var(--line-2); padding: 10px 2px; cursor: pointer; border-radius: 0;
}
.tx-row:hover { background: var(--surface-2); }
.tx-ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-2); color: var(--neutral); }
.tx-ico .ico { width: 18px; height: 18px; }
.tx-ico.t-income { color: var(--income); background: color-mix(in srgb, var(--income) 12%, transparent); }
.tx-ico.t-expense { color: var(--c, var(--expense)); background: color-mix(in srgb, var(--c, var(--expense)) 13%, transparent); }
.tx-ico.t-saving { color: var(--saving); background: color-mix(in srgb, var(--saving) 12%, transparent); }
.tx-ico.t-invest { color: var(--invest); background: color-mix(in srgb, var(--invest) 12%, transparent); }
.tx-ico.t-debt { color: var(--debt); background: color-mix(in srgb, var(--debt) 13%, transparent); }
.tx-main { display: flex; flex-direction: column; min-width: 0; }
.tx-title { font-weight: 600; font-size: .93rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.tx-meta { font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tags { font-size: .74rem; color: var(--accent); }
.tx-amt { display: flex; flex-direction: column; align-items: flex-end; font-weight: 650; font-size: .95rem; }
.badge { display: inline-block; font-size: .68rem; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.badge.muted { color: var(--muted); }
.badge.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--ink); }
.badge.danger, .badge.over { background: color-mix(in srgb, var(--expense) 16%, transparent); color: var(--expense); }
.filters { display: flex; flex-direction: column; gap: 10px; }
.search { position: relative; display: block; }
.search .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { padding-left: 40px; border-radius: 12px; }
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
.filter-row > * { flex: 1 1 150px; }
.filter-more summary { display: inline-flex; align-items: center; gap: 6px; }
.filter-more .count { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 7px; font-size: .74rem; }
.filter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin-top: 10px; }
.result-summary { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-2); font-size: .88rem; }
.result-summary .btn { margin-left: auto; }
.page > .tx-list, [data-results] .tx-list { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); padding: 10px 14px; margin-top: 10px; }

/* ---------------- Subnavegación y selector de mes ---------------- */
.subtabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px; }
.subtabs::-webkit-scrollbar { display: none; }
.subtabs a { flex: none; padding: 7px 12px; border-radius: 999px; color: var(--ink-2); font-size: .87rem; font-weight: 560; text-decoration: none; border: 1px solid transparent; }
.subtabs a.on { background: var(--surface); border-color: var(--line); color: var(--ink); }
@media (min-width: 960px) { .subtabs { margin: 0; padding: 0; } }
.month-picker { display: inline-flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 2px; }
.mp-label { position: relative; padding: 0 8px; font-weight: 650; min-width: 128px; text-align: center; cursor: pointer; }
.mp-label input { position: absolute; inset: 0; opacity: 0; cursor: pointer; min-height: 0; padding: 0; border: 0; }

/* ---------------- Tablas ---------------- */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tbl th, .tbl td { padding: 8px 8px; text-align: right; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.tbl th:first-child { text-align: left; font-weight: 600; }
.tbl thead th { font-size: .76rem; color: var(--muted); font-weight: 600; }
.tbl tfoot td, .tbl tfoot th { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--line); }
.tbl.compact th, .tbl.compact td { padding: 5px 6px; }

/* ---------------- Gráficos ---------------- */
[data-chart], [data-c1], [data-c2], [data-c3], [data-pc], [data-wf] { position: relative; }
svg .grid { stroke: var(--line-2); stroke-width: 1; }
svg .grid.zero { stroke: var(--muted-line); }
svg .axis { fill: var(--muted); font-size: 10.5px; font-family: var(--font); }
svg .axis.strong { fill: var(--ink-2); font-weight: 600; }
svg .line { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
svg .line.dashed { stroke-dasharray: 5 4; stroke-width: 1.6; }
svg .area { opacity: .12; }
svg .dot { fill: var(--surface); stroke-width: 1.8; }
svg .cursor { stroke: var(--muted-line); stroke-dasharray: 3 3; }
svg .connector { stroke: var(--muted-line); stroke-dasharray: 2 3; }
svg .slice { stroke: var(--surface); stroke-width: 1.5; }
.chart-tip[hidden] { display: none; }
.chart-tip { position: absolute; top: 4px; z-index: 5; pointer-events: none; background: var(--ink); color: var(--bg); padding: 7px 9px; border-radius: 9px; font-size: .78rem; display: flex; flex-direction: column; gap: 2px; box-shadow: var(--shadow-lg); white-space: nowrap; }
.chart-tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; color: var(--ink-2); margin-top: 6px; }
.chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.chart-legend i.dashed { height: 3px; vertical-align: 3px; }
.chart-empty { padding: 26px 8px; text-align: center; color: var(--muted); font-size: .88rem; }
.donut-wrap { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }
.donut-svg { position: relative; flex: none; }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; padding: 0 22%; }
.donut-center span { font-size: .72rem; color: var(--muted); line-height: 1.2; }
.donut-center strong { font-size: .98rem; }
.donut-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: .85rem; min-width: 160px; }
.donut-legend li { display: grid; grid-template-columns: 12px 1fr auto; gap: 7px; align-items: center; }
.donut-legend i { width: 10px; height: 10px; border-radius: 3px; display: block; }
.hero .hero-spark svg .area { opacity: .18; }
.inv-spark { height: 36px; margin: 6px 0; }

/* ---------------- Barras de progreso ---------------- */
.progress { height: 8px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .4s; }
.progress.warn span { background: var(--warn); }
.progress.danger span { background: color-mix(in srgb, var(--expense) 75%, var(--warn)); }
.progress.over span { background: var(--expense); }
.progress.done span { background: var(--income); }
.stack-bar { display: flex; height: 12px; border-radius: 7px; overflow: hidden; background: var(--surface-2); margin-bottom: 12px; }
.stack-bar .fixed { background: var(--debt); }
.stack-bar .variable { background: var(--expense); opacity: .8; }

/* ---------------- Cuentas, inversiones, deudas, metas, presupuestos ---------------- */
.acc-group header { display: flex; justify-content: space-between; align-items: baseline; margin: 6px 2px 10px; }
.acc-group header .amt { font-weight: 700; font-size: 1.05rem; }
.acc-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.acc-card, .inv-card, .debt-card, .goal-card, .bud-card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); min-width: 0; }
.acc-top, .inv-card header, .debt-card header, .goal-card header, .bud-card header { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.acc-bal, .right { display: flex; flex-direction: column; align-items: flex-end; font-weight: 700; font-size: 1.15rem; text-align: right; }
.right .small { font-weight: 600; }
.acc-card.negative .acc-bal .amt { color: var(--expense); }
.acc-meta { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px 12px; margin: 0; }
.acc-meta div { display: flex; flex-direction: column; }
.acc-meta dt { font-size: .72rem; color: var(--muted); }
.acc-meta dd { margin: 0; font-size: .86rem; font-weight: 600; }
.acc-actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }
.archived summary { padding: 8px 2px; }
.inv-card.closed { opacity: .75; }
.warn-note { font-size: .82rem; color: var(--ink-2); background: color-mix(in srgb, var(--warn) 14%, transparent); padding: 6px 10px; border-radius: 8px; margin: 0; }
.debt-prog { display: flex; justify-content: space-between; font-size: .8rem; font-weight: 600; margin-top: -4px; }
.debt-sec h2 { margin: 6px 2px 10px; }
.goal-pct { font-size: 1.4rem; font-weight: 720; }
.goal-card.done .goal-pct { color: var(--income); }
.goal-amounts { font-size: 1.1rem; font-weight: 700; }
.goal-amounts .muted { font-weight: 500; font-size: .9rem; }
.bud-card h3 { display: flex; align-items: center; gap: 8px; }
.bud-nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0; }
.bud-nums dt { font-size: .7rem; color: var(--muted); }
.bud-nums dd { margin: 0; font-weight: 650; font-size: .88rem; }
@media (max-width: 380px) { .bud-nums { grid-template-columns: repeat(2, 1fr); } }
.bud-card.over { border-color: color-mix(in srgb, var(--expense) 50%, transparent); }
.bud-card.danger { border-color: color-mix(in srgb, var(--expense) 30%, transparent); }
.bud-card.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.nw-hero { display: flex; flex-direction: column; padding: 16px 18px; border-radius: var(--r-xl); background: var(--hero); color: var(--hero-ink); }
.nw-hero span { color: var(--hero-muted); font-size: .82rem; }
.nw-hero .amt { font-size: clamp(1.9rem, 8vw, 2.8rem); font-weight: 720; letter-spacing: -.03em; color: var(--hero-ink); }
.bs-row.static { cursor: default; }
.rank { list-style: none; margin: 0; padding: 0; }
.rank li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: .9rem; }
.rank li > span:first-child { display: flex; flex-direction: column; min-width: 0; }
.rank li .amt { font-weight: 650; margin-left: auto; }

/* Recurrentes */
.rec-list { list-style: none; margin: 0; padding: 0; }
.rec-row { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-2); }
.rec-row.inactive { opacity: .55; }
.rec-main { display: flex; flex-direction: column; min-width: 0; grid-column: 1 / -1; }
.rec-next { display: flex; flex-direction: column; font-size: .86rem; }
.rec-amt { display: flex; flex-direction: column; align-items: flex-end; font-weight: 650; }
.rec-row .icon-btn { grid-row: 2; grid-column: 3; }
.rec-row .rec-amt { grid-column: 2; grid-row: 2; }
.rec-row .pending-actions { grid-column: 1 / -1; }
@media (min-width: 700px) {
  .rec-row { grid-template-columns: minmax(0, 1fr) 120px 150px 40px; }
  .rec-main { grid-column: auto; }
  .rec-row .icon-btn, .rec-row .rec-amt { grid-row: auto; grid-column: auto; }
}
.subs-hero { padding: 16px 18px; border-radius: var(--r-lg); background: var(--accent-soft); }
.subs-hero p { margin: 0 0 4px; font-size: 1.02rem; }

/* Calendario */
.cal-layout { display: grid; gap: 14px; }
@media (min-width: 1000px) { .cal-layout { grid-template-columns: 1.6fr 1fr; align-items: start; } }
.cal-card { padding: 10px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal-wd { text-align: center; font-size: .72rem; color: var(--muted); font-weight: 600; padding: 4px 0; }
.cal-cell { aspect-ratio: 1 / 1.05; max-height: 78px; border: 1px solid transparent; border-radius: 10px; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 4px 2px; gap: 1px; cursor: pointer; min-width: 0; }
.cal-cell.empty { background: transparent; cursor: default; }
.cal-cell.today .cal-d { background: var(--ink); color: var(--bg); border-radius: 6px; padding: 0 5px; }
.cal-cell.sel { border-color: var(--accent); background: var(--accent-soft); }
.cal-d { font-size: .8rem; font-weight: 650; }
.cal-net { font-size: .62rem; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-dots { display: flex; gap: 2px; margin-top: auto; }
.cal-dots i, .cal-legend i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.k-in { background: var(--income); } .k-out { background: var(--expense); } .k-move { background: var(--neutral); } .k-sched { background: var(--saving); } .k-due { background: var(--warn); } .k-goal { background: var(--invest); }
.cal-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .74rem; color: var(--muted); margin-top: 10px; }
.cal-legend i { margin-right: 4px; }
.cal-day h2 { margin-bottom: 8px; }
.cal-items { list-style: none; margin: 0; padding: 0; }
.cal-sched { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line-2); font-size: .9rem; }
.cal-sched span:nth-child(2) { flex: 1; }

/* Indicadores */
.metrics { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.metric { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.metric-label { font-size: .82rem; color: var(--muted); font-weight: 560; }
.metric-value { font-size: 1.45rem; font-weight: 700; }
.metric-value small { font-size: .8rem; font-weight: 600; color: var(--ink-2); }
.metric details ul { list-style: none; margin: 6px 0 0; padding: 0; font-size: .82rem; }
.metric details li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.formula { font-size: .8rem; background: var(--surface-2); padding: 6px 8px; border-radius: 7px; margin: 6px 0 0; }
.ef-calc, .proj-controls { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); margin-bottom: 12px; }
.proj-controls .lbl b { color: var(--accent); }

/* Informes */
.report-controls { display: flex; gap: 8px; flex-wrap: wrap; }
.report-controls > select, .report-controls input { flex: 1 1 150px; width: auto; }
.report-controls [data-ref] { display: contents; }
.report header { margin-bottom: 14px; }
.rep-grid { display: grid; gap: 20px; }
@media (min-width: 800px) { .rep-grid { grid-template-columns: 1fr 1fr; } }
.rep-line { display: grid; grid-template-columns: 1fr auto 60px; gap: 8px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line-2); }
.rep-line > :last-child { text-align: right; }
.rep-cats { margin: 4px 0 14px; padding-left: 1.2em; }
.rep-cats li { padding: 4px 0; }
.rep-cats li { display: list-item; }
.rep-cats li span { margin-right: 8px; }
.rep-cats li small { margin-left: 6px; }
.report h3 { font-size: .85rem; color: var(--muted); }

/* Categorías y menú */
.cat-group h2 { margin: 4px 2px 8px; font-size: .85rem; color: var(--muted); }
.cat-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); overflow: hidden; }
.cat-row { display: grid; grid-template-columns: 14px 1fr auto auto; gap: 10px; align-items: center; width: 100%; padding: 11px 14px; background: none; border: 0; border-bottom: 1px solid var(--line-2); text-align: left; cursor: pointer; }
.cat-list li:last-child .cat-row { border-bottom: 0; }
.cat-row:hover { background: var(--surface-2); }
.cat-name { display: flex; flex-direction: column; font-weight: 600; min-width: 0; }
.cat-name small { font-weight: 400; font-size: .76rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-use { display: flex; flex-direction: column; align-items: flex-end; font-size: .78rem; color: var(--muted); }
.cat-use small { font-size: .72rem; }
@media (max-width: 480px) { .cat-row .badge { display: none; } .cat-row { grid-template-columns: 14px 1fr auto; } }
.menu-sec h2 { margin: 6px 2px 10px; font-size: .85rem; color: var(--muted); }
.menu-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.menu-tile { display: flex; align-items: center; gap: 10px; padding: 13px 12px; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); color: var(--ink); font-weight: 600; font-size: .9rem; text-decoration: none; }
.menu-tile .ico { color: var(--accent); }
.menu-tile:hover { text-decoration: none; background: var(--surface-2); }

/* Vacíos, alertas, banners */
.empty { text-align: center; padding: 30px 16px; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.empty .ico { width: 34px; height: 34px; color: var(--muted-line); }
.empty h3 { font-size: 1rem; }
.empty p { color: var(--muted); max-width: 46ch; font-size: .9rem; }
.empty .btn { margin-top: 6px; }
.alert { display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; font-size: .9rem; margin: 10px 0; }
.alert .ico { flex: none; margin-top: 2px; }
.alert ul { margin: 6px 0 0; padding-left: 1.1em; }
.alert.error { background: color-mix(in srgb, var(--expense) 12%, transparent); }
.alert.error .ico { color: var(--expense); }
.alert.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); }
.banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; font-size: .86rem; background: var(--accent-soft); border-bottom: 1px solid var(--line); }
.banner span { flex: 1; min-width: 200px; }
.banner.error { background: color-mix(in srgb, var(--expense) 14%, var(--surface)); }
.import-options { display: grid; gap: 12px; margin-top: 14px; }
@media (min-width: 640px) { .import-options { grid-template-columns: 1fr 1fr; } }
.import-options > div { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.import-options p { font-size: .85rem; color: var(--ink-2); flex: 1; }
.csv-errors { font-size: .82rem; max-height: 180px; overflow: auto; }
.danger-zone { border-color: color-mix(in srgb, var(--expense) 30%, transparent); }

/* ---------------- Modales ---------------- */
.modal-root { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(8, 14, 20, .45); opacity: 0; transition: opacity .18s; }
.modal {
  position: relative; width: 100%; max-height: 94vh; background: var(--surface); border-radius: 20px 20px 0 0; display: flex; flex-direction: column;
  transform: translateY(24px); opacity: 0; transition: transform .2s ease, opacity .2s ease; box-shadow: var(--shadow-lg);
  padding-bottom: env(safe-area-inset-bottom);
}
.modal-root.open .modal-backdrop { opacity: 1; }
.modal-root.open .modal { transform: none; opacity: 1; }
.modal-root.closing .modal { transform: translateY(24px); opacity: 0; }

    income:                { label: 'Ingreso',             short: 'Ingreso',     flow: 'income',  sign: +1, color: 'income' },
    expense:               { label: 'Gasto',               short: 'Gasto',       flow: 'expense', sign: -1, color: 'expense' },
    transfer:              { label: 'Transferencia',       short: 'Transferencia', flow: 'neutral', sign: 0, color: 'neutral' },
    saving:                { label: 'Ahorro',              short: 'Ahorro',      flow: 'neutral', sign: 0, color: 'saving' },
    investment:            { label: 'Inversión',           short: 'Inversión',   flow: 'neutral', sign: -1, color: 'invest' },
    investment_withdrawal: { label: 'Retiro de inversión', short: 'Retiro inv.', flow: 'neutral', sign: +1, color: 'invest' },
    debt_payment:          { label: 'Pago de deuda',       short: 'Pago deuda',  flow: 'neutral', sign: -1, color: 'debt' },
    loan_received:         { label: 'Préstamo recibido',   short: 'Préstamo rec.', flow: 'neutral', sign: +1, color: 'debt' },
    loan_given:            { label: 'Préstamo entregado',  short: 'Préstamo ent.', flow: 'neutral', sign: -1, color: 'debt' }
  };

  const ACCOUNT_TYPES = {
    bank:          { label: 'Cuenta bancaria',            purpose: 'spending' },
    savings:       { label: 'Cuenta de ahorro (reserva)', purpose: 'savings' },
    cash:          { label: 'Efectivo',                   purpose: 'spending' },
    wallet:        { label: 'Billetera digital',          purpose: 'spending' },
    investment:    { label: 'Cuenta de inversión',        purpose: 'investment' },
    goal_savings:  { label: 'Bolsillo / ahorro específico', purpose: 'savings' },
    other_liquid:  { label: 'Otro activo líquido',        purpose: 'spending' },
    credit_card:   { label: 'Tarjeta de crédito',         purpose: 'spending' }
  };
  const ACCOUNT_PURPOSES = {
    spending:   'Disponible (día a día)',
    savings:    'Ahorro',
    investment: 'Inversión'
  };

  const PAYMENT_METHODS = ['Débito', 'Tarjeta de crédito', 'Efectivo', 'Transferencia', 'PSE', 'Billetera digital', 'Débito automático', 'Otro'];
  const PERSONS = { personal: 'Personal', pareja: 'Pareja', familia: 'Familia', compartido: 'Compartido' };
  const NATURES = { fixed: 'Fijo', variable: 'Variable' };

  const FREQUENCIES = {
    weekly:     { label: 'Semanal',     perMonth: 52 / 12, step: { days: 7 } },
    biweekly:   { label: 'Quincenal',   perMonth: 26 / 12, step: { days: 14 } },
    monthly:    { label: 'Mensual',     perMonth: 1,       step: { months: 1 } },
    bimonthly:  { label: 'Bimestral',   perMonth: 1 / 2,   step: { months: 2 } },
    quarterly:  { label: 'Trimestral',  perMonth: 1 / 3,   step: { months: 3 } },
    semiannual: { label: 'Semestral',   perMonth: 1 / 6,   step: { months: 6 } },
    annual:     { label: 'Anual',       perMonth: 1 / 12,  step: { months: 12 } }
  };

  const INVESTMENT_TYPES = { etf: 'ETF', stock: 'Acción', fund: 'Fondo', yield_account: 'Cuenta remunerada', cdt: 'CDT', crypto: 'Criptomonedas', other: 'Otro' };
  const DEBT_KINDS = { credit_card: 'Tarjeta de crédito', consumer: 'Crédito de consumo', mortgage: 'Crédito hipotecario', vehicle: 'Crédito vehicular', student: 'Crédito educativo', personal: 'Préstamo personal', other: 'Otra' };
  const GOAL_KINDS = { emergency: 'Fondo de emergencia', computer: 'Comprar computador', travel: 'Viaje', vehicle: 'Comprar vehículo', investment: 'Inversión', housing: 'Vivienda', education: 'Educación', custom: 'Meta personalizada' };
  const ASSET_KINDS = { property: 'Inmueble', vehicle: 'Vehículo', receivable: 'Cuenta por cobrar', valuables: 'Bienes de valor', other_asset: 'Otro activo', other_liability: 'Otro pasivo' };

  // ---------- Categorías por defecto (ids estables) ----------
  const C = (id, name, group, kind, nature, subs, color) => ({ id: 'cat_' + id, name, group, kind, nature, subcategories: subs, color, system: true });
  const DEFAULT_CATEGORIES = [
    C('alimentacion', 'Alimentación', 'Necesidades', 'expense', 'variable', ['Mercado', 'Restaurante', 'Domicilios', 'Café y snacks'], '#2f7d5b'),
    C('vivienda', 'Vivienda', 'Necesidades', 'expense', 'fixed', ['Arriendo', 'Administración', 'Mantenimiento', 'Hipoteca'], '#35618f'),
    C('servicios', 'Servicios', 'Necesidades', 'expense', 'fixed', ['Energía', 'Agua', 'Gas', 'Internet'], '#4f86b8'),
    C('transporte', 'Transporte', 'Necesidades', 'expense', 'variable', ['Transporte público', 'Gasolina', 'Taxi / apps', 'Parqueadero', 'Mantenimiento vehículo'], '#c08a2b'),
    C('salud', 'Salud', 'Necesidades', 'expense', 'variable', ['Medicina prepagada', 'EPS', 'Medicamentos', 'Consultas'], '#c2554d'),
    C('educacion', 'Educación', 'Necesidades', 'expense', 'variable', ['Matrícula', 'Cursos', 'Libros', 'Materiales'], '#6b5bb5'),
    C('comunicaciones', 'Comunicaciones', 'Necesidades', 'expense', 'fixed', ['Celular', 'Plan de datos'], '#3d9aa5'),
    C('entretenimiento', 'Entretenimiento', 'Estilo de vida', 'expense', 'variable', ['Cine', 'Eventos', 'Salidas'], '#b5487a'),
    C('restaurantes', 'Restaurantes', 'Estilo de vida', 'expense', 'variable', ['Almuerzos', 'Cenas', 'Bares'], '#d0703a'),
    C('ropa', 'Ropa', 'Estilo de vida', 'expense', 'variable', ['Ropa', 'Calzado', 'Accesorios'], '#8a6d4b'),
    C('viajes', 'Viajes', 'Estilo de vida', 'expense', 'variable', ['Tiquetes', 'Alojamiento', 'Actividades'], '#2e8bb0'),
    C('suscripciones', 'Suscripciones', 'Estilo de vida', 'expense', 'fixed', ['Streaming', 'Música', 'Software', 'Gimnasio'], '#7a52a3'),
    C('compras', 'Compras', 'Estilo de vida', 'expense', 'variable', ['Hogar', 'Tecnología', 'Varios'], '#9a7b2f'),
    C('hobbies', 'Hobbies', 'Estilo de vida', 'expense', 'variable', ['Deporte', 'Juegos', 'Arte'], '#4d9a6a'),
    C('ahorro', 'Ahorro', 'Finanzas', 'expense', 'variable', [], '#3f7ec0'),
    C('inversiones', 'Inversiones', 'Finanzas', 'expense', 'variable', [], '#7454c2'),
    C('deudas', 'Deudas', 'Finanzas', 'expense', 'fixed', ['Intereses', 'Cuota de manejo', 'Seguros del crédito'], '#a8642a'),
    C('comisiones', 'Comisiones', 'Finanzas', 'expense', 'variable', ['Bancarias', '4x1000', 'Transferencias', 'Inversión'], '#7b8794'),
    C('impuestos', 'Impuestos', 'Finanzas', 'expense', 'variable', ['Renta', 'Predial', 'Vehicular'], '#5d6b7a'),
    C('regalos', 'Regalos', 'Otros', 'expense', 'variable', [], '#c25f8e'),
    C('emergencias', 'Emergencias', 'Otros', 'expense', 'variable', [], '#b23b3b'),
    C('otros', 'Otros', 'Otros', 'expense', 'variable', [], '#8b93a0'),
    // Ingresos
    C('salario', 'Salario', 'Ingresos', 'income', 'fixed', ['Nómina', 'Prima', 'Cesantías'], '#1f8a5b'),
    C('honorarios', 'Honorarios', 'Ingresos', 'income', 'variable', [], '#2a9d6f'),
    C('freelance', 'Freelance', 'Ingresos', 'income', 'variable', [], '#37a77c'),
    C('bonificaciones', 'Bonificaciones', 'Ingresos', 'income', 'variable', [], '#4bb08a'),
    C('intereses', 'Intereses', 'Ingresos', 'income', 'variable', [], '#5fb998'),
    C('dividendos', 'Dividendos', 'Ingresos', 'income', 'variable', [], '#73c2a6'),
    C('rendimientos', 'Rendimientos', 'Ingresos', 'income', 'variable', [], '#16704a'),
    C('regalos_ing', 'Regalos', 'Ingresos', 'income', 'variable', [], '#0f6040'),
    C('otros_ing', 'Otros ingresos', 'Ingresos', 'income', 'variable', [], '#6a8f7f')
  ];
  const EXPENSE_GROUPS = ['Necesidades', 'Estilo de vida', 'Finanzas', 'Otros'];
  const FALLBACK_EXPENSE_CATEGORY = 'cat_otros';
  const FALLBACK_INCOME_CATEGORY = 'cat_otros_ing';
  const INTEREST_CATEGORY = 'cat_deudas';

  const DEFAULT_SETTINGS = {
    id: 'main',
    currency: 'COP',
    emergencyMonths: 6,
    projectionMonths: 6,
    theme: 'auto',
    privacyNoticeSeen: false,
    lastBackupAt: null,
    schemaVersion: SCHEMA_VERSION
  };

  // ---------- Validación ----------
  function result(errors) { return { ok: Object.keys(errors).length === 0, errors }; }
  function checkAmount(errors, field, v, opts) {
    opts = opts || {};
    if (v === '' || v === null || v === undefined) { if (opts.required !== false) errors[field] = 'Este valor es obligatorio.'; return; }
    if (typeof v !== 'number' || !Number.isFinite(v)) { errors[field] = 'Escribe un número válido.'; return; }
    if (!opts.allowNegative && v < 0) { errors[field] = 'No puede ser negativo.'; return; }
    if (opts.positive && v <= 0) { errors[field] = 'Debe ser mayor que 0.'; return; }
    if (Math.abs(v) > MAX_AMOUNT) { errors[field] = 'El valor es demasiado grande (máximo ' + U.money(MAX_AMOUNT) + ').'; }
  }
  function checkText(errors, field, v, label, max, required) {
    if (required && (!v || !String(v).trim())) { errors[field] = label + ' es obligatorio.'; return; }
    if (v && String(v).length > (max || 200)) errors[field] = label + ' es demasiado largo (máx. ' + (max || 200) + ' caracteres).';
  }
  function checkDate(errors, field, v, required) {
    if (!v) { if (required) errors[field] = 'La fecha es obligatoria.'; return; }
    if (!U.isValidDate(v)) errors[field] = 'Fecha inválida.';
  }

  /**
   * Valida un movimiento. `ctx` permite comprobar integridad referencial:
   * { account(id), category(id), investment(id), debt(id), goal(id) } → registro o undefined.
   */
  function validateTransaction(tx, ctx) {
    const e = {};
    const t = TX_TYPES[tx.type];
    if (!t) e.type = 'Tipo de movimiento inválido.';
    checkDate(e, 'date', tx.date, true);
    checkAmount(e, 'amount', tx.amount, { positive: true });
    checkText(e, 'description', tx.description, 'La descripción', 200);
    checkText(e, 'notes', tx.notes, 'Las notas', 2000);
    if (tx.tags && (!Array.isArray(tx.tags) || tx.tags.length > 20)) e.tags = 'Etiquetas inválidas.';
    if (tx.person && !PERSONS[tx.person]) e.person = 'Valor inválido.';
    if (tx.nature && !NATURES[tx.nature]) e.nature = 'Valor inválido.';
    if (!t) return result(e);

    const acc = tx.accountId && ctx ? ctx.account(tx.accountId) : null;
    if (!tx.accountId) e.accountId = tx.type === 'investment_withdrawal' ? 'Elige la cuenta que recibe el dinero.' : 'Elige una cuenta.';
    else if (ctx && !acc) e.accountId = 'La cuenta no existe.';

    if (tx.type === 'income' || tx.type === 'expense') {
      if (!tx.categoryId) e.categoryId = 'Elige una categoría.';
      else if (ctx) {
        const c = ctx.category(tx.categoryId);
        if (!c) e.categoryId = 'La categoría no existe.';
        else if (c.kind !== tx.type) e.categoryId = tx.type === 'income' ? 'Elige una categoría de ingreso.' : 'Elige una categoría de gasto.';
      }
    } else if (tx.categoryId && ctx && !ctx.category(tx.categoryId)) {
      e.categoryId = 'La categoría no existe.';
    }

    if (tx.type === 'transfer' || tx.type === 'saving') {
      if (!tx.toAccountId) e.toAccountId = 'Elige la cuenta de destino.';
      else if (tx.toAccountId === tx.accountId) e.toAccountId = 'El origen y el destino deben ser distintos.';
      else if (ctx) {
        const to = ctx.account(tx.toAccountId);
        if (!to) e.toAccountId = 'La cuenta de destino no existe.';
        else if (acc && to.currency !== acc.currency) e.toAccountId = 'Las cuentas tienen monedas distintas; la app no convierte monedas.';
      }
      if (tx.goalId && ctx && !ctx.goal(tx.goalId)) e.goalId = 'La meta no existe.';
    }
    if (tx.type === 'investment' || tx.type === 'investment_withdrawal') {
      if (!tx.investmentId) e.investmentId = 'Elige una inversión.';
      else if (ctx && !ctx.investment(tx.investmentId)) e.investmentId = 'La inversión no existe.';
    }
    if (tx.type === 'debt_payment' || tx.type === 'loan_received' || tx.type === 'loan_given') {
      if (!tx.debtId) e.debtId = 'Elige una deuda o préstamo.';
      else if (ctx) {
        const d = ctx.debt(tx.debtId);
        if (!d) e.debtId = 'La deuda no existe.';
        else if (tx.type === 'loan_received' && d.direction !== 'payable') e.debtId = 'Un préstamo recibido debe asociarse a "Dinero que debo".';
        else if (tx.type === 'loan_given' && d.direction !== 'receivable') e.debtId = 'Un préstamo entregado debe asociarse a "Dinero que me deben".';
      }
      if (tx.type === 'debt_payment') {
        const i = tx.interestAmount === undefined || tx.interestAmount === null || tx.interestAmount === '' ? 0 : tx.interestAmount;
        checkAmount(e, 'interestAmount', i, { required: false });
        if (!e.interestAmount && !e.amount && i > tx.amount) e.interestAmount = 'Los intereses no pueden superar el valor del pago.';
      }
    }
    return result(e);
  }

  function validateAccount(a) {
    const e = {};
    checkText(e, 'name', a.name, 'El nombre', 60, true);
    if (!ACCOUNT_TYPES[a.type]) e.type = 'Tipo de cuenta inválido.';
    if (a.purpose && !ACCOUNT_PURPOSES[a.purpose]) e.purpose = 'Propósito inválido.';
    if (!U.CURRENCIES[a.currency]) e.currency = 'Moneda no soportada.';
    // Saldo inicial puede ser negativo (tarjeta de crédito o sobregiro).
    checkAmount(e, 'initialBalance', a.initialBalance, { allowNegative: true });
    checkDate(e, 'openedAt', a.openedAt, true);
    checkText(e, 'notes', a.notes, 'Las notas', 1000);
    return result(e);
  }

  function validateCategory(c, existing) {
    const e = {};
    checkText(e, 'name', c.name, 'El nombre', 40, true);
    if (c.kind !== 'income' && c.kind !== 'expense') e.kind = 'Tipo inválido.';
    if (c.nature && !NATURES[c.nature]) e.nature = 'Valor inválido.';
    if (!Array.isArray(c.subcategories)) e.subcategories = 'Subcategorías inválidas.';
    else if (c.subcategories.some(s => typeof s !== 'string' || !s.trim() || s.length > 40)) e.subcategories = 'Hay subcategorías vacías o demasiado largas.';
    if (!e.name && existing && existing.some(x => x.id !== c.id && x.kind === c.kind && U.normalizeText(x.name) === U.normalizeText(c.name))) e.name = 'Ya existe una categoría con ese nombre.';
    return result(e);
  }

  function validateRecurring(r, ctx) {
    const e = {};
    checkText(e, 'name', r.name, 'El nombre', 60, true);
    if (!FREQUENCIES[r.frequency]) e.frequency = 'Frecuencia inválida.';
    checkDate(e, 'nextDate', r.nextDate, true);
    checkDate(e, 'endDate', r.endDate, false);
    if (r.endDate && r.nextDate && U.isValidDate(r.endDate) && r.endDate < r.nextDate) e.endDate = 'La fecha final es anterior al próximo pago.';
    // Reutiliza la validación de movimientos para el "molde"
    const tv = validateTransaction(Object.assign({}, r, { date: r.nextDate }), ctx);
    for (const k of ['type', 'amount', 'accountId', 'toAccountId', 'categoryId', 'investmentId', 'debtId']) if (tv.errors[k]) e[k] = tv.errors[k];
    return result(e);
  }

  function validateBudget(b, ctx, existing) {
    const e = {};
    if (!b.categoryId) e.categoryId = 'Elige una categoría.';
    else if (ctx) {
      const c = ctx.category(b.categoryId);
      if (!c) e.categoryId = 'La categoría no existe.';
      else if (c.kind !== 'expense') e.categoryId = 'Los presupuestos aplican a categorías de gasto.';
    }
    if (!e.categoryId && existing && existing.some(x => x.id !== b.id && x.categoryId === b.categoryId)) e.categoryId = 'Ya hay un presupuesto para esa categoría.';
    checkAmount(e, 'amount', b.amount, { positive: true });
    return result(e);
  }

  function validateGoal(g, ctx) {
    const e = {};
    checkText(e, 'name', g.name, 'El nombre', 60, true);
    if (!GOAL_KINDS[g.kind]) e.kind = 'Tipo de meta inválido.';
    checkAmount(e, 'targetAmount', g.targetAmount, { positive: true });
    checkAmount(e, 'manualAmount', g.manualAmount || 0, {});
    checkAmount(e, 'monthlyContribution', g.monthlyContribution || 0, {});
    checkDate(e, 'targetDate', g.targetDate, false);
    if (g.accountId && ctx && !ctx.account(g.accountId)) e.accountId = 'La cuenta no existe.';
    checkText(e, 'notes', g.notes, 'Las notas', 1000);
    return result(e);
  }

  function validateInvestment(i) {
    const e = {};
    checkText(e, 'name', i.name, 'El nombre', 60, true);
    if (!INVESTMENT_TYPES[i.type]) e.type = 'Tipo inválido.';
    checkAmount(e, 'openingContributed', i.openingContributed, {});
    checkDate(e, 'startDate', i.startDate, true);
    if (!Array.isArray(i.valuations)) e.valuations = 'Valoraciones inválidas.';
    else for (const v of i.valuations) {
      if (!U.isValidDate(v.date) || typeof v.value !== 'number' || !Number.isFinite(v.value) || v.value < 0 || v.value > MAX_AMOUNT) { e.valuations = 'Hay una valoración inválida.'; break; }
    }
    checkText(e, 'notes', i.notes, 'Las notas', 1000);
    return result(e);
  }

  function validateDebt(d) {
    const e = {};
    checkText(e, 'name', d.name, 'El nombre', 60, true);
    checkText(e, 'counterparty', d.counterparty, d.direction === 'receivable' ? 'La persona' : 'El acreedor', 60, false);
    if (d.direction !== 'payable' && d.direction !== 'receivable') e.direction = 'Dirección inválida.';
    if (!DEBT_KINDS[d.kind]) e.kind = 'Tipo inválido.';
    checkAmount(e, 'principal', d.principal, {});
    checkAmount(e, 'openingBalance', d.openingBalance, {});
    checkAmount(e, 'monthlyPayment', d.monthlyPayment || 0, {});
    if (d.interestRate !== null && d.interestRate !== undefined && d.interestRate !== '') {
      if (typeof d.interestRate !== 'number' || !Number.isFinite(d.interestRate) || d.interestRate < 0 || d.interestRate > 1000) e.interestRate = 'Tasa inválida (0 a 1000% anual).';
    }
    checkDate(e, 'startDate', d.startDate, true);
    checkDate(e, 'endDate', d.endDate, false);
    if (d.dueDay !== null && d.dueDay !== undefined && d.dueDay !== '' && (!Number.isInteger(d.dueDay) || d.dueDay < 1 || d.dueDay > 31)) e.dueDay = 'Día entre 1 y 31.';
    return result(e);
  }

  function validateAsset(a) {
    const e = {};
    checkText(e, 'name', a.name, 'El nombre', 60, true);
    if (!ASSET_KINDS[a.kind]) e.kind = 'Tipo inválido.';
    if (!Array.isArray(a.valuations) || !a.valuations.length) e.valuations = 'Registra al menos un valor.';
    else for (const v of a.valuations) {
      if (!U.isValidDate(v.date) || typeof v.value !== 'number' || !Number.isFinite(v.value) || v.value < 0 || v.value > MAX_AMOUNT) { e.valuations = 'Hay un valor inválido.'; break; }
    }
    return result(e);
  }

  const VALIDATORS = {
    accounts: validateAccount, categories: validateCategory, transactions: validateTransaction,
    recurring: validateRecurring, budgets: validateBudget, goals: validateGoal,
    investments: validateInvestment, debts: validateDebt, assets: validateAsset
  };

  F.schema = {
    SCHEMA_VERSION, MAX_AMOUNT, STORES, TX_TYPES, ACCOUNT_TYPES, ACCOUNT_PURPOSES, PAYMENT_METHODS, PERSONS, NATURES,
    FREQUENCIES, INVESTMENT_TYPES, DEBT_KINDS, GOAL_KINDS, ASSET_KINDS, DEFAULT_CATEGORIES, EXPENSE_GROUPS,
    FALLBACK_EXPENSE_CATEGORY, FALLBACK_INCOME_CATEGORY, INTEREST_CATEGORY, DEFAULT_SETTINGS,
    validateTransaction, validateAccount, validateCategory, validateRecurring, validateBudget, validateGoal,
    validateInvestment, validateDebt, validateAsset, VALIDATORS
  };
})(typeof window !== 'undefined' ? (window.FIN = window.FIN || {}) : (globalThis.FIN = globalThis.FIN || {}));

  <script>
/* js/storage/adapters.js */
/* =========================================================================
 * storage/adapters.js — Adaptadores de persistencia intercambiables.
 *
 * Todos implementan la misma interfaz asíncrona:
 *   open() · getAll(store) · put(store, record) · bulkPut(store, records)
 *   delete(store, id) · bulkDelete(store, ids) · clear(store)
 *   replaceAll(dataByStore) · estimate()
 *
 * Para migrar a un backend basta con escribir un ApiAdapter con estos
 * mismos métodos (p. ej. GET /api/:store, PUT /api/:store/:id ...).
 * ========================================================================= */
(function (F) {
  'use strict';

  const DB_NAME = 'finanzas-personales';
  const DB_VERSION = 1;

  // ---------------- IndexedDB ----------------
  function IndexedDBAdapter(stores) {
    this.stores = stores;
    this.db = null;
    this.kind = 'indexeddb';
  }
  function req2promise(req) {
    return new Promise((resolve, reject) => {
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  function txDone(tx) {
    return new Promise((resolve, reject) => {
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error('Transacción cancelada'));
    });
  }
  IndexedDBAdapter.prototype.open = function () {
    const self = this;
    return new Promise((resolve, reject) => {
      if (typeof indexedDB === 'undefined') return reject(new Error('IndexedDB no está disponible en este navegador.'));
      let request;
      try { request = indexedDB.open(DB_NAME, DB_VERSION); } catch (err) { return reject(err); }
      request.onupgradeneeded = (ev) => {
        const db = request.result;
        // Migraciones por versión: añadir aquí futuros cambios de esquema.
        if (ev.oldVersion < 1) {
          for (const s of self.stores) {
            if (!db.objectStoreNames.contains(s)) {
              const os = db.createObjectStore(s, { keyPath: 'id' });
              if (s === 'transactions') { os.createIndex('date', 'date'); os.createIndex('accountId', 'accountId'); }
            }
          }
        }
      };
      request.onsuccess = () => {
        self.db = request.result;
        self.db.onversionchange = () => { self.db.close(); };
        resolve(self);
      };
      request.onerror = () => reject(request.error);
      request.onblocked = () => reject(new Error('La base de datos está bloqueada por otra pestaña.'));
    });
  };
  IndexedDBAdapter.prototype.getAll = function (store) {
    const tx = this.db.transaction(store, 'readonly');
    return req2promise(tx.objectStore(store).getAll());
  };
  IndexedDBAdapter.prototype.put = function (store, record) { return this.bulkPut(store, [record]); };
  IndexedDBAdapter.prototype.bulkPut = function (store, records) {
    const tx = this.db.transaction(store, 'readwrite');
    const os = tx.objectStore(store);
    for (const r of records) os.put(r);
    return txDone(tx);
  };

  <script>
/* js/storage/store.js */
/* =========================================================================
 * storage/store.js — Repositorio de datos.
 *
 * - Mantiene una copia en memoria (caché) de todas las colecciones para que
 *   los análisis sean instantáneos, y escribe cada cambio en el adaptador
 *   (IndexedDB). La interfaz nunca habla con IndexedDB directamente.
 * - Valida cada registro antes de guardarlo y protege la integridad
 *   referencial (no se puede borrar una cuenta con movimientos, etc.).
 * - Emite eventos 'change' para que la UI se actualice.
 * ========================================================================= */
(function (F) {
  'use strict';
  const U = F.utils, S = F.schema;

  function ValidationError(errors, message) {
    this.name = 'ValidationError';
    this.errors = errors || {};
    this.message = message || Object.values(this.errors)[0] || 'Datos inválidos.';
  }
  ValidationError.prototype = Object.create(Error.prototype);

  const Store = {
    adapter: null,
    cache: {},
    index: {},
    listeners: [],
    ready: false,

    async init(adapter) {
      this.adapter = await adapter.open();
      for (const s of S.STORES) {
        const rows = await this.adapter.getAll(s);
        this._setCache(s, rows);
      }
      // Primer uso: configuración y categorías por defecto.
      if (!this.index.settings.get('main')) {
        const st = Object.assign({}, S.DEFAULT_SETTINGS, { createdAt: new Date().toISOString() });
        await this.adapter.put('settings', st);
        this._setCache('settings', [st]);
      }
      if (this.cache.categories.length === 0 && !this.settings().categoriesSeeded) {
        const now = new Date().toISOString();
        const cats = S.DEFAULT_CATEGORIES.map(c => Object.assign({}, U.deepClone(c), { createdAt: now, updatedAt: now }));
        await this.adapter.bulkPut('categories', cats);
        this._setCache('categories', cats);
        await this.saveSettings({ categoriesSeeded: true });

      U.setBaseCurrency(this.settings().currency);
      this.ready = true;
      this.emit({ store: '*', action: 'init' });
      return this;
    },

    _setCache(store, rows) {
      this.cache[store] = rows;
      this.index[store] = new Map(rows.map(r => [r.id, r]));
    },
    _upsertCache(store, rec) {
      if (this.index[store].has(rec.id)) {
        const i = this.cache[store].findIndex(r => r.id === rec.id);
        this.cache[store][i] = rec;
      } else this.cache[store].push(rec);
      this.index[store].set(rec.id, rec);
    },
    _removeCache(store, ids) {
      const set = new Set(ids);
      this.cache[store] = this.cache[store].filter(r => !set.has(r.id));
      for (const id of ids) this.index[store].delete(id);
    },

    on(fn) { this.listeners.push(fn); return () => { this.listeners = this.listeners.filter(f => f !== fn); }; },
    emit(detail) { for (const fn of this.listeners) { try { fn(detail); } catch (e) { console.error(e); } } },

    all(store) { return this.cache[store] || []; },
    get(store, id) { return id ? this.index[store].get(id) : undefined; },
    settings() { return this.index.settings.get('main') || S.DEFAULT_SETTINGS; },

    /** Contexto de búsqueda para validaciones referenciales. */
    ctx() {
      return {
        account: id => this.get('accounts', id),
        category: id => this.get('categories', id),
        investment: id => this.get('investments', id),
        debt: id => this.get('debts', id),
        goal: id => this.get('goals', id)
      };
    },

    validate(store, rec) {
      const v = S.VALIDATORS[store];
      if (!v) return { ok: true, errors: {} };
      if (store === 'categories') return v(rec, this.all('categories'));
      if (store === 'budgets') return v(rec, this.ctx(), this.all('budgets'));
      if (store === 'accounts' || store === 'investments' || store === 'debts' || store === 'assets') return v(rec);
      return v(rec, this.ctx());
    },

    /** Crea o actualiza un registro después de validarlo. Devuelve el registro guardado. */
    async save(store, record) {
      const rec = U.deepClone(record);
      const isNew = !rec.id || !this.index[store].has(rec.id);
      if (!rec.id) rec.id = U.uid(store.slice(0, 3));
      const v = this.validate(store, rec);
      if (!v.ok) throw new ValidationError(v.errors);
      const nowIso = new Date().toISOString();
      if (isNew) rec.createdAt = rec.createdAt || nowIso;
      rec.updatedAt = nowIso;
      await this.adapter.put(store, rec);
      this._upsertCache(store, rec);
      this.emit({ store, action: isNew ? 'create' : 'update', id: rec.id });
      return rec;
    },

    /** Guarda muchos registros de una vez (importaciones). Deben venir ya validados. */
    async saveMany(store, records) {
      const nowIso = new Date().toISOString();
      const recs = records.map(r => Object.assign({ createdAt: nowIso }, U.deepClone(r), { updatedAt: r.updatedAt || nowIso }));
      await this.adapter.bulkPut(store, recs);
      for (const r of recs) this._upsertCache(store, r);
      this.emit({ store, action: 'bulk' });
      return recs;
    },

    async saveSettings(patch) {
      const st = Object.assign({}, this.settings(), patch, { id: 'main', updatedAt: new Date().toISOString() });
      if (!U.CURRENCIES[st.currency]) throw new ValidationError({ currency: 'Moneda no soportada.' });
      await this.adapter.put('settings', st);
      this._upsertCache('settings', st);
      U.setBaseCurrency(st.currency);
      this.emit({ store: 'settings', action: 'update' });
      return st;
    },

    /** Lista de usos de un registro (para impedir borrados que romperían datos). */
    usages(store, id) {
      const tx = this.all('transactions'), rc = this.all('recurring');
      switch (store) {
        case 'accounts': return {
          transactions: tx.filter(t => t.accountId === id || t.toAccountId === id).length,
          recurring: rc.filter(r => r.accountId === id || r.toAccountId === id).length,
          goals: this.all('goals').filter(g => g.accountId === id).length
        };
        case 'categories': return {
          transactions: tx.filter(t => t.categoryId === id).length,
          recurring: rc.filter(r => r.categoryId === id).length,
          budgets: this.all('budgets').filter(b => b.categoryId === id).length
        };
        case 'investments': return { transactions: tx.filter(t => t.investmentId === id).length, recurring: rc.filter(r => r.investmentId === id).length };
        case 'debts': return { transactions: tx.filter(t => t.debtId === id).length, recurring: rc.filter(r => r.debtId === id).length };
        case 'goals': return { transactions: tx.filter(t => t.goalId === id).length };
        default: return {};
      }
    },

    /**
     * Elimina un registro.
     * opts.replacementCategoryId: para categorías en uso, reasigna sus movimientos.
     * opts.cascade: para inversiones/deudas, elimina también sus movimientos.
     */
    async remove(store, id, opts) {
      opts = opts || {};
      const rec = this.get(store, id);
      if (!rec) return;
      const ops = [];
      const u = this.usages(store, id);
      if (store === 'accounts' && (u.transactions || u.recurring)) {
        throw new ValidationError({}, 'La cuenta tiene ' + u.transactions + ' movimiento(s) y ' + u.recurring + ' recurrente(s). Archívala en lugar de eliminarla para conservar el histórico.');
      }
      if (store === 'accounts' && u.goals) {
        ops.push({ store: 'goals', put: this.all('goals').filter(g => g.accountId === id).map(g => Object.assign({}, g, { accountId: null })) });
      }
      if (store === 'categories') {
        if (rec.id === S.FALLBACK_EXPENSE_CATEGORY || rec.id === S.FALLBACK_INCOME_CATEGORY) throw new ValidationError({}, 'Esta categoría se usa como respaldo y no se puede eliminar.');
        if (u.transactions || u.recurring) {
          const rep = this.get('categories', opts.replacementCategoryId);
          if (!rep || rep.kind !== rec.kind || rep.id === id) throw new ValidationError({}, 'Elige una categoría de reemplazo del mismo tipo.');
          ops.push({ store: 'transactions', put: this.all('transactions').filter(t => t.categoryId === id).map(t => Object.assign({}, t, { categoryId: rep.id, subcategory: '' })) });
          ops.push({ store: 'recurring', put: this.all('recurring').filter(r => r.categoryId === id).map(r => Object.assign({}, r, { categoryId: rep.id, subcategory: '' })) });
        }
        if (u.budgets) ops.push({ store: 'budgets', del: this.all('budgets').filter(b => b.categoryId === id).map(b => b.id) });
      }
      if ((store === 'investments' || store === 'debts') && (u.transactions || u.recurring)) {
        if (!opts.cascade) throw new ValidationError({}, 'Tiene ' + u.transactions + ' movimiento(s) asociados.');
        const key = store === 'investments' ? 'investmentId' : 'debtId';
        ops.push({ store: 'transactions', del: this.all('transactions').filter(t => t[key] === id).map(t => t.id) });
        ops.push({ store: 'recurring', del: this.all('recurring').filter(r => r[key] === id).map(r => r.id) });
      }
      if (store === 'goals' && u.transactions) {
        ops.push({ store: 'transactions', put: this.all('transactions').filter(t => t.goalId === id).map(t => Object.assign({}, t, { goalId: null })) });
      }
      ops.push({ store, del: [id] });
      await this.adapter.batch(ops);
      this._applyOps(ops);
      this.emit({ store, action: 'delete', id });
    },

    async removeMany(store, ids) {
      await this.adapter.bulkDelete(store, ids);
      this._removeCache(store, ids);
      this.emit({ store, action: 'bulk-delete' });
    },

    _applyOps(ops) {
      for (const o of ops) {
        for (const r of o.put || []) this._upsertCache(o.store, r);
        if (o.del && o.del.length) this._removeCache(o.store, o.del);
      }
    },

    /** Copia completa de los datos (para respaldos). */
    snapshot() {
      const out = {};
      for (const s of S.STORES) out[s] = U.deepClone(this.all(s));
      return out;
    },

    /** Reemplaza TODO de forma atómica. */
    async replaceAll(data) {
      const clean = {};
      for (const s of S.STORES) clean[s] = Array.isArray(data[s]) ? data[s] : [];
      if (!clean.settings.find(x => x.id === 'main')) clean.settings.push(Object.assign({}, this.settings()));
      await this.adapter.replaceAll(clean);
      for (const s of S.STORES) this._setCache(s, U.deepClone(clean[s]));
      U.setBaseCurrency(this.settings().currency);
      this.emit({ store: '*', action: 'replace' });
    },

    /** Combina registros sin borrar nada: agrega los ids nuevos y conserva los existentes. */
    async merge(data) {
      const ops = [];
      const counts = {};
      for (const s of S.STORES) {
        if (s === 'settings') continue;
        const incoming = (data[s] || []).filter(r => r && r.id && !this.index[s].has(r.id));
        counts[s] = incoming.length;
        if (incoming.length) ops.push({ store: s, put: incoming });
      }
      await this.adapter.batch(ops);
      this._applyOps(ops);
      this.emit({ store: '*', action: 'merge' });
      return counts;
    },

    /**
     * Elimina únicamente los datos de demostración (isDemo === true).
     * Si un dato real usa una cuenta/inversión/deuda de demostración, esa entidad
     * se conserva y se convierte en real para no dejar movimientos huérfanos.
