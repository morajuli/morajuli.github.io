    const future = tx.date > U.today() ? '<span class="badge">Programado</span>' : '';
    const flags = (tx.recurringId ? ui.icon('repeat', 'tiny') : '') + (tx.isDemo ? '<span class="badge muted">demo</span>' : '');
    const interest = tx.type === 'debt_payment' && tx.interestAmount > 0 ? '<span class="tags">incluye ' + esc(U.money(tx.interestAmount)) + ' de intereses</span>' : '';
    return '<button class="tx-row" data-edit-tx="' + esc(tx.id) + '">' +
      '<span class="tx-ico t-' + t.color + '"' + (color ? ' style="--c:' + esc(color) + '"' : '') + '>' + ui.icon(TYPE_ICON[tx.type]) + '</span>' +
      '<span class="tx-main"><span class="tx-title">' + esc(txTitle(tx)) + flags + '</span><span class="tx-meta">' + esc(txMeta(tx, opts)) + '</span>' + tags + interest + '</span>' +
      '<span class="tx-amt">' + amount + future + '</span></button>';
  }
  /** Lista agrupada por día con total del día (solo ingresos − gastos). */
  function txList(list, opts) {
    opts = opts || {};
    if (!list.length) return opts.empty || ui.emptyState('list', 'Sin movimientos', 'Registra tu primer movimiento con el botón +.');
    let h = '<div class="tx-list">';
    let day = null;
    const limit = opts.limit || list.length;
    const byDay = new Map();
    for (const tx of list.slice(0, limit)) { if (!byDay.has(tx.date)) byDay.set(tx.date, []); byDay.get(tx.date).push(tx); }
    for (const [d, items] of byDay) {
      day = d;
      const net = items.reduce((a, t) => a + txSign(t) * t.amount + (t.type === 'debt_payment' ? 0 : 0), 0);
      h += '<div class="tx-day"><span>' + esc(U.relativeDayLabel(d)) + '</span>' + (net ? ui.amt(net, { sign: true }) : '') + '</div>';
      h += items.map(t => txRow(t)).join('');
    }
    void day;
    return h + '</div>';
  }

  function barRow(label, amount, pct, color, extra) {
    return '<div class="bar-row"><div class="bar-top"><span class="bar-label">' + (color ? '<i class="dot" style="background:' + esc(color) + '"></i>' : '') + esc(label) + '</span><span class="bar-val">' + ui.amt(amount) + (extra || '') + '</span></div>' +
      '<div class="bar-track"><span style="width:' + U.clamp(pct, 0, 100).toFixed(1) + '%;' + (color ? 'background:' + esc(color) : '') + '"></span></div></div>';
  }

  function quickActions() {
    const items = [['expense', 'Gasto'], ['income', 'Ingreso'], ['transfer', 'Transferencia'], ['saving', 'Ahorro'], ['investment', 'Inversión'], ['debt_payment', 'Deuda']];
    return '<div class="quick">' + items.map(([k, l]) => '<button class="quick-btn t-' + S.TX_TYPES[k].color + '" data-add-tx="' + k + '">' + ui.icon('plus') + l + '</button>').join('') + '</div>';
  }

  function deltaLine(cur, prev, label, invert) {
    const p = U.pctChange(cur, prev);
    return ui.delta(p, { invert }) + ' <span class="muted">' + esc(label) + '</span>';
  }

  /** Comparación tabular: métrica | actual | referencia | variación */
  function compareTable(rows, curLabel, refLabel) {
    return '<div class="table-wrap"><table class="tbl"><thead><tr><th></th><th>' + esc(curLabel) + '</th><th>' + esc(refLabel) + '</th><th>Variación</th></tr></thead><tbody>' +
      rows.map(r => '<tr><th>' + esc(r[0]) + '</th><td>' + (r.pct ? U.pct(r[1]) : ui.amt(r[1])) + '</td><td>' + (r[2] === null || r[2] === undefined ? '—' : r.pct ? U.pct(r[2]) : ui.amt(r[2])) + '</td><td>' +
        (r.pct ? (r[1] !== null && r[2] !== null && r[1] !== undefined && r[2] !== undefined ? U.plainNumber(r[1] - r[2], 1) + ' pp' : '—') : ui.delta(U.pctChange(r[1], r[2]), { invert: r.invert })) + '</td></tr>').join('') + '</tbody></table></div>';
  }

  F.vh = { card, kpi, pageHead, monthPicker, yearPicker, txRow, txList, txSign, txTitle, barRow, quickActions, deltaLine, compareTable, TYPE_ICON };
})(typeof window !== 'undefined' ? (window.FIN = window.FIN || {}) : (globalThis.FIN = globalThis.FIN || {}));

</script>
  <script>
/* js/ui/views/dashboard.js */
/* =========================================================================
 * ui/views/dashboard.js — Pantalla de inicio: lo más importante primero.
 * ========================================================================= */
(function (F) {
  'use strict';
  const U = F.utils, L = F.ledger, A = F.analytics, R = F.recurring, St = F.Store, ui = F.ui, vh = F.vh;
  const esc = U.escapeHTML;

  function welcome() {
    return '<section class="welcome">' +
      '<h1>Tu sistema financiero personal</h1>' +
      '<p>Registra ingresos, gastos, ahorro, inversiones y deudas. Con el tiempo verás cómo evolucionan tu flujo de caja y tu patrimonio.</p>' +
      '<div class="privacy-note">' + ui.icon('lock') + '<div><strong>Tus datos se quedan en este dispositivo.</strong> Se guardan en el almacenamiento local del navegador (IndexedDB). No se envían a ningún servidor, no hay analítica ni publicidad. Exporta respaldos con frecuencia.</div></div>' +
      '<ol class="steps"><li><strong>Crea tus cuentas</strong> con su saldo de hoy (banco, Nequi, efectivo, tarjeta…).</li><li><strong>Registra movimientos</strong> con el botón <b>+</b>: valor, categoría, cuenta y listo.</li><li><strong>Añade</strong> metas, presupuestos, inversiones y deudas cuando quieras.</li></ol>' +
      '<div class="welcome-actions"><button class="btn primary" data-act="new-account">' + ui.icon('wallet') + 'Crear mi primera cuenta</button>' +
      '<button class="btn" data-act="load-demo">Cargar datos de ejemplo</button>' +
      '<button class="btn ghost" data-act="import-backup">' + ui.icon('upload') + 'Importar respaldo</button></div></section>';
  }

  function pendingBlock() {
    const pend = R.pending(St);
    if (!pend.length) return '';
    const shown = pend.slice(0, 5);
    return vh.card('Pendientes por confirmar', '<div class="pending-list">' + shown.map(p => {
      const r = p.rule;
      const sign = r.type === 'income' ? 1 : r.type === 'expense' || r.type === 'debt_payment' ? -1 : 0;
      return '<div class="pending"><div><strong>' + esc(r.name) + '</strong><span class="muted">' + esc(U.relativeDayLabel(p.date)) + ' · ' + esc(F.schema.TX_TYPES[r.type].label) + '</span></div>' +
        '<span>' + (sign ? ui.amt(sign * r.amount, { sign: true, colored: true }) : ui.amt(r.amount)) + '</span>' +
        '<div class="pending-actions"><button class="btn small primary" data-confirm-rec="' + esc(r.id) + '">Registrar</button><button class="btn small ghost" data-edit-rec-tx="' + esc(r.id) + '">Editar</button><button class="btn small ghost" data-skip-rec="' + esc(r.id) + '">Omitir</button></div></div>';
    }).join('') + (pend.length > shown.length ? '<p class="muted small">Y ' + (pend.length - shown.length) + ' más.</p>' : '') + '</div>', { cls: 'pending-card', icon: 'clock', sub: 'Pagos recurrentes cuya fecha ya llegó. Confirma para registrarlos con el valor real.' });
  }

  function hero() {
    const nw = L.netWorthAt(St, U.today());
    const first = L.firstDataMonth(St);
    const keys = U.monthRange(U.addMonthKey(U.currentMonthKey(), -11) > first ? U.addMonthKey(U.currentMonthKey(), -11) : first, U.currentMonthKey());
    const series = keys.map(k => L.netWorthAt(St, U.monthEnd(k) > U.today() ? U.today() : U.monthEnd(k)).netWorth);
    const prev = L.netWorthAt(St, U.addDays(U.monthStart(U.currentMonthKey()), -1)).netWorth;
    const diff = nw.netWorth - prev;
    window.__heroSpark = series;
    return '<section class="hero">' +
      '<div class="hero-top"><div><span class="hero-label">Patrimonio neto</span><div class="hero-value">' + ui.amt(nw.netWorth) + '</div>' +
      '<span class="hero-sub">' + (prev !== 0 || diff !== 0 ? (diff >= 0 ? '+' : '−') + esc(U.money(Math.abs(diff))) + ' en ' + esc(U.MONTHS[Number(U.today().slice(5, 7)) - 1]) + '<br>' : '') + 'Activos ' + esc(U.money(nw.assets, { compact: true })) + ' − Pasivos ' + esc(U.money(nw.liabilities, { compact: true })) + '</span></div>' +
      '<div class="hero-spark" data-chart-spark></div></div>' +
      '<div class="hero-grid">' +
      '<a href="#/cuentas" class="hero-stat"><span>Disponible</span>' + ui.amt(nw.available) + '</a>' +
      '<a href="#/metas" class="hero-stat"><span>Ahorrado</span>' + ui.amt(nw.savings) + '</a>' +
      '<a href="#/inversiones" class="hero-stat"><span>Invertido</span>' + ui.amt(nw.invested) + '</a>' +
      '<a href="#/deudas" class="hero-stat"><span>Deudas</span>' + ui.amt(nw.debts + nw.cardDebt) + '</a>' +
      '</div>' + (nw.foreign.length ? '<p class="hero-foot">' + ui.icon('info', 'tiny') + ' ' + nw.foreign.length + ' cuenta(s) en otra moneda no se suman (sin conversión).</p>' : '') + '</section>';
  }

  function monthBlock() {
    const key = U.currentMonthKey();
    const ma = A.monthAnalysis(St, key);
    const c = ma.cur, v = ma.vsPrev;
    const d = (m, inv) => ui.delta(v[m].pct, { invert: inv, title: 'vs ' + ma.prevLabel });
    const body = '<div class="kpis six">' +
      vh.kpi('Ingresos', ui.amt(c.income), d('income')) +
      vh.kpi('Gastos', ui.amt(c.expense), d('expense', true)) +
      vh.kpi('Flujo de caja', ui.amt(c.net, { colored: true }), 'Ingresos − Gastos') +
      vh.kpi('Ahorro', ui.amt(c.saving), d('saving')) +
      vh.kpi('Inversión', ui.amt(c.investment), d('investment')) +
      vh.kpi('Tasa de ahorro', U.pct(c.savingsRate, 0), c.income ? '(I − G) ÷ I' : 'sin ingresos aún') +
      '</div><p class="foot-note">Variación frente a ' + esc(ma.prevLabel) + '. Las transferencias entre tus cuentas no cuentan como ingreso ni gasto.</p>';
    return vh.card('Resumen de ' + U.monthLabel(key).toLowerCase(), body, { action: '<a class="link" href="#/mes">Análisis del mes</a>' });
  }

  function marginBlock() {
    const m = A.monthMargin(St);
    const row = (l, v, cls) => '<div class="calc-row ' + (cls || '') + '"><span>' + esc(l) + '</span>' + ui.amt(v) + '</div>';
    const body = '<div class="margin-value ' + (m.margin < 0 ? 'neg' : '') + '">' + ui.amt(m.margin) + '</div>' +
      '<details class="calc"><summary>Cómo se calcula</summary>' +
      row('Ingresos registrados', m.income) + (m.scheduledIn ? row('+ Ingresos programados pendientes', m.scheduledIn) : '') +
      row('− Gastos del mes', m.expense) + row('− Ahorro, inversión y abonos a capital', m.committed) +
      row('− Pagos programados pendientes', m.scheduled) + row('− Aportes a metas pendientes', m.goalsPending) + row('= Margen', m.margin, 'total') + '</details>';
    return vh.card('Margen del mes', '<p class="card-sub">Lo que queda del mes después de tus gastos, compromisos programados y aportes a metas. Es un cálculo, no una recomendación.</p>' + body, { icon: 'target' });
  }

  function categoriesBlock() {
    const key = U.currentMonthKey();
    const es = A.expenseStats(St, key);
    if (!es.total) return vh.card('Gastos por categoría', ui.emptyState('pie', 'Sin gastos este mes', 'Cuando registres gastos verás aquí en qué se va tu dinero.'));
    const budgets = St.all('budgets');
    const bmap = new Map(budgets.map(b => [b.categoryId, b]));
    const list = es.categories.slice(0, 6).map(c => {
      const b = bmap.get(c.id);
      const extra = b ? ' <small class="muted">de ' + esc(U.money(b.amount, { compact: true })) + '</small>' : '';
      return vh.barRow(c.name, c.amount, b ? c.amount / b.amount * 100 : c.share, c.color, extra);
    }).join('');
    return vh.card('Gastos por categoría', '<div class="split"><div data-chart-donut></div><div class="bars">' + list + '</div></div>', { action: '<a class="link" href="#/gastos">Ver gastos</a>' });
  }

  function insightsBlock() {
    const ins = A.insights(St).slice(0, 5);
    if (!ins.length) return '';
    return vh.card('Patrones', '<ul class="insights">' + ins.map(i => '<li class="ins ' + i.dir + '">' + esc(i.text) + '</li>').join('') + '</ul>', { action: '<a class="link" href="#/mes">Más</a>', icon: 'pulse' });
  }

  function balanceSheet() {
    const nw = L.netWorthAt(St, U.today());
    const row = (l, v, href) => '<a class="bs-row" href="' + href + '"><span>' + esc(l) + '</span>' + ui.amt(v) + '</a>';
    return vh.card('Resumen actual', '<div class="bs">' +
      '<div class="bs-col"><h3>Activos</h3>' + row('Dinero en cuentas', nw.spending, '#/cuentas') + row('Efectivo', nw.cash, '#/cuentas') + row('Ahorros', nw.savings, '#/cuentas') +
      row('Inversiones', nw.invested, '#/inversiones') + (nw.receivables ? row('Dinero que me deben', nw.receivables, '#/deudas') : '') + (nw.otherAssets ? row('Otros activos', nw.otherAssets, '#/patrimonio') : '') +
      '<div class="bs-total"><span>Total activos</span>' + ui.amt(nw.assets) + '</div></div>' +
      '<div class="bs-col"><h3>Pasivos</h3>' + row('Tarjetas de crédito', nw.cardDebt, '#/cuentas') + row('Deudas y préstamos', nw.debts, '#/deudas') + (nw.otherLiabilities ? row('Otros pasivos', nw.otherLiabilities, '#/patrimonio') : '') +
      '<div class="bs-total"><span>Total pasivos</span>' + ui.amt(nw.liabilities) + '</div></div></div>' +
      '<div class="bs-net"><span>Patrimonio neto = Activos − Pasivos</span>' + ui.amt(nw.netWorth) + '</div>', { action: '<a class="link" href="#/patrimonio">Evolución</a>' });
  }

  function goalsBlock() {
    const goals = St.all('goals').filter(g => !g.archived);
    if (!goals.length) return '';
    return vh.card('Metas', '<div class="goal-mini">' + goals.slice(0, 4).map(g => {
      const p = L.goalProgress(St, g);
      return '<a href="#/metas" class="gm"><div class="gm-top"><span>' + esc(g.name) + '</span><b>' + U.pct(p.pct, 0) + '</b></div>' + ui.progress(p.pct, p.completed ? 'done' : '') + '<span class="muted small">' + esc(U.money(p.current)) + ' de ' + esc(U.money(p.target)) + '</span></a>';
    }).join('') + '</div>', { action: '<a class="link" href="#/metas">Ver metas</a>' });
  }

  function upcomingBlock() {
    const up = R.upcoming(St, 14);
    const debts = St.all('debts').filter(d => d.direction === 'payable' && d.dueDay && !d.archived && L.debtBalanceAt(St, d, U.today()) > 0 && !St.all('recurring').some(r => r.debtId === d.id && r.active));
    const items = up.map(o => ({ date: o.date, name: o.rule.name, amount: o.rule.amount, type: o.rule.type }));
    for (const d of debts) {
      let due = U.today().slice(0, 8) + U.pad(Math.min(d.dueDay, U.daysInMonth(U.currentMonthKey())));
      if (due <= U.today()) { const nk = U.addMonthKey(U.currentMonthKey(), 1); due = nk + '-' + U.pad(Math.min(d.dueDay, U.daysInMonth(nk))); }
      if (U.daysBetween(U.today(), due) <= 14) items.push({ date: due, name: 'Cuota ' + d.name, amount: d.monthlyPayment, type: 'debt_payment' });
    }
    if (!items.length) return '';
    items.sort((a, b) => a.date < b.date ? -1 : 1);
    return vh.card('Próximos 14 días', '<ul class="upcoming">' + items.slice(0, 8).map(i => '<li><span class="up-date">' + esc(U.dateLabel(i.date, { year: false })) + '</span><span class="up-name">' + esc(i.name) + '</span>' + ui.amt((i.type === 'income' ? 1 : -1) * i.amount, { sign: true, colored: i.type === 'income' }) + '</li>').join('') + '</ul>', { action: '<a class="link" href="#/calendario">Calendario</a>', icon: 'calendar' });
  }

  function backupNudge() {
    const st = St.settings();
    if (St.isEmpty()) return '';
    const last = st.lastBackupAt ? U.daysBetween(st.lastBackupAt.slice(0, 10), U.today()) : null;
    if (last !== null && last < 30) return '';
    return '<div class="nudge">' + ui.icon('shield') + '<span>' + (last === null ? 'Aún no has exportado un respaldo.' : 'Tu último respaldo fue hace ' + last + ' días.') + ' Los datos viven solo en este navegador.</span><button class="btn small" data-act="export-backup">Exportar respaldo</button></div>';
  }

  function render(el) {
    if (St.isEmpty()) {
      el.innerHTML = '<div class="page dash">' + welcome() + '</div>';
      return;
    }
    const recent = F.analytics.filterTransactions(St, {}).filter(t => t.date <= U.today()).slice(0, 8);
    el.innerHTML = '<div class="page dash">' +
      pendingBlock() + hero() + vh.quickActions() + backupNudge() +
      '<div class="dash-grid">' +
      '<div class="col">' + monthBlock() + categoriesBlock() + insightsBlock() + '</div>' +
      '<div class="col">' + marginBlock() + upcomingBlock() + goalsBlock() +
      vh.card('Últimos movimientos', vh.txList(recent), { action: '<a class="link" href="#/movimientos">Ver todos</a>' }) + '</div>' +
      '</div>' + balanceSheet() + '</div>';
    F.charts.mount(el.querySelector('[data-chart-spark]'), { type: 'spark', values: window.__heroSpark || [], color: 'var(--hero-accent)', height: 54 });
    const es = A.expenseStats(St, U.currentMonthKey());
    const donutEl = el.querySelector('[data-chart-donut]');
    if (donutEl) F.charts.mount(donutEl, { type: 'donut', items: es.categories.map(c => ({ name: c.name, value: c.amount, color: c.color })), center: { label: 'Gastado', value: U.money(es.total, { compact: es.total >= 1e7 }) }, size: 150, legend: false });
  }

  F.views.inicio = { title: 'Inicio', render };
})(typeof window !== 'undefined' ? (window.FIN = window.FIN || {}) : (globalThis.FIN = globalThis.FIN || {}));

</script>
  <script>
/* js/ui/views/transactions.js */
/* =========================================================================
 * ui/views/transactions.js — Histórico completo con búsqueda y filtros.
 * ========================================================================= */
(function (F) {
  'use strict';
  const U = F.utils, S = F.schema, A = F.analytics, St = F.Store, ui = F.ui, vh = F.vh;
  const esc = U.escapeHTML;
  const PAGE = 80;

  let state = null;
  function defaults() { return { q: '', period: 'all', day: U.today(), month: U.currentMonthKey(), year: U.today().slice(0, 4), from: '', to: '', type: '', categoryId: '', accountId: '', tag: '', person: '', nature: '', limit: PAGE }; }

  function range(s) {
    switch (s.period) {
      case 'day': return [s.day, s.day];
      case 'week': { const w = U.weekStart(s.day); return [w, U.addDays(w, 6)]; }
      case 'month': return [U.monthStart(s.month), U.monthEnd(s.month)];
      case 'year': return [s.year + '-01-01', s.year + '-12-31'];
      case 'custom': return [s.from || null, s.to || null];
      default: return [null, null];
    }
  }

  function filtersFromParams(p) {
    const s = defaults();
    for (const k of Object.keys(s)) if (p[k] !== undefined && k !== 'limit') s[k] = p[k];
    if (p.tag && !p.period) s.period = 'all';
    return s;
  }
  function toQuery(s) {
    const d = defaults();
    const q = [];
    for (const k of Object.keys(s)) if (k !== 'limit' && s[k] !== d[k] && s[k] !== '') q.push(k + '=' + encodeURIComponent(s[k]));
    return q.join('&');
  }

  function filterArgs(s) {
    const [from, to] = range(s);
    const types = s.type === 'flow' ? ['income', 'expense'] : s.type ? [s.type] : null;
    return { q: s.q, from, to, types, categoryId: s.categoryId, accountId: s.accountId, tag: s.tag, person: s.person, nature: s.nature };
  }

  function controls(s) {
    const accs = St.all('accounts').map(a => ({ value: a.id, label: a.name + (a.archived ? ' (archivada)' : '') }));
    const cats = St.all('categories').slice().sort((a, b) => a.kind.localeCompare(b.kind) || a.name.localeCompare(b.name)).map(c => ({ value: c.id, label: (c.kind === 'income' ? 'Ingreso · ' : '') + c.name }));
    const tags = A.allTags(St).map(t => ({ value: t.tag, label: '#' + t.tag + ' (' + t.count + ')' }));
    const years = []; for (let y = Number(U.today().slice(0, 4)); y >= Number(F.ledger.firstDataMonth(St).slice(0, 4)); y--) years.push(String(y));
    let periodInput = '';
    if (s.period === 'day' || s.period === 'week') periodInput = '<input type="date" data-f="day" value="' + esc(s.day) + '" aria-label="Fecha">';
    if (s.period === 'month') periodInput = '<input type="month" data-f="month" value="' + esc(s.month) + '" aria-label="Mes">';
    if (s.period === 'year') periodInput = '<select data-f="year" aria-label="Año">' + ui.options(years, s.year) + '</select>';
    if (s.period === 'custom') periodInput = '<input type="date" data-f="from" value="' + esc(s.from) + '" aria-label="Desde"><input type="date" data-f="to" value="' + esc(s.to) + '" aria-label="Hasta">';
    const active = ['type', 'categoryId', 'accountId', 'tag', 'person', 'nature'].filter(k => s[k]).length;
    return '<div class="filters">' +
      '<label class="search">' + ui.icon('search') + '<input type="search" data-f="q" value="' + esc(s.q) + '" placeholder="Buscar: restaurante, #viaje, Nequi, 25000…" aria-label="Buscar movimientos"></label>' +
      '<div class="filter-row"><select data-f="period" aria-label="Período">' + ui.options({ all: 'Todo el histórico', day: 'Día', week: 'Semana', month: 'Mes', year: 'Año', custom: 'Rango personalizado' }, s.period) + '</select>' + periodInput + '</div>' +
      '<details class="filter-more"' + (active ? ' open' : '') + '><summary>' + ui.icon('filter') + 'Filtros' + (active ? ' <span class="count">' + active + '</span>' : '') + '</summary><div class="filter-grid">' +
      '<select data-f="type" aria-label="Tipo">' + ui.options(Object.assign({ flow: 'Ingresos y gastos' }, Object.fromEntries(Object.entries(S.TX_TYPES).map(([k, v]) => [k, v.label]))), s.type, 'Todos los tipos') + '</select>' +
      '<select data-f="categoryId" aria-label="Categoría">' + ui.options(cats, s.categoryId, 'Todas las categorías') + '</select>' +
      '<select data-f="accountId" aria-label="Cuenta">' + ui.options(accs, s.accountId, 'Todas las cuentas') + '</select>' +
      '<select data-f="tag" aria-label="Etiqueta">' + ui.options(tags, s.tag, 'Todas las etiquetas') + '</select>' +
      '<select data-f="person" aria-label="Persona">' + ui.options(S.PERSONS, s.person, 'Personal y compartidos') + '</select>' +
      '<select data-f="nature" aria-label="Fijo o variable">' + ui.options({ fixed: 'Solo gastos fijos', variable: 'Solo gastos variables' }, s.nature, 'Fijos y variables') + '</select>' +
      (active ? '<button class="btn small ghost" data-clear>Limpiar filtros</button>' : '') + '</div></details></div>';
  }

  function results(s) {
    const list = A.filterTransactions(St, filterArgs(s));
    const base = U.getBaseCurrency();
    let inc = 0, exp = 0, foreign = 0;
    for (const t of list) {
      const acc = St.get('accounts', t.accountId);
      if (acc && acc.currency !== base) { foreign++; continue; }
      for (const it of F.ledger.flowItems(t, St)) { if (it.kind === 'income') inc += it.amount; else exp += it.amount; }
    }
    const summary = '<div class="result-summary"><span><b>' + U.plainNumber(list.length) + '</b> movimiento' + (list.length === 1 ? '' : 's') + '</span>' +
      '<span>Ingresos ' + ui.amt(inc) + '</span><span>Gastos ' + ui.amt(exp) + '</span><span>Neto ' + ui.amt(inc - exp, { colored: true, sign: true }) + '</span>' +
      (list.length ? '<button class="btn small ghost" data-export-filtered>' + ui.icon('download') + 'CSV</button>' : '') + '</div>' +
      (foreign ? '<p class="muted small">' + foreign + ' movimiento(s) en otra moneda no se suman a los totales.</p>' : '');
    const empty = St.all('transactions').length
      ? ui.emptyState('search', 'Ningún movimiento coincide', 'Prueba con otro término o quita algunos filtros.')
      : ui.emptyState('list', 'Aún no hay movimientos', 'Registra tu primer gasto o ingreso con el botón +.', '<button class="btn primary" data-add-tx="expense">Registrar movimiento</button>');
    return summary + vh.txList(list, { limit: s.limit, empty }) + (list.length > s.limit ? '<button class="btn block ghost" data-more>Mostrar más (' + (list.length - s.limit) + ' restantes)</button>' : '');
  }

  function render(el, params) {
    state = filtersFromParams(params || {});
    el.innerHTML = '<div class="page">' + vh.pageHead('Movimientos', 'Todo tu histórico, desde el primer registro.', '<button class="btn primary" data-add-tx="expense">' + ui.icon('plus') + 'Registrar</button>') +
      '<div data-controls>' + controls(state) + '</div><div data-results>' + results(state) + '</div></div>';
    bind(el);
  }

  function bind(el) {
    const ctl = el.querySelector('[data-controls]'), res = el.querySelector('[data-results]');
    const refresh = (rebuildControls) => {
      state.limit = PAGE;
      const qs = toQuery(state);
      history.replaceState(null, '', '#/movimientos' + (qs ? '?' + qs : ''));
      if (rebuildControls) { ctl.innerHTML = controls(state); bindControls(); }
      res.innerHTML = results(state);
    };
    let tm = null;
    function bindControls() {
      ctl.querySelectorAll('[data-f]').forEach(inp => {
        const k = inp.dataset.f;
        const ev = k === 'q' ? 'input' : 'change';
        inp.addEventListener(ev, () => {
          state[k] = inp.value;
          if (k === 'q') { clearTimeout(tm); tm = setTimeout(() => refresh(false), 160); }
          else refresh(k === 'period');
        });
      });
      const clr = ctl.querySelector('[data-clear]');
      if (clr) clr.addEventListener('click', () => { for (const k of ['type', 'categoryId', 'accountId', 'tag', 'person', 'nature']) state[k] = ''; refresh(true); });
    }
    bindControls();
    res.addEventListener('click', (e) => {
      if (e.target.closest('[data-more]')) { state.limit += PAGE * 2; res.innerHTML = results(state); }
      if (e.target.closest('[data-export-filtered]')) {
        const list = A.filterTransactions(St, filterArgs(state)).slice().reverse();
        ui.download('movimientos-filtrados-' + U.today() + '.csv', F.io.transactionsCSV(St, list), 'text/csv;charset=utf-8');
      }
    });
  }

  F.views.movimientos = { title: 'Movimientos', render, keepScrollOnDataChange: true };
})(typeof window !== 'undefined' ? (window.FIN = window.FIN || {}) : (globalThis.FIN = globalThis.FIN || {}));

</script>
  <script>
/* js/ui/views/analysis.js */
/* =========================================================================
 * ui/views/analysis.js — Análisis mensual, anual, ingresos, gastos,
 * ahorro y flujo de caja, proyección, salud financiera e informes.
 * ========================================================================= */
(function (F) {
  'use strict';
  const U = F.utils, S = F.schema, L = F.ledger, A = F.analytics, R = F.recurring, St = F.Store, ui = F.ui, vh = F.vh, C = F.charts;
  const esc = U.escapeHTML;
  const COL = { income: 'var(--income)', expense: 'var(--expense)', saving: 'var(--saving)', invest: 'var(--invest)', nw: 'var(--accent)', muted: 'var(--muted-line)', debt: 'var(--debt)' };

  function validMonth(m) { return /^\d{4}-\d{2}$/.test(m || '') && U.isValidDate(m + '-01') ? m : U.currentMonthKey(); }
  function lastMonths(key, n) { const first = L.firstDataMonth(St); const from = U.addMonthKey(key, -(n - 1)); return U.monthRange(from < first ? first : from, key); }
  function analysisTabs(active) {
    const tabs = [['mes', 'Mes'], ['anual', 'Año'], ['ingresos', 'Ingresos'], ['gastos', 'Gastos'], ['ahorro', 'Ahorro y flujo'], ['proyeccion', 'Proyección'], ['salud', 'Indicadores'], ['informes', 'Informes']];
    return '<nav class="subtabs" aria-label="Análisis">' + tabs.map(([k, l]) => '<a href="#/' + k + '"' + (k === active ? ' class="on" aria-current="page"' : '') + '>' + l + '</a>').join('') + '</nav>';
  }
  function noData() { return ui.emptyState('chart', 'Aún no hay datos para analizar', 'Registra movimientos o carga los datos de ejemplo desde Ajustes.', '<button class="btn primary" data-add-tx="expense">Registrar movimiento</button>'); }

  // ================================ MES ================================
  function mes(el, p) {
    const key = validMonth(p.m);
    const ma = A.monthAnalysis(St, key);
    const c = ma.cur;
    const body = [];
    body.push('<div class="kpis seven">' +
      vh.kpi('Ingresos', ui.amt(c.income), ui.delta(ma.vsPrev.income.pct)) +
      vh.kpi('Gastos', ui.amt(c.expense), ui.delta(ma.vsPrev.expense.pct, { invert: true })) +
      vh.kpi('Balance (flujo neto)', ui.amt(c.net, { colored: true }), 'Ingresos − Gastos') +
      vh.kpi('Ahorro', ui.amt(c.saving), ui.delta(ma.vsPrev.saving.pct)) +
      vh.kpi('Inversión', ui.amt(c.investment), ui.delta(ma.vsPrev.investment.pct)) +
      vh.kpi('Tasa de ahorro', U.pct(c.savingsRate, 1), 'Tasa de inversión ' + U.pct(c.investmentRate, 1)) +
      vh.kpi('Patrimonio al cierre', c.netWorth === null ? '—' : ui.amt(c.netWorth), c.isCurrent ? 'a hoy' : '') + '</div>' +
      '<p class="foot-note">Variaciones frente a ' + esc(ma.prevLabel) + '.' + (c.isCurrent ? ' Mes en curso: se compara contra los mismos días del mes anterior.' : '') + '</p>');
    const rows = (cmp) => [
      ['Ingresos', cmp.income.cur, cmp.income.prev], Object.assign(['Gastos', cmp.expense.cur, cmp.expense.prev], { invert: true }), ['Balance', cmp.net.cur, cmp.net.prev],
      ['Ahorro', cmp.saving.cur, cmp.saving.prev], ['Inversión', cmp.investment.cur, cmp.investment.prev],
      Object.assign(['Tasa de ahorro', cmp.savingsRate.cur, cmp.savingsRate.prev], { pct: true })];
    let cmpHTML = vh.compareTable(rows(ma.vsPrev), U.monthLabel(key, true), ma.prevLabel.replace(/^(\w+) (\d{4})/, (m, a, b) => a.slice(0, 3).toLowerCase() + ' ' + b.slice(2)));
    if (ma.vsYoy) cmpHTML += '<h3 class="h3">Mismo mes del año anterior</h3>' + vh.compareTable(rows(ma.vsYoy), U.monthLabel(key, true), U.monthLabel(U.addMonthKey(key, -12), true));
    else cmpHTML += '<p class="muted small">Sin datos del mismo mes del año anterior (' + esc(U.monthLabel(U.addMonthKey(key, -12))) + ').</p>';
    const cats = ma.catVsPrev.filter(x => x.cur > 0).sort((a, b) => b.cur - a.cur);
    const catHTML = cats.length ? '<div class="bars">' + cats.slice(0, 10).map(x => vh.barRow(x.name, x.cur, c.expense ? x.cur / c.expense * 100 : 0, x.color, ' ' + ui.delta(x.pct, { invert: true, title: 'vs período anterior' }))).join('') + '</div>' : ui.emptyState('pie', 'Sin gastos en este mes', '');
    const ins = A.insights(St, key);
    const fixedPct = c.expense ? c.fixed / c.expense * 100 : 0;
    el.innerHTML = '<div class="page">' + analysisTabs('mes') + vh.pageHead('Análisis mensual', '', vh.monthPicker(key, 'mes')) +
      (c.count === 0 && ma.prev.count === 0 ? noData() :
        body.join('') +
        '<div class="grid-2">' + vh.card('Comparación', cmpHTML) + vh.card('Categorías principales', catHTML, { action: '<a class="link" href="#/movimientos?period=month&month=' + key + '&type=expense">Ver gastos</a>' }) + '</div>' +
        '<div class="grid-2">' + vh.card('Patrones del mes', ins.length ? '<ul class="insights">' + ins.map(i => '<li class="ins ' + i.dir + '">' + esc(i.text) + '</li>').join('') + '</ul>' : '<p class="muted">Se necesitan más datos para detectar patrones.</p>', { icon: 'pulse' }) +
        vh.card('Gastos fijos y variables', '<div class="stack-bar"><span class="fixed" style="width:' + fixedPct.toFixed(1) + '%"></span><span class="variable" style="width:' + (c.expense ? 100 - fixedPct : 0).toFixed(1) + '%"></span></div>' +
          '<div class="kpis two">' + vh.kpi('Fijos', ui.amt(c.fixed), U.pct(fixedPct, 0) + ' del gasto') + vh.kpi('Variables', ui.amt(c.variable), U.pct(c.expense ? 100 - fixedPct : null, 0) + ' del gasto') + '</div>') + '</div>' +
        '<p class="center"><a class="btn ghost" href="#/movimientos?period=month&month=' + key + '">Ver los ' + c.count + ' movimientos de ' + esc(U.monthLabel(key).toLowerCase()) + '</a></p>') + '</div>';
  }

  // ================================ AÑO ================================
  function anual(el, p) {
    const year = /^\d{4}$/.test(p.y || '') ? p.y : U.today().slice(0, 4);
    const ys = A.yearSummary(St, year);
    const t = ys.totals;
    if (!t.count && !ys.endNW) { el.innerHTML = '<div class="page">' + analysisTabs('anual') + vh.pageHead('Análisis anual', '', vh.yearPicker(year, 'anual')) + noData() + '</div>'; return; }
    const firstM = L.firstDataMonth(St);
    const prevMonthsWithData = U.monthRange((year - 1) + '-01', (year - 1) + '-12').filter(k => k >= firstM).length;
    const prevNote = ys.vsPrev && prevMonthsWithData < 12 ? '<p class="foot-note">' + (year - 1) + ' tiene datos solo de ' + prevMonthsWithData + ' mes(es); la comparación anual está incompleta.</p>' : '';
    const kp = '<div class="kpis seven">' +
      vh.kpi('Ingresos totales', ui.amt(t.income), ys.vsPrev ? ui.delta(ys.vsPrev.income.pct) + ' vs ' + (year - 1) : '') +
      vh.kpi('Gastos totales', ui.amt(t.expense), ys.vsPrev ? ui.delta(ys.vsPrev.expense.pct, { invert: true }) + ' vs ' + (year - 1) : '') +
      vh.kpi('Ahorro (I − G)', ui.amt(t.net, { colored: true }), 'Tasa ' + U.pct(t.savingsRate, 1)) +
      vh.kpi('Apartado en ahorro', ui.amt(t.saving), 'movimientos de Ahorro') +
      vh.kpi('Inversión total', ui.amt(t.investment), 'Tasa ' + U.pct(t.investmentRate, 1)) +
      vh.kpi('Crecimiento patrimonial', ui.amt(ys.growth, { colored: true, sign: true }), ys.growthPct === null ? '' : U.signedPct(ys.growthPct, 1) + ' en el año') +
      vh.kpi('Promedio mensual', ui.amt(ys.avgExpense) + '<small class="muted"> gasto</small>', 'Ingreso ' + esc(U.money(ys.avgIncome)) + ' · ' + ys.activeMonths + ' mes(es)') + '</div>' +
      prevNote + (ys.topCategory ? '<p class="foot-note">Categoría con mayor gasto: <b>' + esc(ys.topCategory.name) + '</b> (' + esc(U.money(ys.topCategory.amount)) + ', ' + U.pct(ys.topCategory.share, 0) + ' del total).</p>' : '');
    const rows = ys.rows;
    const table = '<div class="table-wrap"><table class="tbl num"><thead><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Flujo neto</th><th>Ahorro</th><th>Inversión</th><th>Patrimonio</th></tr></thead><tbody>' +
      rows.filter(r => !r.future).map(r => '<tr><th><a href="#/mes?m=' + r.key + '">' + esc(U.monthLabel(r.key).split(' ')[0]) + '</a></th><td>' + ui.amt(r.income) + '</td><td>' + ui.amt(r.expense) + '</td><td>' + ui.amt(r.net, { colored: true }) + '</td><td>' + ui.amt(r.saving) + '</td><td>' + ui.amt(r.investment) + '</td><td>' + (r.netWorth === null ? '—' : ui.amt(r.netWorth)) + '</td></tr>').join('') +
      '</tbody><tfoot><tr><th>Total</th><td>' + ui.amt(t.income) + '</td><td>' + ui.amt(t.expense) + '</td><td>' + ui.amt(t.net, { colored: true }) + '</td><td>' + ui.amt(t.saving) + '</td><td>' + ui.amt(t.investment) + '</td><td>' + ui.amt(ys.endNW) + '</td></tr></tfoot></table></div>';
    const cats = '<div class="bars">' + ys.categories.slice(0, 10).map(x => vh.barRow(x.name, x.amount, x.share, x.color, ' <small class="muted">' + U.pct(x.share, 0) + '</small>')).join('') + '</div>';
    el.innerHTML = '<div class="page">' + analysisTabs('anual') + vh.pageHead('Análisis anual', '', vh.yearPicker(year, 'anual')) + kp +
      vh.card('Evolución mensual', '<div data-c1></div><div data-c2></div>') + vh.card('Mes a mes', table) + vh.card('Gastos por categoría en ' + year, cats || '') + '</div>';
    const shown = rows.filter(r => !r.future);
    const labels = shown.map(r => U.monthLabel(r.key)), short = shown.map(r => U.MONTHS_SHORT[Number(r.key.slice(5)) - 1]);
    C.mount(el.querySelector('[data-c1]'), { type: 'bar', labels, shortLabels: short, series: [{ name: 'Ingresos', color: COL.income, values: shown.map(r => r.income) }, { name: 'Gastos', color: COL.expense, values: shown.map(r => r.expense) }] });
    C.mount(el.querySelector('[data-c2]'), { type: 'line', labels, shortLabels: short, zero: false, series: [{ name: 'Patrimonio neto', color: COL.nw, values: shown.map(r => r.netWorth), area: true }], height: 170 });
  }

  // ================================ INGRESOS ================================
  function ingresos(el, p) {
    const key = validMonth(p.m);
    const s = A.incomeStats(St, key);
    const kp = '<div class="kpis five">' +
      vh.kpi('Ingreso del mes', ui.amt(s.month), ui.delta(s.changePrev) + ' vs mes anterior') +
      vh.kpi('Ingreso del año ' + key.slice(0, 4), ui.amt(s.year), '') +
      vh.kpi('Ingreso promedio', ui.amt(s.avg12), s.avgMonths ? 'últimos ' + s.avgMonths + ' meses completos' : 'sin meses completos') +
      vh.kpi('Vs. promedio', ui.delta(s.changeAvg), s.avgMonths ? 'del mes frente al promedio' : '') +
      vh.kpi('Mes anterior', ui.amt(s.prev), '') + '</div>';
    const cats = s.categories.length ? '<div class="bars">' + s.categories.map(c => vh.barRow(c.name, c.amount, c.share, c.color, ' <small class="muted">' + U.pct(c.share, 0) + '</small>')).join('') + '</div>' : '<p class="muted">Sin ingresos en este mes.</p>';
    const list = A.filterTransactions(St, { from: U.monthStart(key), to: U.monthEnd(key), types: ['income'] });
    el.innerHTML = '<div class="page">' + analysisTabs('ingresos') + vh.pageHead('Ingresos', '', vh.monthPicker(key, 'ingresos') + '<button class="btn primary" data-add-tx="income">' + ui.icon('plus') + 'Ingreso</button>') + kp +
      vh.card('Evolución de ingresos (12 meses)', '<div data-c1></div>') +
      '<div class="grid-2">' + vh.card('Por fuente', cats) + vh.card('Ingresos de ' + U.monthLabel(key).toLowerCase(), vh.txList(list, { empty: '<p class="muted">Sin ingresos registrados.</p>' })) + '</div></div>';
    const ser = s.series;
    C.mount(el.querySelector('[data-c1]'), { type: 'bar', labels: ser.map(r => U.monthLabel(r.key)), shortLabels: ser.map(r => U.monthLabel(r.key, true)), series: [{ name: 'Ingresos', color: COL.income, values: ser.map(r => r.income) }] });
  }

  // ================================ GASTOS ================================
  function gastos(el, p) {
    const key = validMonth(p.m);
    const es = A.expenseStats(St, key);
    const s = es.summary;
    const av = A.averages(St, key, 6);
    const kp = '<div class="kpis five">' +
      vh.kpi('Total del mes', ui.amt(es.total), !av.months ? '' : s.isCurrent ? 'proyección ' + ui.delta(U.pctChange(es.projection, av.expense), { invert: true }) + ' vs promedio' : ui.delta(U.pctChange(es.total, av.expense), { invert: true }) + ' vs promedio') +
      vh.kpi('Promedio diario', ui.amt(es.dailyAvg), es.days + ' día(s) ' + (s.isCurrent ? 'transcurridos' : 'del mes')) +
      vh.kpi('Promedio semanal', ui.amt(es.weeklyAvg), 'diario × 7') +
      vh.kpi('Proyección mensual', ui.amt(es.projection), s.isCurrent ? 'estimación' : 'mes cerrado') +
      vh.kpi('Promedio 6 meses', ui.amt(av.expense), av.months ? av.months + ' mes(es) completos' : 'sin meses completos') + '</div>' +
      (s.isCurrent ? '<p class="foot-note">Proyección = gastado (' + esc(U.money(es.total)) + ') + gasto variable diario (' + esc(U.money(es.variableDaily)) + ') × días restantes (' + (es.daysInMonth - es.days) + ') + recurrentes pendientes del mes (' + esc(U.money(es.scheduledRemaining)) + ').</p>' : '');
    const budgets = new Map(St.all('budgets').map(b => [b.categoryId, b]));
    const cats = es.categories.length ? '<div class="bars">' + es.categories.map(c => {
      const b = budgets.get(c.id);
      return vh.barRow(c.name, c.amount, c.share, c.color, ' <small class="muted">' + U.pct(c.share, 0) + (b ? ' · ppto ' + esc(U.money(b.amount, { compact: true })) : '') + '</small>');
    }).join('') + '</div>' : '';
    // Subcategorías principales
    const subs = [...s.expenseBySub.entries()].map(([k, v]) => { const [cid, sub] = k.split('|'); const c = St.get('categories', cid); return { name: (c ? c.name : '—') + (sub ? ' · ' + sub : ''), amount: v }; }).sort((a, b) => b.amount - a.amount).slice(0, 8);
    const subsHTML = subs.length ? '<ul class="rank">' + subs.map(x => '<li><span>' + esc(x.name) + '</span>' + ui.amt(x.amount) + '</li>').join('') + '</ul>' : '';
    const persons = [...s.byPerson.entries()].sort((a, b) => b[1] - a[1]);
    const personHTML = persons.length ? '<ul class="rank">' + persons.map(([k, v]) => '<li><span>' + esc(S.PERSONS[k] || k) + '</span>' + ui.amt(v) + ' <small class="muted">' + U.pct(es.total ? v / es.total * 100 : null, 0) + '</small></li>').join('') + '</ul><p class="muted small">Clasificación informativa: no altera saldos ni patrimonio.</p>' : '';
    const fixedPct = es.total ? s.fixed / es.total * 100 : 0;
    const biggest = A.filterTransactions(St, { from: U.monthStart(key), to: U.monthEnd(key), types: ['expense'] }).sort((a, b) => b.amount - a.amount).slice(0, 5);
    el.innerHTML = '<div class="page">' + analysisTabs('gastos') + vh.pageHead('Gastos', '', vh.monthPicker(key, 'gastos') + '<button class="btn primary" data-add-tx="expense">' + ui.icon('plus') + 'Gasto</button>') +
      (es.total === 0 && !av.months ? noData() : kp +
        '<div class="grid-2">' + vh.card('Por categoría', '<div data-donut></div>' + cats) +
        '<div class="col">' + vh.card('Fijos y variables', '<div class="stack-bar"><span class="fixed" style="width:' + fixedPct.toFixed(1) + '%"></span><span class="variable" style="width:' + (es.total ? 100 - fixedPct : 0).toFixed(1) + '%"></span></div><div class="kpis two">' +
          vh.kpi('Fijos', ui.amt(s.fixed), U.pct(es.total ? fixedPct : null, 0)) + vh.kpi('Variables', ui.amt(s.variable), U.pct(es.total ? 100 - fixedPct : null, 0)) + '</div>') +
        vh.card('Subcategorías principales', subsHTML || '<p class="muted">—</p>') +
        vh.card('Por persona', personHTML || '<p class="muted">—</p>') + '</div></div>' +
        vh.card('Evolución del gasto (12 meses)', '<div data-c1></div>') +
        vh.card('Gastos más grandes del mes', vh.txList(biggest, { empty: '<p class="muted">—</p>' }))) + '</div>';
    const dEl = el.querySelector('[data-donut]');
    if (dEl) C.mount(dEl, { type: 'donut', items: es.categories.map(c => ({ name: c.name, value: c.amount, color: c.color })), center: { label: 'Total', value: U.money(es.total, { compact: es.total >= 1e7 }) }, legend: false });
    const ser = A.monthlySeries(St, lastMonths(key, 12)[0], key);
    const c1 = el.querySelector('[data-c1]');
    if (c1) C.mount(c1, { type: 'bar', labels: ser.map(r => U.monthLabel(r.key)), shortLabels: ser.map(r => U.monthLabel(r.key, true)), series: [{ name: 'Fijos', color: COL.debt, values: ser.map(r => r.fixed) }, { name: 'Variables', color: COL.expense, values: ser.map(r => r.variable) }] });
  }

  // ================================ AHORRO Y FLUJO ================================
  function ahorro(el, p) {
    const key = validMonth(p.m);
    const s = A.monthSummary(St, key);
    const year = key.slice(0, 4);
    const ys = A.summarize(St, year + '-01-01', year + '-12-31');
    const months = lastMonths(key, 12);
    const ser = A.monthlySeries(St, months[0], key);
    const allSer = A.monthlySeries(St, L.firstDataMonth(St), key);
    const cumSaving = U.sum(allSer, r => r.saving), cumNet = U.sum(allSer, r => r.net), cumInv = U.sum(allSer, r => r.investment);
    const nw = L.netWorthAt(St, U.today());
    const av12 = A.averages(St, key, 12);
    const avgRate = U.safeDiv(av12.income - av12.expense, av12.income);
    const kp = '<div class="kpis six">' +
      vh.kpi('Ahorro del mes', ui.amt(s.saving), 'dinero apartado (movimientos de Ahorro)') +
      vh.kpi('Ahorro del año', ui.amt(ys.saving), year) +
      vh.kpi('Tasa de ahorro', U.pct(s.savingsRate, 1), '(Ingresos − Gastos) ÷ Ingresos' + (avgRate !== null ? ' · prom. 12m ' + U.pct(avgRate * 100, 0) : '')) +
      vh.kpi('Tasa de inversión', U.pct(s.investmentRate, 1), 'Inversión ÷ Ingresos') +
      vh.kpi('Ahorro acumulado', ui.amt(nw.savings), 'saldo hoy en cuentas de ahorro') +
      vh.kpi('Flujo neto acumulado', ui.amt(cumNet, { colored: true }), 'suma histórica de Ingresos − Gastos') + '</div>' +
      '<p class="foot-note">Ahorro = dinero que apartas a cuentas de ahorro o metas. Inversión = dinero que entra a inversiones (' + esc(U.money(cumInv)) + ' históricamente). Ninguno de los dos es un gasto: tu patrimonio no baja al ahorrar o invertir. Apartado históricamente: ' + esc(U.money(cumSaving)) + '.</p>';
    const remaining = s.income - s.expense - s.saving - s.investment;
    el.innerHTML = '<div class="page">' + analysisTabs('ahorro') + vh.pageHead('Ahorro y flujo de caja', '', vh.monthPicker(key, 'ahorro')) + kp +
      vh.card('Flujo de caja de ' + U.monthLabel(key).toLowerCase(), '<div data-wf></div><p class="foot-note">Flujo neto = Ingresos − Gastos = ' + esc(U.money(s.net)) + '. Lo que queda tras ahorro e inversión: ' + esc(U.money(remaining)) + '. Las transferencias entre tus cuentas no aparecen aquí.</p>') +
      '<div class="grid-2">' + vh.card('Flujo neto mensual', '<div data-c1></div>') + vh.card('Tasa de ahorro mensual', '<div data-c2></div>') + '</div>' +
      vh.card('Evolución del dinero ahorrado e invertido', '<div data-c3></div>') + '</div>';
    C.mount(el.querySelector('[data-wf]'), { type: 'waterfall', steps: [
      { name: 'Ingresos', kind: 'start', value: s.income, color: COL.income },
      { name: 'Gastos', kind: 'delta', value: -s.expense, color: COL.expense },
      { name: 'Ahorro', kind: 'delta', value: -s.saving, color: COL.saving },
      { name: 'Inversión', kind: 'delta', value: -s.investment, color: COL.invest },
      { name: 'Queda', kind: 'total', value: 0, color: 'var(--ink-2)' }] });
    const labels = ser.map(r => U.monthLabel(r.key)), short = ser.map(r => U.monthLabel(r.key, true));
    C.mount(el.querySelector('[data-c1]'), { type: 'bar', labels, shortLabels: short, series: [{ name: 'Flujo neto', color: COL.income, negColor: COL.expense, values: ser.map(r => r.net) }] });
    C.mount(el.querySelector('[data-c2]'), { type: 'line', labels, shortLabels: short, percent: true, series: [{ name: 'Tasa de ahorro', color: COL.saving, values: ser.map(r => r.savingsRate) }] });
    const nws = months.map(k => L.netWorthAt(St, U.monthEnd(k) > U.today() ? U.today() : U.monthEnd(k)));
    C.mount(el.querySelector('[data-c3]'), { type: 'line', labels, shortLabels: short, series: [{ name: 'Ahorrado', color: COL.saving, values: nws.map(n => n.savings) }, { name: 'Invertido', color: COL.invest, values: nws.map(n => n.invested) }] });
  }

  // ================================ PROYECCIÓN ================================
  const projState = { basis: 6, horizon: 12, incomeAdj: 0, expenseAdj: 0, annualReturn: 0 };
  function proyeccion(el) {
    const draw = () => {
      const pr = A.projection(St, projState);
      const out = el.querySelector('[data-out]');
      if (!pr.months) { out.innerHTML = ui.emptyState('projection', 'Se necesita al menos un mes completo de datos', 'La proyección usa el promedio de tus meses completos anteriores al actual.'); return; }
      const milestones = [1, 3, 6, 12, 24, 36, 60].filter(m => m <= projState.horizon);
      const last = pr.series[pr.series.length - 1];
      out.innerHTML = '<div class="kpis four">' +
        vh.kpi('Ingreso mensual supuesto', ui.amt(pr.income), 'promedio ' + pr.months + ' mes(es)' + (projState.incomeAdj ? ' ' + U.signedPct(projState.incomeAdj, 0) : '')) +
        vh.kpi('Gasto mensual supuesto', ui.amt(pr.expense), projState.expenseAdj ? U.signedPct(projState.expenseAdj, 0) + ' sobre el promedio' : 'promedio') +
        vh.kpi('Flujo neto mensual', ui.amt(pr.net, { colored: true }), 'Ingresos − Gastos') +
        vh.kpi('Patrimonio en ' + projState.horizon + ' meses', ui.amt(last.netWorth), 'hoy ' + esc(U.money(pr.start.netWorth))) + '</div>' +
        '<p class="lead">Si mantienes estos hábitos, en ' + projState.horizon + ' meses acumularías ' + ui.amt(last.cumNet, { colored: true }) + ' de flujo neto' + (projState.annualReturn ? ' y ' + ui.amt(last.cumReturn) + ' de rendimiento supuesto' : '') + '.</p>' +
        '<div data-pc></div>' +
        '<div class="table-wrap"><table class="tbl num"><thead><tr><th>Plazo</th><th>Mes</th><th>Liquidez + ahorro</th><th>Invertido</th><th>Patrimonio</th></tr></thead><tbody>' +
        milestones.map(m => { const r = pr.series[m]; return '<tr><th>' + m + ' mes' + (m > 1 ? 'es' : '') + '</th><td>' + esc(U.monthLabel(r.key, true)) + '</td><td>' + ui.amt(r.liquid) + '</td><td>' + ui.amt(r.invested) + '</td><td>' + ui.amt(r.netWorth) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
        '<p class="disclaimer">' + ui.icon('info', 'tiny') + ' Proyección matemática lineal, no una garantía. Supone que ingresos, gastos, aportes a inversión y abonos a deudas se repiten igual al promedio de los meses elegidos' + (projState.annualReturn ? ', y que las inversiones rinden ' + U.pct(projState.annualReturn, 1) + ' efectivo anual' : ', sin rendimientos de inversión') + '. Los resultados reales variarán.</p>';
      C.mount(out.querySelector('[data-pc]'), { type: 'line', zero: false, labels: pr.series.map(r => U.monthLabel(r.key)), shortLabels: pr.series.map(r => U.monthLabel(r.key, true)), series: [
        { name: 'Patrimonio', color: COL.nw, values: pr.series.map(r => r.netWorth), area: true },
        { name: 'Liquidez + ahorro', color: COL.saving, values: pr.series.map(r => r.liquid), dashed: true },
        { name: 'Invertido', color: COL.invest, values: pr.series.map(r => r.invested), dashed: true }] });
    };
    el.innerHTML = '<div class="page">' + analysisTabs('proyeccion') + vh.pageHead('Proyección financiera', 'Escenarios basados en tu promedio histórico.') +
      vh.card('Supuestos', '<div class="proj-controls">' +
        '<label class="field"><span class="lbl">Basado en los últimos</span><select data-p="basis">' + ui.options({ 3: '3 meses', 6: '6 meses', 12: '12 meses' }, projState.basis) + '</select></label>' +
        '<label class="field"><span class="lbl">Horizonte</span><select data-p="horizon">' + ui.options({ 6: '6 meses', 12: '12 meses', 24: '2 años', 36: '3 años', 60: '5 años' }, projState.horizon) + '</select></label>' +
        '<label class="field"><span class="lbl">Cambio en ingresos <b data-v="incomeAdj">' + U.signedPct(projState.incomeAdj, 0) + '</b></span><input type="range" min="-50" max="50" step="5" value="' + projState.incomeAdj + '" data-p="incomeAdj"></label>' +
        '<label class="field"><span class="lbl">Cambio en gastos <b data-v="expenseAdj">' + U.signedPct(projState.expenseAdj, 0) + '</b></span><input type="range" min="-50" max="50" step="5" value="' + projState.expenseAdj + '" data-p="expenseAdj"></label>' +
        '<label class="field"><span class="lbl">Rendimiento anual supuesto de inversiones (%)</span><input type="number" min="-50" max="100" step="0.5" value="' + projState.annualReturn + '" data-p="annualReturn" inputmode="decimal"></label>' +
        '</div>') + '<div data-out></div></div>';
    el.querySelectorAll('[data-p]').forEach(inp => inp.addEventListener('input', () => {
      let v = Number(inp.value);
      if (!Number.isFinite(v)) v = 0;
      if (inp.dataset.p === 'annualReturn') v = U.clamp(v, -50, 100);
      projState[inp.dataset.p] = v;
      const lbl = el.querySelector('[data-v="' + inp.dataset.p + '"]'); if (lbl) lbl.textContent = U.signedPct(v, 0);
      draw();
    }));
    draw();
  }

  // ================================ INDICADORES / SALUD ================================
  function salud(el) {
    const h = A.health(St);
    const fmtVal = m => m.value === null || m.value === undefined || !Number.isFinite(m.value) ? '—' : m.unit === '%' ? U.pct(m.value, 1) : U.plainNumber(m.value, 1) + ' ' + m.unit;
    const cards = h.metrics.map(m => '<div class="metric"><span class="metric-label">' + esc(m.label) + '</span><span class="metric-value">' + fmtVal(m) + (m.money !== undefined ? ' <small>' + esc((m.money >= 0 ? '+' : '−') + U.money(Math.abs(m.money))) + '</small>' : '') + '</span>' +
      '<details><summary>Cálculo</summary><p class="formula">' + esc(m.formula) + '</p><ul>' + m.inputs.map(([l, v]) => '<li><span>' + esc(l) + '</span>' + ui.amt(v) + '</li>').join('') + '</ul></details></div>').join('');
    const st = St.settings();
    const ef = h.emergency;
    el.innerHTML = '<div class="page">' + analysisTabs('salud') + vh.pageHead('Indicadores financieros', 'Métricas descriptivas con su fórmula. No hay puntaje: tú decides qué significan para ti.') +
      '<p class="foot-note">Base: ' + esc(h.basisTxt) + '.</p><div class="metrics">' + cards + '</div>' +
      vh.card('Calculadora de fondo de emergencia', '<div class="ef-calc">' +
        '<label class="field"><span class="lbl">Gasto mensual promedio</span><input data-ef="exp" inputmode="decimal" value="' + esc(ui.amountValue(Math.round(h.avgExpense6))) + '"><span class="hint">Prellenado con tu promedio de los últimos 6 meses.</span></label>' +
        '<label class="field"><span class="lbl">Meses objetivo</span><select data-ef="months">' + ui.options({ 3: '3 meses', 4: '4 meses', 6: '6 meses', 9: '9 meses', 12: '12 meses' }, st.emergencyMonths || 6) + '</select></label>' +
        '<label class="field"><span class="lbl">Fondo actual</span><input data-ef="cur" inputmode="decimal" value="' + esc(ui.amountValue(Math.round(ef.amount))) + '"><span class="hint">Tomado de: ' + esc(ef.label) + '. Puedes ajustarlo.</span></label>' +
        '</div><div data-ef-out></div>', { icon: 'shield' }) + '</div>';
    const out = el.querySelector('[data-ef-out]');
    el.querySelectorAll('[data-ef="exp"],[data-ef="cur"]').forEach(i => ui.bindAmountInput(i));
    const calc = () => {
      const exp = U.parseAmount(el.querySelector('[data-ef="exp"]').value) || 0;
      const months = Number(el.querySelector('[data-ef="months"]').value) || 6;
      const cur = U.parseAmount(el.querySelector('[data-ef="cur"]').value) || 0;
      const target = exp * months, rem = Math.max(0, target - cur);
      const pct = target > 0 ? cur / target * 100 : 0;
      const cover = U.safeDiv(cur, exp);
      out.innerHTML = '<div class="kpis four">' + vh.kpi('Fondo según el supuesto', ui.amt(target), U.money(exp) + ' × ' + months) + vh.kpi('Tienes', ui.amt(cur), cover === null ? '' : U.plainNumber(cover, 1) + ' meses de gasto') +
        vh.kpi('Falta', ui.amt(rem), rem ? '' : 'meta alcanzada') + vh.kpi('Progreso', U.pct(Math.min(pct, 100), 0), '') + '</div>' + ui.progress(pct, pct >= 100 ? 'done' : '') +
        (St.all('goals').some(g => g.kind === 'emergency') ? '' : '<p class="center"><button class="btn small" data-ef-goal>Crear meta «Fondo de emergencia» por ' + esc(U.money(target)) + '</button></p>');
      const b = out.querySelector('[data-ef-goal]');
      if (b) b.addEventListener('click', () => F.forms.goal(null, null, { kind: 'emergency', name: 'Fondo de emergencia', targetAmount: target }));
    };
    el.querySelectorAll('[data-ef]').forEach(i => i.addEventListener('input', calc));
    el.querySelector('[data-ef="months"]').addEventListener('change', e => { St.saveSettings({ emergencyMonths: Number(e.target.value) }); });
    calc();
  }

  // ================================ INFORMES ================================
  const repState = { mode: 'month', ref: null, from: '', to: '' };
  function informes(el) {
    const cy = U.today().slice(0, 4);
    if (!repState.ref) repState.ref = U.currentMonthKey();
    const refInput = () => {
      if (repState.mode === 'month') return '<input type="month" data-r="ref" value="' + esc(/^\d{4}-\d{2}$/.test(repState.ref) ? repState.ref : U.currentMonthKey()) + '">';
      if (repState.mode === 'quarter') {
        const opts = []; const first = Number(L.firstDataMonth(St).slice(0, 4));
        for (let y = Number(cy); y >= first; y--) for (let q = 4; q >= 1; q--) opts.push({ value: y + '-Q' + q, label: 'T' + q + ' ' + y });
        return '<select data-r="ref">' + ui.options(opts, /Q/.test(repState.ref) ? repState.ref : cy + '-Q' + U.quarterOf(U.today())) + '</select>';
      }
      if (repState.mode === 'year') { const ys = []; for (let y = Number(cy); y >= Number(L.firstDataMonth(St).slice(0, 4)); y--) ys.push(String(y)); return '<select data-r="ref">' + ui.options(ys, /^\d{4}$/.test(repState.ref) ? repState.ref : cy) + '</select>'; }
      return '<input type="date" data-r="from" value="' + esc(repState.from || U.monthStart(U.currentMonthKey())) + '"><input type="date" data-r="to" value="' + esc(repState.to || U.today()) + '">';
    };
    el.innerHTML = '<div class="page">' + analysisTabs('informes') + vh.pageHead('Informes', 'Resumen de cualquier período, listo para imprimir o exportar.') +
      '<div class="report-controls no-print"><select data-r="mode">' + ui.options({ month: 'Mes', quarter: 'Trimestre', year: 'Año', custom: 'Rango personalizado' }, repState.mode) + '</select><span data-ref>' + refInput() + '</span>' +
      '<button class="btn ghost" data-print>' + ui.icon('file') + 'Imprimir / PDF</button><button class="btn ghost" data-rcsv>' + ui.icon('download') + 'CSV</button></div><div data-report></div></div>';
    const draw = () => {
      let from, to, label, prev;
      if (repState.mode === 'custom') {
        from = repState.from || U.monthStart(U.currentMonthKey()); to = repState.to || U.today();
        if (!U.isValidDate(from) || !U.isValidDate(to) || from > to) { el.querySelector('[data-report]').innerHTML = '<p class="field-error">Rango inválido: la fecha inicial debe ser anterior a la final.</p>'; return; }
        label = U.dateLabel(from) + ' – ' + U.dateLabel(to);
      } else {
        const rr = A.periodRange(repState.mode, repState.mode === 'month' ? (/^\d{4}-\d{2}$/.test(repState.ref) ? repState.ref : U.currentMonthKey()) : repState.mode === 'quarter' ? (/Q/.test(repState.ref) ? repState.ref : cy + '-Q' + U.quarterOf(U.today())) : (/^\d{4}$/.test(repState.ref) ? repState.ref : cy));
        from = rr.from; to = rr.to; label = rr.label;
      }
      prev = A.previousRange(repState.mode, from, to);
      const r = A.report(St, from, to, prev.from, prev.to);
      const s = r.summary;
      const line = (l, v, pctv, inv) => '<div class="rep-line"><span>' + esc(l) + '</span><b>' + ui.amt(v) + '</b>' + (pctv !== undefined ? ui.delta(pctv, { invert: inv }) : '') + '</div>';
      el.querySelector('[data-report]').innerHTML = '<article class="report card">' +
        '<header><h2>Informe · ' + esc(label) + '</h2><p class="muted">' + esc(U.dateLabel(from)) + ' al ' + esc(U.dateLabel(to)) + ' · Generado el ' + esc(U.dateLabel(U.today())) + '</p></header>' +
        '<div class="rep-grid"><div>' +
        line('Ingresos', s.income, r.vs.income.pct) + line('Gastos', s.expense, r.vs.expense.pct, true) + line('Flujo neto (I − G)', s.net, r.vs.net.pct) +
        line('Ahorro', s.saving, r.vs.saving.pct) + line('Inversión', s.investment, r.vs.investment.pct) +
        '<div class="rep-line"><span>Tasa de ahorro</span><b>' + U.pct(s.savingsRate, 1) + '</b><span class="muted small">antes ' + U.pct(r.prev.savingsRate, 1) + '</span></div>' +
        '<div class="rep-line"><span>Patrimonio al cierre</span><b>' + (r.netWorthEnd ? ui.amt(r.netWorthEnd.netWorth) : '—') + '</b>' + (r.nwChange !== null ? '<span class="small">' + ui.amt(r.nwChange, { sign: true, colored: true }) + ' en el período</span>' : '') + '</div>' +
        '</div><div><h3>Principales categorías de gasto</h3><ol class="rep-cats">' + (r.categories.slice(0, 5).map(c => '<li><span>' + esc(c.name) + '</span>' + ui.amt(c.amount) + '<small class="muted">' + U.pct(c.share, 0) + '</small></li>').join('') || '<li class="muted">Sin gastos</li>') + '</ol>' +
        (r.incomeCategories.length ? '<h3>Fuentes de ingreso</h3><ol class="rep-cats">' + r.incomeCategories.slice(0, 3).map(c => '<li><span>' + esc(c.name) + '</span>' + ui.amt(c.amount) + '</li>').join('') + '</ol>' : '') +
        (r.byTag.length ? '<h3>Gasto por etiqueta</h3><ul class="rep-cats">' + r.byTag.slice(0, 5).map(t => '<li><span>#' + esc(t.id) + '</span>' + ui.amt(t.amount) + '</li>').join('') + '</ul>' : '') +
        '</div></div><p class="foot-note">Variación respecto al período anterior (' + esc(U.dateLabel(prev.from)) + ' – ' + esc(U.dateLabel(prev.to)) + '): ingresos ' + U.signedPct(r.vs.income.pct, 1) + ', gastos ' + U.signedPct(r.vs.expense.pct, 1) + '. ' + s.count + ' movimientos en el período.</p></article>';
      el.__report = { r, label };
    };
    const ctrl = el.querySelector('.report-controls');
    ctrl.addEventListener('change', e => {
      const k = e.target.dataset.r;
      if (!k) return;
      repState[k] = e.target.value;
      if (k === 'mode') { repState.ref = repState.mode === 'month' ? U.currentMonthKey() : repState.mode === 'quarter' ? cy + '-Q' + U.quarterOf(U.today()) : cy; el.querySelector('[data-ref]').innerHTML = refInput(); }
      draw();
    });
    el.querySelector('[data-print]').addEventListener('click', () => window.print());
    el.querySelector('[data-rcsv]').addEventListener('click', () => {
      const { r, label } = el.__report || {};
      if (!r) return;
      const s = r.summary;
      const rows = [['Período', label], ['Desde', r.from], ['Hasta', r.to], ['Ingresos', s.income], ['Gastos', s.expense], ['Flujo neto', s.net], ['Ahorro', s.saving], ['Inversión', s.investment],
        ['Tasa de ahorro %', s.savingsRate === null ? '' : U.round2(s.savingsRate)], ['Patrimonio al cierre', r.netWorthEnd ? r.netWorthEnd.netWorth : ''], ['Variación ingresos %', r.vs.income.pct === null ? '' : U.round2(r.vs.income.pct)], ['Variación gastos %', r.vs.expense.pct === null ? '' : U.round2(r.vs.expense.pct)], []]
        .concat([['Categoría', 'Gasto', '% del total']]).concat(r.categories.map(c => [c.name, c.amount, U.round2(c.share)]));
      ui.download('informe-' + r.from + '_' + r.to + '.csv', F.io.toCSV(rows[0], rows.slice(1).map(x => x.map(v => typeof v === 'number' ? String(v).replace('.', ',') : v))), 'text/csv;charset=utf-8');
    });
    draw();
  }

  Object.assign(F.views, {
    mes: { title: 'Análisis mensual', render: mes },
    anual: { title: 'Análisis anual', render: anual },
    ingresos: { title: 'Ingresos', render: ingresos },
    gastos: { title: 'Gastos', render: gastos },
    ahorro: { title: 'Ahorro y flujo', render: ahorro },
    proyeccion: { title: 'Proyección', render: proyeccion },
    salud: { title: 'Indicadores', render: salud },
    informes: { title: 'Informes', render: informes }
  });
  F.views._analysisTabs = analysisTabs;
})(typeof window !== 'undefined' ? (window.FIN = window.FIN || {}) : (globalThis.FIN = globalThis.FIN || {}));

</script>
  <script>
/* js/ui/views/money.js */
/* =========================================================================
 * ui/views/money.js — Mis cuentas, Patrimonio, Inversiones y Deudas.
 * ========================================================================= */
(function (F) {
  'use strict';
  const U = F.utils, S = F.schema, L = F.ledger, A = F.analytics, St = F.Store, ui = F.ui, vh = F.vh, C = F.charts;
  const esc = U.escapeHTML;

  // ================================ CUENTAS ================================
  function cuentas(el) {
    const list = L.accountsWithBalance(St);
    const base = U.getBaseCurrency();
    const active = list.filter(a => !a.archived), archived = list.filter(a => a.archived);
    const groups = [
      ['spending', 'Disponible', a => a.purposeResolved === 'spending' && a.type !== 'credit_card'],
      ['savings', 'Ahorro', a => a.purposeResolved === 'savings'],
      ['investment', 'Inversión', a => a.purposeResolved === 'investment'],
      ['card', 'Tarjetas de crédito', a => a.type === 'credit_card']
    ];
    const accCard = a => {
      const u = St.usages('accounts', a.id);
      return '<article class="acc-card' + (a.balance < 0 ? ' negative' : '') + '">' +
        '<div class="acc-top"><div><h3>' + esc(a.name) + '</h3><span class="muted small">' + esc(S.ACCOUNT_TYPES[a.type].label) + (a.currency !== base ? ' · ' + a.currency : '') + '</span></div>' +
        '<div class="acc-bal">' + (a.type === 'credit_card' ? '<span class="muted small">' + (a.balance < 0 ? 'Debes' : 'Saldo a favor') + '</span>' : '') + ui.amt(a.type === 'credit_card' ? Math.abs(a.balance) : a.balance, { currency: a.currency }) + '</div></div>' +
        '<dl class="acc-meta"><div><dt>Saldo inicial</dt><dd>' + esc(U.money(a.initialBalance, { currency: a.currency })) + '</dd></div><div><dt>Desde</dt><dd>' + esc(U.dateLabel(a.openedAt)) + '</dd></div><div><dt>Movimientos</dt><dd>' + u.transactions + '</dd></div></dl>' +
        (a.notes ? '<p class="muted small">' + esc(a.notes) + '</p>' : '') +
        '<div class="acc-actions"><a class="btn small ghost" href="#/movimientos?accountId=' + esc(a.id) + '">Movimientos</a><button class="btn small ghost" data-reconcile="' + esc(a.id) + '">Ajustar saldo</button><button class="btn small ghost" data-edit-acc="' + esc(a.id) + '">' + ui.icon('edit') + 'Editar</button></div></article>';
    };
    let h = '';
    for (const [k, title, fn] of groups) {
      const items = active.filter(fn);
      if (!items.length) continue;
      const total = U.sum(items.filter(a => a.currency === base), a => a.balance);
      h += '<section class="acc-group"><header><h2>' + esc(title) + '</h2>' + ui.amt(k === 'card' ? Math.abs(Math.min(0, total)) : total) + '</header><div class="acc-grid">' + items.map(accCard).join('') + '</div></section>';
    }
    if (archived.length) h += '<details class="archived"><summary>Archivadas (' + archived.length + ')</summary><div class="acc-grid">' + archived.map(accCard).join('') + '</div></details>';
    const nw = L.netWorthAt(St, U.today());
    el.innerHTML = '<div class="page">' + vh.pageHead('Mis cuentas', 'Los saldos se calculan: saldo inicial + todos los movimientos hasta hoy.', '<button class="btn primary" data-act="new-account">' + ui.icon('plus') + 'Nueva cuenta</button>') +
      (list.length ? '<div class="kpis four">' + vh.kpi('Dinero en cuentas', ui.amt(nw.spending)) + vh.kpi('Efectivo', ui.amt(nw.cash)) + vh.kpi('Ahorros', ui.amt(nw.savings)) + vh.kpi('Disponible real', ui.amt(nw.available), 'cuentas + efectivo − tarjetas') + '</div>' + h
        : ui.emptyState('wallet', 'Aún no tienes cuentas', 'Crea tus cuentas (banco, billetera digital, efectivo, tarjeta) con el saldo que tienen hoy.', '<button class="btn primary" data-act="new-account">Crear cuenta</button>')) + '</div>';
    el.querySelectorAll('[data-edit-acc]').forEach(b => b.addEventListener('click', () => F.forms.account(St.get('accounts', b.dataset.editAcc))));
    el.querySelectorAll('[data-reconcile]').forEach(b => b.addEventListener('click', () => reconcile(St.get('accounts', b.dataset.reconcile))));
  }

  /** Ajuste de saldo: corrige el saldo inicial para que el saldo actual coincida con el real (sin afectar estadísticas). */
  function reconcile(acc) {
    const cur = L.accountBalance(St, acc.id, U.today());
    const card = acc.type === 'credit_card';
    F.forms.entityForm({
      title: 'Ajustar saldo · ' + acc.name, size: 'small', values: { real: card ? Math.abs(cur) : cur },
      intro: 'Escribe el saldo real que ves hoy en tu banco o billetera. La diferencia se aplica al saldo inicial, así no aparece como ingreso ni gasto. Saldo calculado actual: <b>' + esc(U.money(card ? Math.abs(cur) : cur, { currency: acc.currency })) + '</b>' + (card ? ' (deuda)' : '') + '.',
      fields: [{ name: 'real', label: card ? 'Deuda real de la tarjeta' : 'Saldo real hoy', type: 'amount' }],
      onSave: vals => {
        if (typeof vals.real !== 'number' || !Number.isFinite(vals.real)) throw new F.ValidationError({ real: 'Escribe un valor válido.' });
        const target = card ? -Math.abs(vals.real) : vals.real;
        const diff = U.round2(target - cur);
        return St.save('accounts', Object.assign({}, acc, { initialBalance: U.round2(U.num(acc.initialBalance) + diff), notes: acc.notes })).then(r => { ui.toast(diff === 0 ? 'El saldo ya coincidía' : 'Saldo ajustado en ' + U.money(diff, { sign: true })); return r; });
      }
    });
  }

  // ================================ PATRIMONIO ================================
  function patrimonio(el) {
    const nw = L.netWorthAt(St, U.today());
    const first = L.firstDataMonth(St);
    const months = U.monthRange(first, U.currentMonthKey());
    const hist = months.map(k => ({ key: k, nw: L.netWorthAt(St, U.monthEnd(k) > U.today() ? U.today() : U.monthEnd(k)) }));
    const row = (l, v) => '<div class="bs-row static"><span>' + esc(l) + '</span>' + ui.amt(v) + '</div>';
    const assets = St.all('assets');
    const table = '<div class="table-wrap"><table class="tbl num"><thead><tr><th>Mes</th><th>Activos</th><th>Pasivos</th><th>Patrimonio</th><th>Cambio</th></tr></thead><tbody>' +
      hist.slice().reverse().map((h, i, arr) => { const prev = arr[i + 1]; const d = prev ? h.nw.netWorth - prev.nw.netWorth : null;
        return '<tr><th>' + esc(U.monthLabel(h.key)) + '</th><td>' + ui.amt(h.nw.assets) + '</td><td>' + ui.amt(h.nw.liabilities) + '</td><td><b>' + ui.amt(h.nw.netWorth) + '</b></td><td>' + (d === null ? '—' : ui.amt(d, { sign: true, colored: true }) + ' ' + ui.delta(U.pctChange(h.nw.netWorth, prev.nw.netWorth))) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    el.innerHTML = '<div class="page">' + vh.pageHead('Patrimonio neto', 'Patrimonio neto = Activos − Pasivos. Reconstruido mes a mes desde tus registros.', '<button class="btn" data-new-asset>' + ui.icon('plus') + 'Otro activo o pasivo</button>') +
      '<div class="nw-hero"><span>Hoy</span>' + ui.amt(nw.netWorth) + '</div>' +
      '<div class="grid-2">' + vh.card('Activos', row('Dinero en cuentas', nw.spending) + row('Efectivo', nw.cash) + row('Ahorros', nw.savings) + row('Inversiones (valor actual)', nw.investments) + (nw.investmentCash ? row('Saldo en cuentas de inversión', nw.investmentCash) : '') + row('Dinero que me deben', nw.receivables) + row('Otros activos', nw.otherAssets) + '<div class="bs-total"><span>Total activos</span>' + ui.amt(nw.assets) + '</div>') +
      vh.card('Pasivos', row('Tarjetas de crédito', nw.cardDebt) + row('Deudas y préstamos', nw.debts) + row('Otros pasivos', nw.otherLiabilities) + '<div class="bs-total"><span>Total pasivos</span>' + ui.amt(nw.liabilities) + '</div>') + '</div>' +
      (nw.foreign.length ? '<p class="foot-note">No incluidas (otra moneda, sin conversión): ' + nw.foreign.map(f => esc(f.name) + ' ' + esc(U.money(f.balance, { currency: f.currency }))).join(', ') + '.</p>' : '') +
      vh.card('Evolución del patrimonio', '<div data-c1></div>') +
      vh.card('Otros activos y pasivos', assets.length ? '<ul class="rank">' + assets.map(a => { const v = L.assetValueAt(a, U.today()); const last = L.sortedValuations(a).slice(-1)[0];
        return '<li><span>' + esc(a.name) + ' <small class="muted">' + esc(S.ASSET_KINDS[a.kind]) + ' · valor del ' + esc(last ? U.dateLabel(last.date) : '—') + '</small></span>' + ui.amt(a.kind === 'other_liability' ? -v : v, { colored: a.kind === 'other_liability' }) + '<button class="btn small ghost" data-edit-asset="' + esc(a.id) + '">Actualizar</button></li>'; }).join('') + '</ul>'
        : '<p class="muted">Vivienda, vehículo u otros bienes que quieras incluir en tu patrimonio. Su valor lo actualizas tú cuando quieras.</p>') +
      vh.card('Mes a mes', table) + '</div>';
    C.mount(el.querySelector('[data-c1]'), { type: 'line', zero: false, labels: hist.map(h => U.monthLabel(h.key)), shortLabels: hist.map(h => U.monthLabel(h.key, true)), series: [
      { name: 'Patrimonio neto', color: 'var(--accent)', values: hist.map(h => h.nw.netWorth), area: true },
      { name: 'Activos', color: 'var(--income)', values: hist.map(h => h.nw.assets), dashed: true },
      { name: 'Pasivos', color: 'var(--expense)', values: hist.map(h => h.nw.liabilities), dashed: true }] });
    el.querySelector('[data-new-asset]').addEventListener('click', () => F.forms.asset(null));
    el.querySelectorAll('[data-edit-asset]').forEach(b => b.addEventListener('click', () => F.forms.asset(St.get('assets', b.dataset.editAsset))));
  }

  // ================================ INVERSIONES ================================
  function inversiones(el) {
    const pf = L.portfolioSummary(St);
    const invs = St.all('investments');
    const card = s => {
      const inv = St.get('investments', s.id);
      const stale = s.staleDays !== null && s.staleDays > 45;
      const vals = L.sortedValuations(inv);
      return '<article class="inv-card' + (s.closed ? ' closed' : '') + '"><header><div><h3>' + esc(s.name) + '</h3><span class="muted small">' + esc(S.INVESTMENT_TYPES[s.type]) + (s.closed ? ' · cerrada' : '') + '</span></div>' +
        '<div class="right">' + ui.amt(s.value) + '<span class="' + (s.gain >= 0 ? 'pos' : 'neg') + ' small">' + esc(U.money(s.gain, { sign: true })) + ' · ' + U.signedPct(s.returnPct, 1) + '</span></div></header>' +
        '<dl class="acc-meta"><div><dt>Aportado</dt><dd>' + esc(U.money(s.contributions)) + '</dd></div><div><dt>Retirado</dt><dd>' + esc(U.money(s.withdrawals)) + '</dd></div><div><dt>Comisiones</dt><dd>' + esc(U.money(s.fees)) + '</dd></div><div><dt>Valor actualizado</dt><dd>' + esc(s.lastValuationDate ? U.dateLabel(s.lastValuationDate) : '—') + '</dd></div></dl>' +
        (stale ? '<p class="warn-note">' + ui.icon('clock', 'tiny') + ' El valor se actualizó hace ' + s.staleDays + ' días.</p>' : '') +
        (vals.length > 1 ? '<div class="inv-spark" data-spark="' + esc(s.id) + '"></div>' : '') +
        (inv.notes ? '<p class="muted small">' + esc(inv.notes) + '</p>' : '') +
        '<div class="acc-actions"><button class="btn small primary" data-inv-val="' + esc(s.id) + '">Actualizar valor</button><button class="btn small ghost" data-inv-add="' + esc(s.id) + '">Aportar</button><button class="btn small ghost" data-inv-wd="' + esc(s.id) + '">Retirar</button><button class="btn small ghost" data-inv-fee="' + esc(s.id) + '">Comisión</button><a class="btn small ghost" href="#/movimientos?q=' + encodeURIComponent(s.name) + '">Movimientos</a><button class="btn small ghost" data-inv-edit="' + esc(s.id) + '">' + ui.icon('edit') + '</button></div></article>';
    };
    const byType = new Map();
    for (const s of pf.items) if (s.value > 0) byType.set(s.type, (byType.get(s.type) || 0) + s.value);
    const palette = ['var(--invest)', 'var(--saving)', 'var(--income)', 'var(--debt)', 'var(--accent)', 'var(--expense)', 'var(--muted)'];
    el.innerHTML = '<div class="page">' + vh.pageHead('Inversiones', 'Valor actual = última valoración manual + aportes − retiros posteriores. Sin conexión a brokers.', '<button class="btn primary" data-new-inv>' + ui.icon('plus') + 'Nueva inversión</button>') +
      (invs.length ? '<div class="kpis five">' + vh.kpi('Capital aportado', ui.amt(pf.contributions), 'retirado ' + esc(U.money(pf.withdrawals))) + vh.kpi('Valor actual', ui.amt(pf.value)) +
        vh.kpi('Ganancia / pérdida', ui.amt(pf.gain, { colored: true, sign: true }), 'Valor − (Aportado − Retirado)') + vh.kpi('Rentabilidad acumulada', U.signedPct(pf.returnPct, 2), 'Ganancia ÷ Capital aportado') + vh.kpi('Comisiones', ui.amt(pf.fees), 'neto: ' + esc(U.money(pf.gain - pf.fees, { sign: true }))) + '</div>' +
        '<div class="grid-2"><div class="col">' + pf.items.filter(i => !i.closed).map(card).join('') + '</div><div class="col">' + vh.card('Distribución por tipo', '<div data-donut></div>') +
        (pf.items.some(i => i.closed) ? vh.card('Cerradas', pf.items.filter(i => i.closed).map(card).join('')) : '') + '</div></div>'
        : ui.emptyState('trending', 'Aún no registras inversiones', 'Crea una inversión (ETF, acciones, CDT, fondo, cripto…) y luego registra aportes como movimientos de tipo Inversión.', '<button class="btn primary" data-new-inv>Crear inversión</button>')) + '</div>';
    const d = el.querySelector('[data-donut]');
    if (d) C.mount(d, { type: 'donut', items: [...byType.entries()].map(([k, v], i) => ({ name: S.INVESTMENT_TYPES[k], value: v, color: palette[i % palette.length] })), center: { label: 'Valor', value: U.money(pf.value, { compact: true }) } });
    el.querySelectorAll('[data-spark]').forEach(sp => { const inv = St.get('investments', sp.dataset.spark); C.mount(sp, { type: 'spark', values: L.sortedValuations(inv).map(v => v.value), color: 'var(--invest)', height: 36 }); });
    el.querySelectorAll('[data-new-inv]').forEach(b => b.addEventListener('click', () => F.forms.investment(null)));
    const on = (attr, fn) => el.querySelectorAll('[' + attr + ']').forEach(b => b.addEventListener('click', () => fn(St.get('investments', b.getAttribute(attr)))));
    on('data-inv-val', inv => F.forms.valuation(inv));
    on('data-inv-edit', inv => F.forms.investment(inv));
    on('data-inv-add', inv => F.txForm.open({ type: 'investment', preset: { investmentId: inv.id } }));
    on('data-inv-wd', inv => F.txForm.open({ type: 'investment_withdrawal', preset: { investmentId: inv.id } }));
    on('data-inv-fee', inv => F.txForm.open({ type: 'expense', preset: { investmentId: inv.id, categoryId: 'cat_comisiones', subcategory: 'Inversión', description: 'Comisión ' + inv.name } }));
  }

  // ================================ DEUDAS ================================
  function deudas(el) {
    const debts = St.all('debts');
    const sums = debts.map(d => Object.assign(L.debtSummary(St, d), { debt: d }));
    const owe = sums.filter(s => s.direction === 'payable' && !s.debt.archived), owed = sums.filter(s => s.direction === 'receivable' && !s.debt.archived);
    const archived = sums.filter(s => s.debt.archived);
    const nw = L.netWorthAt(St, U.today());
    const card = s => {
      const d = s.debt, am = s.amortization;
      let amHTML = '';
      if (s.direction === 'payable' && s.balance > 0) {
        if (!d.monthlyPayment) amHTML = '<p class="muted small">Agrega la cuota mensual para estimar plazo e intereses.</p>';
        else if (am && !am.coversInterest) amHTML = '<p class="warn-note">La cuota registrada (' + esc(U.money(d.monthlyPayment)) + ') no alcanza a cubrir los intereses estimados del mes.</p>';
        else if (am && am.months !== null) amHTML = '<p class="small">Con la cuota de ' + esc(U.money(d.monthlyPayment)) + (d.interestRate ? ' y ' + U.pct(d.interestRate, 2) + ' EA' : '') + ': <b>' + am.months + ' cuota(s)</b> restantes (≈ ' + esc(U.monthLabel(U.monthKey(am.payoffDate)).toLowerCase()) + '), intereses estimados <b>' + esc(U.money(am.totalInterest)) + '</b>.</p>';
      }
      return '<article class="debt-card"><header><div><h3>' + esc(d.name) + '</h3><span class="muted small">' + esc(S.DEBT_KINDS[d.kind]) + (d.counterparty ? ' · ' + esc(d.counterparty) : '') + (d.dueDay ? ' · paga el ' + d.dueDay : '') + '</span></div><div class="right">' + ui.amt(s.balance) + '<span class="muted small">saldo</span></div></header>' +
        ui.progress(s.progress, s.balance === 0 ? 'done' : '') + '<div class="debt-prog"><span>' + U.pct(s.progress, 0) + (s.direction === 'payable' ? ' pagado' : ' recuperado') + '</span><span class="muted">de ' + esc(U.money(s.reference)) + '</span></div>' +
        '<dl class="acc-meta"><div><dt>' + (s.direction === 'payable' ? 'Pagos realizados' : 'Abonos recibidos') + '</dt><dd>' + s.payments + ' · ' + esc(U.money(s.paid)) + '</dd></div><div><dt>Intereses ' + (s.direction === 'payable' ? 'pagados' : 'recibidos') + '</dt><dd>' + esc(U.money(s.interestPaid)) + '</dd></div>' +
        (s.direction === 'payable' ? '<div><dt>Tasa</dt><dd>' + (d.interestRate ? U.pct(d.interestRate, 2) + ' EA' : '—') + '</dd></div><div><dt>Cuota</dt><dd>' + (d.monthlyPayment ? esc(U.money(d.monthlyPayment)) : '—') + '</dd></div>' : '') +
        '<div><dt>Inicio</dt><dd>' + esc(U.dateLabel(d.startDate)) + '</dd></div><div><dt>Fin estimado</dt><dd>' + (d.endDate ? esc(U.dateLabel(d.endDate)) : '—') + '</dd></div></dl>' + amHTML +
        '<div class="acc-actions"><button class="btn small primary" data-debt-pay="' + esc(d.id) + '">' + (s.direction === 'payable' ? 'Registrar pago' : 'Registrar abono') + '</button><button class="btn small ghost" data-debt-more="' + esc(d.id) + '">' + (s.direction === 'payable' ? 'Nuevo desembolso' : 'Prestar más') + '</button><a class="btn small ghost" href="#/movimientos?q=' + encodeURIComponent(d.name) + '">Movimientos</a><button class="btn small ghost" data-debt-edit="' + esc(d.id) + '">' + ui.icon('edit') + '</button></div></article>';
    };
    const totalInterest = U.sum(owe, s => s.amortization && s.amortization.totalInterest ? s.amortization.totalInterest : 0);
