  <script>
/* js/finance/ledger.js */
/* =========================================================================
 * finance/ledger.js — Contabilidad: cómo afecta cada movimiento a cuentas,
 * inversiones y deudas; saldos a cualquier fecha; patrimonio neto.
 *
 * Principio: los saldos NO se guardan, se CALCULAN a partir del saldo
 * inicial + todos los movimientos. Así el histórico siempre es coherente,
 * editar un movimiento antiguo corrige todo hacia adelante y se puede
 * reconstruir el patrimonio de cualquier mes pasado.
 * ========================================================================= */
(function (F) {
  'use strict';
  const U = F.utils, S = F.schema;

  // ---------- Memoización (se limpia cuando cambian los datos) ----------
  const memo = new Map();
  function cached(key, fn) {
    if (memo.has(key)) return memo.get(key);
    const v = fn();
    memo.set(key, v);
    return v;
  }
  function invalidate() { memo.clear(); }

  /** Efecto de un movimiento sobre los saldos de cuentas: [{accountId, delta}] */
  function accountEffects(tx, db) {
    const a = tx.amount;
    switch (tx.type) {
      case 'income': return [{ accountId: tx.accountId, delta: a }];
      case 'expense': return [{ accountId: tx.accountId, delta: -a }];
      case 'transfer':
      case 'saving': return [{ accountId: tx.accountId, delta: -a }, { accountId: tx.toAccountId, delta: a }];
      case 'investment': return [{ accountId: tx.accountId, delta: -a }];
      case 'investment_withdrawal': return [{ accountId: tx.accountId, delta: a }];
      case 'loan_received': return [{ accountId: tx.accountId, delta: a }];
      case 'loan_given': return [{ accountId: tx.accountId, delta: -a }];
      case 'debt_payment': {
        const d = db.get('debts', tx.debtId);
        const incoming = d && d.direction === 'receivable'; // me pagan un préstamo que hice
        return [{ accountId: tx.accountId, delta: incoming ? a : -a }];
      }
      default: return [];
    }
  }

  function interestOf(tx) { return tx.type === 'debt_payment' ? Math.min(U.num(tx.interestAmount), tx.amount) : 0; }

  /** Efecto sobre el saldo de una deuda/préstamo (positivo = aumenta lo adeudado). */
  function debtEffect(tx) {
    if (tx.type === 'loan_received' || tx.type === 'loan_given') return tx.amount;
    if (tx.type === 'debt_payment') return -(tx.amount - interestOf(tx));
    return 0;
  }
  /** Efecto sobre el valor de una inversión. */
  function investmentEffect(tx) {
    if (tx.type === 'investment') return tx.amount;
    if (tx.type === 'investment_withdrawal') return -tx.amount;
    return 0;
  }

  /**
   * Convierte un movimiento en partidas de flujo para estadísticas.
   * Solo ingresos y gastos reales (incluye intereses de deudas).
   * Transferencias, ahorro, inversión y abonos a capital NO son gasto.
   */
  function flowItems(tx, db) {
    const out = [];
    if (tx.type === 'income' || tx.type === 'expense') {
      const cat = db.get('categories', tx.categoryId);
      out.push({
        kind: tx.type, amount: tx.amount, categoryId: tx.categoryId, subcategory: tx.subcategory || '',
        nature: tx.nature || (cat && cat.nature) || 'variable'
      });
    } else if (tx.type === 'debt_payment') {
      const i = interestOf(tx);
      if (i > 0) {
        const d = db.get('debts', tx.debtId);
        if (d && d.direction === 'receivable') out.push({ kind: 'income', amount: i, categoryId: 'cat_intereses', subcategory: '', nature: 'variable' });
        else out.push({ kind: 'expense', amount: i, categoryId: tx.categoryId && db.get('categories', tx.categoryId) && db.get('categories', tx.categoryId).kind === 'expense' ? tx.categoryId : S.INTEREST_CATEGORY, subcategory: 'Intereses', nature: 'fixed' });
      }
    }
    return out;
  }

  /** ¿El movimiento está en la moneda base? (no se mezclan monedas en totales) */
  function inBase(tx, db) {
    const acc = db.get('accounts', tx.accountId);
    return !acc || acc.currency === U.getBaseCurrency();
  }

  /** Movimientos ordenados por fecha (y hora de creación) ascendente. */
  function sortedTx(db) {
    return cached('sortedTx', () => db.all('transactions').slice().sort((a, b) =>
      a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt || '') < (b.createdAt || '') ? -1 : 1));
  }

  // ---------- Cuentas ----------
  /** Saldo de cada cuenta a una fecha (inclusive). Devuelve Map(accountId → saldo). */
  function accountBalancesAt(db, date) {
    return cached('accBal:' + date, () => {
      const m = new Map();
      for (const a of db.all('accounts')) m.set(a.id, a.openedAt && a.openedAt <= date ? U.num(a.initialBalance) : 0);
      for (const tx of sortedTx(db)) {
        if (tx.date > date) break;
        for (const e of accountEffects(tx, db)) if (m.has(e.accountId)) m.set(e.accountId, m.get(e.accountId) + e.delta);
      }
      for (const [k, v] of m) m.set(k, U.round2(v));
      return m;
    });
  }
  function accountBalance(db, accountId, date) { return accountBalancesAt(db, date || U.today()).get(accountId) || 0; }
  function accountPurpose(acc) { return acc.purpose || (S.ACCOUNT_TYPES[acc.type] || {}).purpose || 'spending'; }

  // ---------- Inversiones ----------
  function sortedValuations(inv) {
    return (inv.valuations || []).slice().sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.at || '') < (b.at || '') ? -1 : 1);
  }
  /**
   * Valor de una inversión a una fecha = última valoración manual ≤ fecha
   * + aportes − retiros registrados DESPUÉS de esa valoración.
   */
  function investmentValueAt(db, inv, date) {
    const vals = sortedValuations(inv).filter(v => v.date <= date);
    const last = vals[vals.length - 1];
    let value = last ? last.value : 0;
    for (const tx of sortedTx(db)) {

  }

  function monthBounds(key) { return [U.monthStart(key), U.monthEnd(key)]; }
  /** Fin efectivo de un mes para saldos: si es el mes actual, hoy. */
  function effectiveEnd(key) { const t = U.today(); const e = U.monthEnd(key); return e > t ? t : e; }

  function monthSummary(db, key) {
    return L.cached('ms:' + key + ':' + U.today(), () => monthSummaryRaw(db, key));
  }
  function monthSummaryRaw(db, key) {
    const [a, b] = monthBounds(key);
    const s = Object.assign({}, summarize(db, a, b));
    s.key = key;
    s.isCurrent = key === U.currentMonthKey();
    s.isFuture = key > U.currentMonthKey();
    s.netWorth = s.isFuture ? null : L.netWorthAt(db, effectiveEnd(key)).netWorth;
    return s;
  }

  /** Serie mensual con flujos y patrimonio al cierre de cada mes. */
  function monthlySeries(db, fromKey, toKey) {
    return U.monthRange(fromKey, toKey).map(k => {
      const s = monthSummary(db, k);
      return { key: k, income: s.income, expense: s.expense, saving: s.saving, investment: s.investment, net: s.net,
        savingsRate: s.savingsRate, fixed: s.fixed, variable: s.variable, netWorth: s.netWorth, summary: s };
    });
  }

  /** Promedios de los últimos `n` meses COMPLETOS antes de `key` (solo meses con datos). */
  function averages(db, key, n) {
    const first = L.firstDataMonth(db);
    const months = [];
    for (let i = 1; i <= n; i++) { const k = U.addMonthKey(key, -i); if (k >= first) months.push(k); }
    const rows = months.map(k => monthSummary(db, k));
    const c = rows.length;
    const avgOf = f => c ? U.round2(U.sum(rows, f) / c) : 0;
    return {
      months: c, keys: months.reverse(), income: avgOf(r => r.income), expense: avgOf(r => r.expense), saving: avgOf(r => r.saving),
      investment: avgOf(r => r.investment), net: avgOf(r => r.net), fixed: avgOf(r => r.fixed), variable: avgOf(r => r.variable),
      principalPaid: avgOf(r => r.principalPaid), withdrawals: avgOf(r => r.investmentWithdrawals), rows
    };
  }

  /** Lista ordenada de categorías de gasto con porcentaje. */
  function categoryList(db, map, total) {
    return [...map.entries()].map(([id, amount]) => {
      const c = db.get('categories', id);
      return { id, name: c ? c.name : 'Sin categoría', color: c ? c.color : '#8b93a0', amount: U.round2(amount), share: total > 0 ? amount / total * 100 : 0 };
    }).sort((a, b) => b.amount - a.amount);
  }

  // ---------------- Gastos e ingresos del mes ----------------
  function elapsedDays(key) {
    const cur = U.currentMonthKey();
    if (key < cur) return U.daysInMonth(key);
    if (key > cur) return 0;
    return Number(U.today().slice(8, 10));
  }

  /**
   * Proyección de gasto del mes en curso:
   *   gastado hasta hoy + (gasto variable diario promedio × días restantes)
   *   + gastos recurrentes programados aún no registrados en el mes.
   */
  function expenseStats(db, key) {
    const s = monthSummary(db, key);
    const days = elapsedDays(key);
    const dim = U.daysInMonth(key);
    const daily = days > 0 ? s.expense / days : 0;
    let projection = s.expense, scheduled = 0, variableDaily = days > 0 ? s.variable / days : 0;
    if (s.isCurrent) {
      for (const o of R.scheduledBetween(db, U.monthStart(key), U.monthEnd(key))) if (o.rule.type === 'expense') scheduled += U.num(o.rule.amount);
      projection = s.expense + variableDaily * (dim - days) + scheduled;
    }
    return {
      summary: s, total: s.expense, days, daysInMonth: dim, dailyAvg: U.round2(daily), weeklyAvg: U.round2(daily * 7),
      projection: U.round2(projection), scheduledRemaining: U.round2(scheduled), variableDaily: U.round2(variableDaily),
      categories: categoryList(db, s.expenseByCategory, s.expense)
    };
  }

  function incomeStats(db, key) {
    const s = monthSummary(db, key);
    const year = key.slice(0, 4);
    const ys = summarize(db, year + '-01-01', year + '-12-31');
    const av = averages(db, key, 12);
    const prev = monthSummary(db, U.addMonthKey(key, -1));
    const series = monthlySeries(db, maxKey(L.firstDataMonth(db), U.addMonthKey(key, -11)), key);
    return {
      month: s.income, year: ys.income, avg12: av.income, avgMonths: av.months, prev: prev.income,
      changePrev: U.pctChange(s.income, prev.income), changeAvg: U.pctChange(s.income, av.income),
      categories: categoryList(db, s.incomeByCategory, s.income), series
    };
  }
  function maxKey(a, b) { return a > b ? a : b; }

  // ---------------- Comparaciones ----------------
  function compare(cur, prev) {
    const out = {};
    for (const k of ['income', 'expense', 'saving', 'investment', 'net']) out[k] = { cur: cur[k], prev: prev[k], diff: U.round2(cur[k] - prev[k]), pct: U.pctChange(cur[k], prev[k]) };
    out.savingsRate = { cur: cur.savingsRate, prev: prev.savingsRate, diff: cur.savingsRate !== null && prev.savingsRate !== null ? cur.savingsRate - prev.savingsRate : null };
    return out;
  }
  function categoryComparison(db, cur, prev) {
    const ids = new Set([...cur.expenseByCategory.keys(), ...prev.expenseByCategory.keys()]);
    return [...ids].map(id => {
      const c = db.get('categories', id);
      const a = U.round2(cur.expenseByCategory.get(id) || 0), b = U.round2(prev.expenseByCategory.get(id) || 0);
      return { id, name: c ? c.name : 'Sin categoría', color: c ? c.color : '#8b93a0', cur: a, prev: b, diff: U.round2(a - b), pct: U.pctChange(a, b) };
    }).sort((x, y) => Math.abs(y.diff) - Math.abs(x.diff));
  }

  /**
   * Análisis de un mes con comparaciones. Si es el mes en curso, la comparación
   * con el mes anterior usa los mismos días transcurridos (comparación justa).
   */
  function monthAnalysis(db, key) {
    const cur = monthSummary(db, key);
    const prevKey = U.addMonthKey(key, -1);
    let prev, prevLabel;
    if (cur.isCurrent) {
      const d = elapsedDays(key);
      const end = U.monthStart(prevKey).slice(0, 8) + U.pad(Math.min(d, U.daysInMonth(prevKey)));
      prev = summarize(db, U.monthStart(prevKey), end);
      prevLabel = U.monthLabel(prevKey) + ' (días 1–' + Math.min(d, U.daysInMonth(prevKey)) + ')';
    } else {
      prev = monthSummary(db, prevKey);
      prevLabel = U.monthLabel(prevKey);
    }
    const yoyKey = U.addMonthKey(key, -12);
    const yoy = monthSummary(db, yoyKey);
    const hasYoy = yoyKey >= L.firstDataMonth(db) && (yoy.count > 0);
    return {
      key, cur, prev, prevLabel, prevFull: monthSummary(db, prevKey), vsPrev: compare(cur, prev), yoy: hasYoy ? yoy : null,
      vsYoy: hasYoy ? compare(cur, yoy) : null, categories: categoryList(db, cur.expenseByCategory, cur.expense),
      catVsPrev: categoryComparison(db, cur, prev)
    };
  }

  // ---------------- Patrones de comportamiento ----------------
  function insights(db, key) {
    key = key || U.currentMonthKey();
    const out = [];
    const ma = monthAnalysis(db, key);
    const cur = ma.cur, prev = ma.prev;
    const inProgress = cur.isCurrent;
    const periodTxt = inProgress ? 'en lo que va del mes' : 'en ' + U.monthLabel(key).toLowerCase();
    const vsTxt = inProgress ? 'frente al mismo período del mes anterior' : 'frente a ' + U.monthLabel(U.addMonthKey(key, -1)).toLowerCase();
    if (cur.count === 0 && prev.count === 0) return out;

    // 1. Gasto total vs mes anterior
    if (prev.expense > 0 && cur.expense > 0) {
      const p = U.pctChange(cur.expense, prev.expense);
      if (p !== null && Math.abs(p) >= 1) out.push({ dir: p > 0 ? 'up' : 'down', topic: 'expense', text: 'Tus gastos ' + (p > 0 ? 'aumentaron ' : 'disminuyeron ') + U.pct(Math.abs(p), 0) + ' ' + vsTxt + ' (' + U.money(cur.expense) + ' vs ' + U.money(prev.expense) + ').' });
      else out.push({ dir: 'flat', topic: 'expense', text: 'Tus gastos se mantuvieron prácticamente iguales ' + vsTxt + '.' });
    }
    // 2. Cambios por categoría (los más relevantes)
    const relevant = ma.catVsPrev.filter(c => c.prev > 0 && c.cur > 0 && c.pct !== null && Math.abs(c.pct) >= 10 && Math.max(c.cur, c.prev) >= 0.03 * Math.max(cur.expense, prev.expense));
    for (const c of relevant.slice(0, 3)) {
      out.push({ dir: c.pct > 0 ? 'up' : 'down', topic: 'category', text: 'Tus gastos de ' + c.name.toLowerCase() + (c.pct > 0 ? ' aumentaron ' : ' disminuyeron ') + U.pct(Math.abs(c.pct), 0) + ' ' + vsTxt + ' (' + U.money(c.prev) + ' → ' + U.money(c.cur) + ').' });
    }
    const fresh = ma.catVsPrev.filter(c => c.prev === 0 && c.cur > 0 && c.cur >= 0.05 * cur.expense).slice(0, 1);
    for (const c of fresh) out.push({ dir: 'up', topic: 'category', text: c.name + ': ' + U.money(c.cur) + ' ' + periodTxt + '; sin gastos en esa categoría en el período anterior.' });

    // 3. Participación de la categoría principal
    if (ma.categories.length && cur.expense > 0) {
      const top = ma.categories[0];
      out.push({ dir: 'info', topic: 'share', text: top.name + ' representa el ' + U.pct(top.share, 0) + ' de tus gastos ' + periodTxt + '.' });
      if (ma.categories[1]) out.push({ dir: 'info', topic: 'share', text: ma.categories[1].name + ' representa el ' + U.pct(ma.categories[1].share, 0) + ' de tus gastos.' });
    }

    // 4. Promedio de los últimos 6 meses y comparación
    const av = averages(db, key, 6);
    if (av.months >= 2) {
      out.push({ dir: 'info', topic: 'avg', text: 'Tu gasto promedio mensual durante los últimos ' + av.months + ' meses es ' + U.money(av.expense) + '.' });
      if (inProgress) {
        const es = expenseStats(db, key);
        const d = es.projection - av.expense;
        if (av.expense > 0 && Math.abs(d) > 0.01 * av.expense) out.push({ dir: d > 0 ? 'up' : 'down', topic: 'avg', text: 'Al ritmo actual, la proyección de gasto del mes es ' + U.money(es.projection) + ': ' + U.money(Math.abs(d)) + (d > 0 ? ' por encima' : ' por debajo') + ' de tu promedio (proyección, no dato final).' });
      } else if (av.expense > 0) {
        const d = cur.expense - av.expense;
        out.push({ dir: d > 0 ? 'up' : d < 0 ? 'down' : 'flat', topic: 'avg', text: 'Este mes gastaste ' + U.money(Math.abs(d)) + (d > 0 ? ' más' : ' menos') + ' que tu promedio (' + U.signedPct(U.pctChange(cur.expense, av.expense), 0) + ').' });
      }
      if (av.income > 0 && !inProgress && cur.income > 0) {
        const p = U.pctChange(cur.income, av.income);
        if (p !== null && Math.abs(p) >= 2) out.push({ dir: p > 0 ? 'up' : 'down', topic: 'income', text: 'Tus ingresos ' + (p > 0 ? 'aumentaron ' : 'disminuyeron ') + U.pct(Math.abs(p), 0) + ' respecto al promedio de los últimos ' + av.months + ' meses.' });
        else if (p !== null) out.push({ dir: 'flat', topic: 'income', text: 'Tus ingresos están en línea con el promedio de los últimos ' + av.months + ' meses.' });
      }
      const avgRate = U.safeDiv(av.income - av.expense, av.income);
      if (!inProgress && cur.savingsRate !== null && avgRate !== null) {
        const diff = cur.savingsRate - avgRate * 100;
        if (Math.abs(diff) >= 1) out.push({ dir: diff > 0 ? 'up' : 'down', topic: 'rate', text: 'Tu tasa de ahorro fue ' + U.pct(cur.savingsRate, 0) + ', ' + U.plainNumber(Math.abs(diff), 0) + (Math.round(Math.abs(diff)) === 1 ? ' punto porcentual ' : ' puntos porcentuales ') + (diff > 0 ? 'por encima' : 'por debajo') + ' de tu promedio (' + U.pct(avgRate * 100, 0) + ').' });
      }
    }
    // 5. Categorías con aumento sostenido (3 meses completos consecutivos)
    const lastKeys = [3, 2, 1].map(i => U.addMonthKey(key, inProgress ? -i : -i + 1)).filter(k => k >= L.firstDataMonth(db));
    if (lastKeys.length === 3) {
      const sums = lastKeys.map(k => monthSummary(db, k).expenseByCategory);
      const ids = new Set(sums.flatMap(m => [...m.keys()]));
      for (const id of ids) {
        const v = sums.map(m => m.get(id) || 0);
        if (v[0] > 0 && v[1] > v[0] * 1.05 && v[2] > v[1] * 1.05) {
          const c = db.get('categories', id);
          out.push({ dir: 'up', topic: 'trend', text: (c ? c.name : 'Una categoría') + ' aumentó tres meses seguidos (' + v.map(x => U.money(x, { compact: true })).join(' → ') + ').' });
          if (out.filter(o => o.topic === 'trend').length >= 2) break;
        }
      }
    }
    // 6. Gastos fijos
    if (cur.expense > 0 && cur.fixed > 0) out.push({ dir: 'info', topic: 'fixed', text: 'Los gastos fijos son el ' + U.pct(cur.fixed / cur.expense * 100, 0) + ' de tus gastos ' + periodTxt + ' (' + U.money(cur.fixed) + ').' });
    // 7. Suscripciones
    const subs = R.subscriptionsSummary(db);
    if (subs.count) out.push({ dir: 'info', topic: 'subs', text: 'Actualmente gastas ' + U.money(subs.monthly) + ' al mes en ' + subs.count + ' suscripción(es).' });
    return out;
  }

  // ---------------- Margen del mes ----------------
  /**
   * "¿Cuánto puedo gastar sin afectar mis objetivos?" — cálculo descriptivo:
   *  Ingresos del mes − Gastos − Ahorro − Inversión − Abonos a capital
   *  − Pagos programados pendientes del mes − Aportes pendientes a metas.
   */
  function monthMargin(db, key) {
    key = key || U.currentMonthKey();
    const s = monthSummary(db, key);
    // Ocurrencias recurrentes del mes aún no registradas (incluye las vencidas pendientes)
    const sched = R.scheduledBetween(db, U.monthStart(key), U.monthEnd(key));
    let scheduledOut = 0, scheduledIn = 0;
    const scheduledToGoals = new Map();
    for (const o of sched) {
      const r = o.rule, amt = U.num(r.amount);
      if (r.type === 'transfer') continue;
      if (r.type === 'income' || r.type === 'investment_withdrawal' || r.type === 'loan_received') { if (r.type === 'income') scheduledIn += amt; continue; }
      if (r.type === 'debt_payment') { const d = db.get('debts', r.debtId); if (d && d.direction === 'receivable') continue; }
      scheduledOut += amt;
      for (const g of db.all('goals')) if (r.goalId === g.id || (g.accountId && r.toAccountId === g.accountId)) addTo(scheduledToGoals, g.id, amt);
    }
    let goalsPending = 0;
    for (const g of db.all('goals')) {
      if (g.archived) continue;
      const p = L.goalProgress(db, g);
      if (p.completed || !(g.monthlyContribution > 0)) continue;
      goalsPending += Math.max(0, g.monthlyContribution - p.contributedThisMonth - (scheduledToGoals.get(g.id) || 0));
    }
    const committed = s.saving + s.investment + s.principalPaid;
    const margin = U.round2(s.income + scheduledIn - s.expense - committed - scheduledOut - goalsPending);
    return { key, income: s.income, scheduledIn: U.round2(scheduledIn), expense: s.expense, committed: U.round2(committed), saving: s.saving,
      investment: s.investment, principalPaid: s.principalPaid, scheduled: U.round2(scheduledOut), goalsPending: U.round2(goalsPending), margin };
  }

  // ---------------- Vista anual ----------------
  function yearSummary(db, year) {
    year = String(year);
    const keys = U.monthRange(year + '-01', year + '-12');
    const curKey = U.currentMonthKey();
    const rows = keys.map(k => {
      const s = monthSummary(db, k);
      return { key: k, income: s.income, expense: s.expense, saving: s.saving, investment: s.investment, net: s.net, netWorth: s.netWorth, savingsRate: s.savingsRate, future: k > curKey };
    });
    const tot = summarize(db, year + '-01-01', year + '-12-31');
    const first = L.firstDataMonth(db);
    const activeMonths = keys.filter(k => k >= first && k <= curKey).length;
    const startNW = L.netWorthAt(db, (Number(year) - 1) + '-12-31').netWorth;
    const endDate = year + '-12-31' > U.today() ? U.today() : year + '-12-31';
    const endNW = L.netWorthAt(db, endDate).netWorth;
    const cats = categoryList(db, tot.expenseByCategory, tot.expense);
    const prevTot = summarize(db, (Number(year) - 1) + '-01-01', (Number(year) - 1) + '-12-31');
    return {
      year, rows, totals: tot, activeMonths, startNW, endNW, growth: U.round2(endNW - startNW), growthPct: U.pctChange(endNW, startNW),
      avgIncome: activeMonths ? U.round2(tot.income / activeMonths) : 0, avgExpense: activeMonths ? U.round2(tot.expense / activeMonths) : 0,
      avgSaving: activeMonths ? U.round2(tot.net / activeMonths) : 0, topCategory: cats[0] || null, categories: cats,
      prev: prevTot.count ? prevTot : null, vsPrev: prevTot.count ? compare(tot, prevTot) : null
    };
  }

  // ---------------- Proyección ----------------
  /**
   * Proyección lineal basada en promedios de los últimos `basis` meses completos.
   * opts: { basis, horizon (meses), incomeAdj (%), expenseAdj (%), annualReturn (%) }
   * Patrimonio_m = Patrimonio_0 + m × flujo neto mensual + rendimiento supuesto sobre inversiones.
   */
  function projection(db, opts) {
    opts = Object.assign({ basis: 6, horizon: 12, incomeAdj: 0, expenseAdj: 0, annualReturn: 0 }, opts || {});
    const key = U.currentMonthKey();
    const av = averages(db, key, opts.basis);
    const nw = L.netWorthAt(db, U.today());
    const income = av.income * (1 + opts.incomeAdj / 100);
    const expense = av.expense * (1 + opts.expenseAdj / 100);
    const net = income - expense;
    const r = opts.annualReturn ? Math.pow(1 + opts.annualReturn / 100, 1 / 12) - 1 : 0;
    const contrib = Math.max(0, av.investment - av.withdrawals);
    let liquid = nw.liquid + nw.savings - nw.cardDebt, inv = nw.invested, cumNet = 0, cumReturn = 0;
    const fixedRest = nw.receivables + nw.otherAssets - nw.debts - nw.otherLiabilities;
    let debts = nw.debts;
    const series = [{ m: 0, key, liquid: U.round2(liquid), invested: U.round2(inv), netWorth: nw.netWorth, cumNet: 0 }];
    for (let m = 1; m <= opts.horizon; m++) {
      const ret = inv * r;
      inv = inv + ret + contrib;
      cumReturn += ret;
      const principal = Math.min(debts, av.principalPaid);
      debts -= principal;
      liquid = liquid + net - contrib - principal;
      cumNet += net;
      series.push({ m, key: U.addMonthKey(key, m), liquid: U.round2(liquid), invested: U.round2(inv), netWorth: U.round2(nw.netWorth + cumNet + cumReturn), cumNet: U.round2(cumNet), cumReturn: U.round2(cumReturn) });
    }
    void fixedRest;
    return { basis: av, months: av.months, income: U.round2(income), expense: U.round2(expense), net: U.round2(net), start: nw, series, opts };
  }

  // ---------------- Salud financiera (indicadores descriptivos) ----------------
  function emergencyFund(db) {
    const goal = db.all('goals').find(g => g.kind === 'emergency' && !g.archived);
    if (goal) return { source: 'goal', label: 'Meta "' + goal.name + '"', amount: L.goalProgress(db, goal).current };
    const nw = L.netWorthAt(db, U.today());
    return { source: 'savings', label: 'Cuentas de ahorro', amount: nw.savings };
  }

  function health(db) {
    const key = U.currentMonthKey();
    const av3 = averages(db, key, 3);
    const av6 = averages(db, key, 6);
    const basis = av3.months ? av3 : null;
    const curM = monthSummary(db, key);
    const b = basis || { income: curM.income, expense: curM.expense, investment: curM.investment, fixed: curM.fixed, variable: curM.variable, months: 0 };
    const nw = L.netWorthAt(db, U.today());
    const debtsList = db.all('debts').filter(d => d.direction === 'payable');
    const monthlyDebtPayments = U.sum(debtsList, d => L.debtBalanceAt(db, d, U.today()) > 0 ? U.num(d.monthlyPayment) : 0);
    const ef = emergencyFund(db);
    const avgExp = av6.months ? av6.expense : b.expense;
    const nw12 = L.netWorthAt(db, U.addMonths(U.today(), -12)).netWorth;
    const nw1 = L.netWorthAt(db, U.addMonths(U.today(), -1)).netWorth;
    const prevMonth = monthSummary(db, U.addMonthKey(key, -1));
    const prevAv = averages(db, U.addMonthKey(key, -1), 3);
    const r = (a, c) => { const x = U.safeDiv(a, c); return x === null ? null : x * 100; };
    const basisTxt = basis ? 'promedio de los últimos ' + b.months + ' meses completos' : 'mes en curso';
    return {
      basisTxt,
      metrics: [
        { id: 'savingsRate', label: 'Tasa de ahorro', value: r(b.income - b.expense, b.income), unit: '%', formula: '(Ingresos − Gastos) ÷ Ingresos × 100', inputs: [['Ingresos', b.income], ['Gastos', b.expense]] },
        { id: 'investmentRate', label: 'Tasa de inversión', value: r(b.investment, b.income), unit: '%', formula: 'Inversión ÷ Ingresos × 100', inputs: [['Inversión', b.investment], ['Ingresos', b.income]] },
        { id: 'fixedIncome', label: 'Gastos fijos / ingresos', value: r(b.fixed, b.income), unit: '%', formula: 'Gastos fijos ÷ Ingresos × 100', inputs: [['Gastos fijos', b.fixed], ['Ingresos', b.income]] },
        { id: 'variableIncome', label: 'Gastos variables / ingresos', value: r(b.variable, b.income), unit: '%', formula: 'Gastos variables ÷ Ingresos × 100', inputs: [['Gastos variables', b.variable], ['Ingresos', b.income]] },
        { id: 'dti', label: 'Cuotas de deuda / ingresos', value: r(monthlyDebtPayments, b.income), unit: '%', formula: 'Suma de cuotas mensuales de deudas activas ÷ Ingresos mensuales × 100', inputs: [['Cuotas mensuales', monthlyDebtPayments], ['Ingresos', b.income]] },
        { id: 'debtIncome', label: 'Deuda total / ingreso anual', value: r(nw.debts + nw.cardDebt, b.income * 12), unit: '%', formula: 'Deudas totales ÷ (Ingreso mensual × 12) × 100', inputs: [['Deudas totales', nw.debts + nw.cardDebt], ['Ingreso anual estimado', b.income * 12]] },
        { id: 'emergency', label: 'Meses cubiertos por el fondo de emergencia', value: U.safeDiv(ef.amount, avgExp), unit: 'meses', formula: 'Fondo de emergencia ÷ Gasto mensual promedio (6 meses)', inputs: [[ef.label, ef.amount], ['Gasto mensual promedio', avgExp]] },
        { id: 'nwGrowth12', label: 'Crecimiento patrimonial (12 meses)', value: U.pctChange(nw.netWorth, nw12), unit: '%', money: nw.netWorth - nw12, formula: '(Patrimonio hoy − Patrimonio hace 12 meses) ÷ |Patrimonio hace 12 meses| × 100', inputs: [['Patrimonio hoy', nw.netWorth], ['Hace 12 meses', nw12]] },

  <script>

    const v = cat ? Object.assign({}, cat, { subs: (cat.subcategories || []).join(', ') }) : { kind: kind || 'expense', group: kind === 'income' ? 'Ingresos' : 'Otros', nature: 'variable', color: '#5b7083', subs: '' };
    return entityForm({
      title: isNew ? 'Nueva categoría' : 'Editar categoría', values: v,
      fields: [
        { name: 'name', label: 'Nombre' },
        { name: 'kind', label: 'Tipo', type: 'select', options: { expense: 'Gasto', income: 'Ingreso' }, show: () => isNew },
        { name: 'group', label: 'Grupo', type: 'select', options: vals => vals.kind === 'income' ? ['Ingresos'] : S.EXPENSE_GROUPS },
        { name: 'nature', label: 'Normalmente es', type: 'select', options: S.NATURES, show: vals => vals.kind === 'expense', hint: 'Valor por defecto al registrar; se puede cambiar en cada gasto.' },
        { name: 'subs', label: 'Subcategorías', type: 'textarea', optional: true, hint: 'Separadas por coma. Ej: Mercado, Restaurante, Domicilios' },
        { name: 'color', label: 'Color', type: 'color' }
      ],
      onSave: vals => {
        const subs = [...new Set(String(vals.subs || '').split(',').map(s => s.trim()).filter(Boolean))];
        const rec = Object.assign({}, cat || {}, { name: String(vals.name || '').trim(), kind: vals.kind, group: vals.kind === 'income' ? 'Ingresos' : vals.group, nature: vals.nature || 'variable', subcategories: subs, color: vals.color });
        return St.save('categories', rec);
      },
      onDone,
      onDelete: isNew ? null : async () => deleteCategory(cat)
    });
  }
  async function deleteCategory(cat) {
    const u = St.usages('categories', cat.id);
    if (!u.transactions && !u.recurring) return (await confirmDelete('la categoría «' + cat.name + '»', u.budgets ? '<p>También se eliminará su presupuesto.</p>' : '')) && tryRemove('categories', cat.id);
    const others = St.all('categories').filter(c => c.kind === cat.kind && c.id !== cat.id);
    return new Promise(resolve => {
      const m = ui.modal({
        title: 'Eliminar «' + cat.name + '»', size: 'small',
        body: '<p>Esta categoría tiene ' + u.transactions + ' movimiento(s)' + (u.recurring ? ' y ' + u.recurring + ' recurrente(s)' : '') + '. Para no perder el histórico, se moverán a otra categoría.</p>' +
          '<label class="field"><span class="lbl">Mover a</span><select data-rep>' + ui.options(others.map(c => ({ value: c.id, label: c.name })), cat.kind === 'income' ? S.FALLBACK_INCOME_CATEGORY : S.FALLBACK_EXPENSE_CATEGORY) + '</select></label>',
        footer: '<button class="btn ghost" data-close>Cancelar</button><button class="btn danger" data-go>Mover y eliminar</button>',
        onClose: () => resolve(false)
      });
      m.el.querySelector('[data-go]').addEventListener('click', async () => {
        const ok = await tryRemove('categories', cat.id, { replacementCategoryId: m.el.querySelector('[data-rep]').value });
        resolve(ok); m.close();
      });
    });
  }

  // ------------------------- Presupuesto -------------------------
  function budget(b, onDone) {
    const isNew = !b;
    const used = new Set(St.all('budgets').map(x => x.categoryId));
    const cats = St.all('categories').filter(c => c.kind === 'expense' && (!used.has(c.id) || (b && b.categoryId === c.id)));
    return entityForm({
      title: isNew ? 'Nuevo presupuesto' : 'Editar presupuesto', size: 'small', values: b ? Object.assign({}, b) : {},
      fields: [
        { name: 'categoryId', label: 'Categoría', type: 'select', options: cats.map(c => ({ value: c.id, label: c.name })), placeholder: 'Elige…' },
        { name: 'amount', label: 'Límite mensual', type: 'amount' }
      ],
      onSave: vals => St.save('budgets', Object.assign({}, b || {}, vals)), onDone,
      onDelete: isNew ? null : async () => (await confirmDelete('este presupuesto')) && tryRemove('budgets', b.id)
    });
  }

  // ------------------------- Meta -------------------------
  function goal(g, onDone, preset) {
    const isNew = !g;
    const accs = St.all('accounts').filter(a => !a.archived || (g && g.accountId === a.id));
    const v = g ? Object.assign({}, g) : Object.assign({ kind: 'custom', manualAmount: 0, monthlyContribution: 0, accountId: '' }, preset || {});
    return entityForm({
      title: isNew ? 'Nueva meta' : 'Editar meta', values: v,
      fields: [
        { name: 'kind', label: 'Tipo de meta', type: 'select', options: S.GOAL_KINDS },
        { name: 'name', label: 'Nombre', placeholder: 'Ej. Fondo de emergencia' },
        { name: 'targetAmount', label: 'Valor objetivo', type: 'amount' },
        { name: 'accountId', label: '¿Dónde está el dinero?', type: 'select', options: [{ value: '', label: 'Lo registro manualmente' }].concat(accs.map(a => ({ value: a.id, label: 'Saldo de ' + a.name }))), hint: 'Si eliges una cuenta, el avance es su saldo actual.' },
        { name: 'manualAmount', label: 'Valor actual ahorrado', type: 'amount', emptyAs: 0, show: vals => !vals.accountId, hint: 'Los movimientos de Ahorro asociados a esta meta se suman automáticamente.' },
        { name: 'targetDate', label: 'Fecha objetivo', type: 'date', optional: true },
        { name: 'monthlyContribution', label: 'Aporte mensual deseado', type: 'amount', emptyAs: 0, optional: true },
        { name: 'notes', label: 'Notas', type: 'textarea', optional: true },
        { name: 'archived', label: 'Archivada', type: 'checkbox', show: () => !isNew }
      ],
      onSave: vals => {
        const rec = Object.assign({}, g || {}, vals);
        rec.name = String(rec.name || '').trim() || S.GOAL_KINDS[rec.kind];
        rec.accountId = rec.accountId || null; rec.targetDate = rec.targetDate || null;
        return St.save('goals', rec);
      },
      onDone,
      onDelete: isNew ? null : async () => (await confirmDelete('la meta «' + g.name + '»', '<p>Los movimientos asociados se conservan.</p>')) && tryRemove('goals', g.id)
    });
  }

  // ------------------------- Inversión -------------------------
  function investment(inv, onDone) {
    const isNew = !inv;
    const v = inv ? Object.assign({}, inv) : { type: 'etf', startDate: U.today(), openingContributed: 0, openingValue: '' };
    return entityForm({
      title: isNew ? 'Nueva inversión' : 'Editar inversión', values: v,
      intro: isNew ? 'Si ya tenías esta inversión, registra el capital aportado hasta hoy y su valor actual. Los aportes futuros regístralos como movimientos de tipo Inversión (salen de una cuenta).' : '',
      fields: [
        { name: 'name', label: 'Nombre', placeholder: 'Ej. ETF S&P 500, CDT 90 días' },
        { name: 'type', label: 'Tipo', type: 'select', options: S.INVESTMENT_TYPES },
        { name: 'startDate', label: 'Fecha de inicio', type: 'date' },
        { name: 'openingContributed', label: 'Capital aportado antes de usar la app', type: 'amount', emptyAs: 0, show: () => isNew, hint: 'Deja 0 si vas a registrar el primer aporte como movimiento.' },
        { name: 'openingValue', label: 'Valor actual', type: 'amount', show: vals => isNew && U.num(vals.openingContributed) > 0, hint: 'Si lo dejas vacío, se usa el capital aportado.' },
        { name: 'notes', label: 'Notas', type: 'textarea', optional: true, hint: 'Ej. tasa, plataforma, fecha de vencimiento.' },
        { name: 'closed', label: 'Inversión cerrada (liquidada)', type: 'checkbox', show: () => !isNew }
      ],
      onSave: vals => {
        const rec = Object.assign({}, inv || {}, { name: String(vals.name || '').trim(), type: vals.type, startDate: vals.startDate, notes: vals.notes || '', closed: !!vals.closed });
        if (isNew) {
          rec.openingContributed = U.num(vals.openingContributed);
          const val = vals.openingValue === '' || vals.openingValue === undefined ? rec.openingContributed : vals.openingValue;
          rec.valuations = rec.openingContributed > 0 || U.num(val) > 0 ? [{ date: vals.startDate && vals.startDate < U.today() ? U.today() : vals.startDate, value: U.num(val), at: new Date().toISOString() }] : [];
          if (rec.openingContributed > 0 && vals.startDate && vals.startDate < U.today()) rec.valuations.unshift({ date: vals.startDate, value: rec.openingContributed, at: new Date(0).toISOString() });
          if (typeof val === 'number' && !Number.isFinite(val)) throw new F.ValidationError({ openingValue: 'Escribe un número válido.' });
        }
        return St.save('investments', rec);
      },
      onDone,
      onDelete: isNew ? null : async () => {
        const u = St.usages('investments', inv.id);
        if (!u.transactions) return (await confirmDelete('la inversión «' + inv.name + '»')) && tryRemove('investments', inv.id);
        const ok = await ui.confirmDialog({ title: 'Eliminar inversión', html: '<p>«' + esc(inv.name) + '» tiene ' + u.transactions + ' movimiento(s) asociados (aportes/retiros). Se eliminarán también y los saldos de tus cuentas se recalcularán.</p><p>Si ya la liquidaste, márcala como cerrada para conservar el histórico.</p>', confirmText: 'Eliminar todo', danger: true, typeToConfirm: 'ELIMINAR' });
        return ok && tryRemove('investments', inv.id, { cascade: true });
      }
    });
  }

  /** Actualizar valor de mercado (valoración manual). */
  function valuation(inv, onDone) {
    const cur = L.investmentValueAt(St, inv, U.today());
    return entityForm({
      title: 'Actualizar valor · ' + inv.name, size: 'small', values: { date: U.today(), value: cur },
      intro: 'Escribe el valor que muestra hoy tu plataforma o extracto. La diferencia con lo aportado es tu ganancia o pérdida.',
      fields: [{ name: 'value', label: 'Valor actual', type: 'amount' }, { name: 'date', label: 'Fecha del valor', type: 'date' }],
      onSave: vals => {
        if (typeof vals.value !== 'number' || !Number.isFinite(vals.value) || vals.value < 0) throw new F.ValidationError({ value: 'Escribe un valor válido (0 o más).' });
        if (!U.isValidDate(vals.date)) throw new F.ValidationError({ date: 'Fecha inválida.' });
        if (vals.date > U.today()) throw new F.ValidationError({ date: 'La fecha no puede ser futura.' });
        const rec = Object.assign({}, inv, { valuations: (inv.valuations || []).filter(x => x.date !== vals.date).concat([{ date: vals.date, value: vals.value, at: new Date().toISOString() }]) });
        return St.save('investments', rec);
      }, onDone
    });
  }

  // ------------------------- Deuda / préstamo -------------------------
  function debt(d, direction, onDone) {
    const isNew = !d;
    const dir = d ? d.direction : (direction || 'payable');
    const v = d ? Object.assign({}, d) : { direction: dir, kind: dir === 'receivable' ? 'personal' : 'consumer', startDate: U.today(), openingBalance: '', principal: '', interestRate: '', monthlyPayment: '' };
    const receivable = dir === 'receivable';
    return entityForm({
      title: isNew ? (receivable ? 'Dinero que me deben' : 'Nueva deuda') : 'Editar ' + (receivable ? 'préstamo' : 'deuda'), values: v,
      intro: isNew ? (receivable ? 'Registra un préstamo que hiciste. Si el dinero sale hoy de una de tus cuentas, mejor usa el movimiento «Préstamo entregado».' : 'Registra una deuda existente con su saldo de hoy. Los pagos futuros regístralos como «Pago de deuda» para que el saldo baje solo.') : '',
      fields: [
        { name: 'name', label: 'Nombre', placeholder: receivable ? 'Ej. Préstamo a Andrés' : 'Ej. Tarjeta Visa, Crédito vehículo' },
        { name: 'counterparty', label: receivable ? 'Persona' : 'Acreedor', optional: true },
        { name: 'kind', label: 'Tipo', type: 'select', options: S.DEBT_KINDS },
        { name: 'principal', label: receivable ? 'Valor prestado' : 'Capital inicial (monto original)', type: 'amount', emptyAs: 0 },
        { name: 'openingBalance', label: 'Saldo pendiente a la fecha de registro', type: 'amount', emptyAs: 0, hint: 'Lo que falta por pagar hoy (o en la fecha de abajo).' },
        { name: 'startDate', label: 'Fecha del saldo', type: 'date' },
        { name: 'interestRate', label: 'Tasa de interés (% efectivo anual)', type: 'number', step: '0.01', min: 0, max: 1000, optional: true, show: () => !receivable, hint: 'Ej. 24 para 24% EA. Se usa para estimar intereses.' },
        { name: 'monthlyPayment', label: 'Cuota mensual', type: 'amount', emptyAs: 0, optional: true },
        { name: 'dueDay', label: 'Día de pago', type: 'number', min: 1, max: 31, step: 1, optional: true },
        { name: 'endDate', label: 'Fecha estimada de finalización', type: 'date', optional: true },
        { name: 'notes', label: 'Notas', type: 'textarea', optional: true },
        { name: 'archived', label: 'Archivada', type: 'checkbox', show: () => !isNew }
      ],
      onSave: vals => {
        const rec = Object.assign({}, d || {}, vals, { direction: dir });
        rec.name = String(rec.name || '').trim();
        rec.interestRate = vals.interestRate === null || vals.interestRate === '' || vals.interestRate === undefined ? 0 : vals.interestRate;
        rec.dueDay = vals.dueDay === null || vals.dueDay === '' ? null : vals.dueDay;
        rec.endDate = vals.endDate || null;
        if (!rec.principal && rec.openingBalance) rec.principal = rec.openingBalance;
        return St.save('debts', rec);
      },
      onDone,
      onDelete: isNew ? null : async () => {
        const u = St.usages('debts', d.id);
        if (!u.transactions) return (await confirmDelete('«' + d.name + '»')) && tryRemove('debts', d.id);
        const ok = await ui.confirmDialog({ title: 'Eliminar', html: '<p>«' + esc(d.name) + '» tiene ' + u.transactions + ' movimiento(s) asociados. Se eliminarán también y los saldos se recalcularán. Si ya está pagada, puedes archivarla.</p>', confirmText: 'Eliminar todo', danger: true, typeToConfirm: 'ELIMINAR' });
        return ok && tryRemove('debts', d.id, { cascade: true });
      }
    });
  }

  // ------------------------- Recurrente -------------------------
  function recurring(r, onDone, preset) {
    const isNew = !r;
    const accs = St.all('accounts').filter(a => !a.archived || (r && (r.accountId === a.id || r.toAccountId === a.id)));
    const accOpts = accs.map(a => ({ value: a.id, label: a.name }));
    const v = r ? Object.assign({}, r) : Object.assign({ type: 'expense', frequency: 'monthly', nextDate: U.today(), active: true, autoConfirm: false, isSubscription: false }, preset || {});
    return entityForm({
      title: isNew ? (v.isSubscription ? 'Nueva suscripción' : 'Nuevo recurrente') : 'Editar recurrente', values: v,
      intro: 'Al abrir la app, los pagos vencidos aparecen como pendientes para confirmar, o se registran solos si activas el registro automático.',
      fields: [
        { name: 'name', label: 'Nombre', placeholder: 'Ej. Netflix, Arriendo, Salario' },
        { name: 'type', label: 'Tipo', type: 'select', options: { expense: 'Gasto', income: 'Ingreso', saving: 'Ahorro', investment: 'Inversión', transfer: 'Transferencia', debt_payment: 'Pago de deuda' } },
        { name: 'amount', label: 'Valor', type: 'amount' },
        { name: 'frequency', label: 'Frecuencia', type: 'select', options: Object.fromEntries(Object.entries(S.FREQUENCIES).map(([k, x]) => [k, x.label])) },
        { name: 'nextDate', label: 'Próximo pago', type: 'date' },
        { name: 'accountId', label: vals => 'Cuenta', type: 'select', options: accOpts, placeholder: 'Elige…' },
        { name: 'toAccountId', label: 'Hacia la cuenta', type: 'select', options: accOpts, placeholder: 'Elige…', show: vals => vals.type === 'saving' || vals.type === 'transfer' },
        { name: 'categoryId', label: 'Categoría', type: 'select', options: vals => St.all('categories').filter(c => c.kind === vals.type).map(c => ({ value: c.id, label: c.name })), placeholder: 'Elige…', show: vals => vals.type === 'expense' || vals.type === 'income' },
        { name: 'nature', label: 'Tipo de gasto', type: 'select', options: S.NATURES, show: vals => vals.type === 'expense' },
        { name: 'investmentId', label: 'Inversión', type: 'select', options: () => St.all('investments').map(i => ({ value: i.id, label: i.name })), placeholder: 'Elige…', show: vals => vals.type === 'investment' },
        { name: 'debtId', label: 'Deuda', type: 'select', options: () => St.all('debts').map(d => ({ value: d.id, label: d.name })), placeholder: 'Elige…', show: vals => vals.type === 'debt_payment' },
        { name: 'goalId', label: 'Meta', type: 'select', options: () => St.all('goals').map(g => ({ value: g.id, label: g.name })), placeholder: 'Sin meta', optional: true, show: vals => vals.type === 'saving' },
        { name: 'endDate', label: 'Termina el', type: 'date', optional: true },
        { name: 'isSubscription', label: 'Es una suscripción', type: 'checkbox', show: vals => vals.type === 'expense' },
        { name: 'autoConfirm', label: 'Registrar automáticamente al abrir la app', type: 'checkbox' },
        { name: 'active', label: 'Activo', type: 'checkbox' }
      ].map(f => typeof f.label === 'function' ? Object.assign(f, { label: 'Cuenta' }) : f),
      onSave: vals => {
        const rec = Object.assign({}, r || {}, vals);
        rec.name = String(rec.name || '').trim();
        for (const k of ['toAccountId', 'categoryId', 'investmentId', 'debtId', 'goalId', 'endDate']) rec[k] = rec[k] || null;
        if (rec.type !== 'saving' && rec.type !== 'transfer') rec.toAccountId = null;
        if (rec.type !== 'expense') { rec.isSubscription = false; rec.nature = undefined; }
        if (!rec.description) rec.description = rec.name;
        if (isNew || !r.anchorDay || (r && r.nextDate !== rec.nextDate)) rec.anchorDay = Number(String(rec.nextDate || '').slice(8, 10)) || 1;
        if (isNew) rec.startDate = rec.nextDate;
        return St.save('recurring', rec);
      },
      onDone,
      onDelete: isNew ? null : async () => (await confirmDelete('«' + r.name + '»', '<p>Los movimientos ya registrados se conservan.</p>')) && tryRemove('recurring', r.id)
    });
  }

  // ------------------------- Otro activo / pasivo -------------------------
  function asset(a, onDone) {
    const isNew = !a;
    const last = a ? L.sortedValuations(a).slice(-1)[0] : null;
    const v = a ? Object.assign({}, a, { value: last ? last.value : 0, date: U.today() }) : { kind: 'property', date: U.today() };
    return entityForm({
      title: isNew ? 'Nuevo activo o pasivo' : 'Actualizar «' + a.name + '»', values: v,
      intro: 'Bienes y obligaciones que no son cuentas: vivienda, vehículo, objetos de valor, otros pasivos. El valor lo actualizas tú.',
      fields: [
        { name: 'name', label: 'Nombre', placeholder: 'Ej. Apartamento, Moto' },
        { name: 'kind', label: 'Tipo', type: 'select', options: S.ASSET_KINDS },
        { name: 'value', label: 'Valor estimado', type: 'amount' },
        { name: 'date', label: 'Fecha del valor', type: 'date' },
        { name: 'notes', label: 'Notas', type: 'textarea', optional: true }
      ],
      onSave: vals => {
        if (typeof vals.value !== 'number' || !Number.isFinite(vals.value)) throw new F.ValidationError({ value: 'Escribe un valor válido.' });
        if (!U.isValidDate(vals.date)) throw new F.ValidationError({ date: 'Fecha inválida.' });
        const vals0 = (a && a.valuations) || [];
        const rec = Object.assign({}, a || {}, { name: String(vals.name || '').trim(), kind: vals.kind, notes: vals.notes || '', valuations: vals0.filter(x => x.date !== vals.date).concat([{ date: vals.date, value: vals.value }]) });
        return St.save('assets', rec);
      },
      onDone,
      onDelete: isNew ? null : async () => (await confirmDelete('«' + a.name + '»')) && tryRemove('assets', a.id)
    });
  }

  F.forms = { entityForm, account, category, deleteCategory, budget, goal, investment, valuation, debt, recurring, asset };
})(typeof window !== 'undefined' ? (window.FIN = window.FIN || {}) : (globalThis.FIN = globalThis.FIN || {}));

</script>
  <script>
/* js/ui/tx-form.js */
/* =========================================================================
 * ui/tx-form.js — Registro rápido de movimientos.
 * Flujo pensado para el celular: Valor → Categoría → Cuenta → Guardar.
 * Todo lo demás (fecha, etiquetas, notas, recurrencia…) es opcional.
 * ========================================================================= */
(function (F) {
  'use strict';
  const U = F.utils, S = F.schema, L = F.ledger, St = F.Store, ui = F.ui;
  const esc = U.escapeHTML;

  const PRIMARY = ['expense', 'income', 'transfer', 'saving', 'investment'];
  const SECONDARY = ['debt_payment', 'loan_received', 'loan_given', 'investment_withdrawal'];

  function activeAccounts(currentIds) {
    return L.accountsWithBalance(St).filter(a => !a.archived || (currentIds || []).includes(a.id));
  }
  /** Cuentas ordenadas por uso reciente para un tipo de movimiento. */
  function accountsByUsage(type, currentIds) {
    const since = U.addDays(U.today(), -120);
    const count = new Map();
    for (const t of St.all('transactions')) if (t.date >= since && t.type === type) count.set(t.accountId, (count.get(t.accountId) || 0) + 1);
    return activeAccounts(currentIds).sort((a, b) => (count.get(b.id) || 0) - (count.get(a.id) || 0));
  }
  function categoriesByUsage(kind) {
    const since = U.addDays(U.today(), -180);
    const count = new Map();
    for (const t of St.all('transactions')) if (t.date >= since && t.type === kind && t.categoryId) count.set(t.categoryId, (count.get(t.categoryId) || 0) + 1);
    // Sin historial: orden por uso típico; Ahorro/Inversiones al final (tienen tipo propio)
    const PRIORITY = ['cat_alimentacion', 'cat_transporte', 'cat_restaurantes', 'cat_vivienda', 'cat_servicios', 'cat_compras', 'cat_entretenimiento', 'cat_salud', 'cat_suscripciones',
      'cat_salario', 'cat_freelance', 'cat_honorarios', 'cat_bonificaciones', 'cat_rendimientos', 'cat_intereses'];
    const rank = c => { const i = PRIORITY.indexOf(c.id); return i < 0 ? (c.id === 'cat_ahorro' || c.id === 'cat_inversiones' ? 999 : 100) : i; };
    return St.all('categories').filter(c => c.kind === kind && !c.archived)
      .sort((a, b) => (count.get(b.id) || 0) - (count.get(a.id) || 0) || rank(a) - rank(b) || a.name.localeCompare(b.name));
  }

  function chip(name, value, label, selected, extra) {
    return '<button type="button" class="chip' + (selected ? ' on' : '') + '" data-chip="' + name + '" data-value="' + esc(value) + '"' + (extra || '') + '>' + label + '</button>';
  }

  /**
   * Abre el formulario. opts: { type, tx (para editar), preset (valores iniciales) }
   */
  function open(opts) {
    opts = opts || {};
    const editing = !!(opts.tx && opts.tx.id && St.get('transactions', opts.tx.id));
    const st = St.settings();
    const last = st.lastUsed || {};
    const base = Object.assign({
      type: opts.type || 'expense', date: U.today(), amount: '', accountId: '', toAccountId: '', categoryId: '', subcategory: '',
      description: '', paymentMethod: '', tags: [], notes: '', nature: '', person: 'personal', recurring: false,
      investmentId: '', debtId: '', goalId: '', interestAmount: ''
    }, opts.preset || {}, opts.tx || {});
    const state = U.deepClone(base);
    state.showMore = !!(editing && (state.notes || (state.tags || []).length || state.paymentMethod || state.person !== 'personal'));
    if (!state.accountId) state.accountId = last[state.type] || last.expense || '';
    if (state.accountId && !St.get('accounts', state.accountId)) state.accountId = '';
    if (!state.accountId) { const first = accountsByUsage(state.type).find(a => a.type !== 'credit_card' || state.type === 'expense'); if (first) state.accountId = first.id; }

    const m = ui.modal({
      title: editing ? 'Editar movimiento' : 'Registrar movimiento', size: 'sheet tx-sheet', body: '<form class="txf" novalidate></form>',
      footer: (editing ? '<button type="button" class="btn ghost danger-text" data-del>' + ui.icon('trash') + 'Eliminar</button>' : '<button type="button" class="btn ghost" data-again>Guardar y registrar otro</button>') +
        '<button type="button" class="btn primary" data-save>' + (editing ? 'Guardar cambios' : 'Guardar') + '</button>',
      noAutofocus: true
    });
    const form = m.el.querySelector('form');

    function render(focusAmount) {
      const t = state.type;
      const cur = (St.get('accounts', state.accountId) || {}).currency || U.getBaseCurrency();
      const curSym = U.CURRENCIES[cur].symbol;
      let h = '';
      // Tipo
      h += '<div class="type-tabs" role="tablist">' + PRIMARY.map(k => '<button type="button" role="tab" class="type-tab t-' + S.TX_TYPES[k].color + (t === k ? ' on' : '') + '" data-type="' + k + '">' + S.TX_TYPES[k].short + '</button>').join('') +
        '<select class="type-more' + (SECONDARY.includes(t) ? ' on' : '') + '" data-type-select aria-label="Otros tipos">' + '<option value="">Más…</option>' + SECONDARY.map(k => '<option value="' + k + '"' + (t === k ? ' selected' : '') + '>' + S.TX_TYPES[k].label + '</option>').join('') + '</select></div>';
      // Valor
      h += '<label class="amount-field t-' + S.TX_TYPES[t].color + '" data-field="amount"><span class="sym">' + esc(curSym) + '</span>' +
        '<input name="amount" inputmode="decimal" autocomplete="off" placeholder="0" value="' + esc(state.amount === '' ? '' : ui.amountValue(state.amount)) + '" aria-label="Valor"></label>';

      // Categoría (ingreso / gasto)
      if (t === 'income' || t === 'expense') {
        const cats = categoriesByUsage(t);
        const top = cats.slice(0, 8);
        if (state.categoryId && !top.find(c => c.id === state.categoryId)) { const c = St.get('categories', state.categoryId); if (c) top.unshift(c); }
        h += '<div class="field" data-field="categoryId"><span class="lbl">Categoría</span><div class="chips">' +
          top.map(c => chip('categoryId', c.id, '<i class="dot" style="background:' + esc(c.color || '#888') + '"></i>' + esc(c.name), c.id === state.categoryId)).join('') +
          '<select class="chip-select" data-cat-all aria-label="Todas las categorías">' + '<option value="">Todas…</option>' + groupedCategoryOptions(t, state.categoryId) + '</select></div></div>';
        const cat = St.get('categories', state.categoryId);
        if (cat && cat.subcategories && cat.subcategories.length) {
          h += '<div class="field sub"><span class="lbl">Subcategoría <em>opcional</em></span><div class="chips small">' + cat.subcategories.map(s => chip('subcategory', s, esc(s), s === state.subcategory)).join('') + '</div></div>';
        }
      }
      // Cuentas
      const accLabel = { income: 'Cuenta que recibe', expense: 'Pagado con', transfer: 'Desde', saving: 'Desde', investment: 'Desde la cuenta', investment_withdrawal: 'Cuenta que recibe', debt_payment: 'Cuenta', loan_received: 'Cuenta que recibe', loan_given: 'Desde la cuenta' }[t];
      h += accountChips('accountId', accLabel, state.accountId, t);
      if (t === 'transfer' || t === 'saving') {
        let list = accountsByUsage('transfer', [state.toAccountId]).filter(a => a.id !== state.accountId);
        if (t === 'saving') list.sort((a, b) => (b.purposeResolved === 'savings') - (a.purposeResolved === 'savings'));
        h += accountChips('toAccountId', t === 'saving' ? 'Hacia (cuenta de ahorro)' : 'Hacia', state.toAccountId, t, list);
        if (t === 'saving') {
          const goals = St.all('goals').filter(g => !g.archived);
          if (goals.length) h += '<label class="field" data-field="goalId"><span class="lbl">Meta <em>opcional</em></span><select name="goalId">' + ui.options(goals.map(g => ({ value: g.id, label: g.name })), state.goalId, 'Sin meta') + '</select></label>';
        }
      }
      if (t === 'investment' || t === 'investment_withdrawal') {
        const invs = St.all('investments').filter(i => !i.closed || i.id === state.investmentId);
        h += '<label class="field" data-field="investmentId"><span class="lbl">Inversión</span><select name="investmentId">' + ui.options(invs.map(i => ({ value: i.id, label: i.name + ' · ' + S.INVESTMENT_TYPES[i.type] })), state.investmentId, invs.length ? 'Elige…' : 'Primero crea una inversión') + '</select>' +
          '<button type="button" class="link-btn" data-new-inv>+ Nueva inversión</button></label>';
      }
      if (t === 'debt_payment' || t === 'loan_received' || t === 'loan_given') {
        const dir = t === 'loan_received' ? 'payable' : t === 'loan_given' ? 'receivable' : null;
        const debts = St.all('debts').filter(d => (!dir || d.direction === dir) && (!d.archived || d.id === state.debtId));
        const opt = debts.map(d => ({ value: d.id, label: (d.direction === 'payable' ? 'Debo · ' : 'Me deben · ') + d.name + ' (' + U.money(L.debtBalanceAt(St, d, U.today())) + ')' }));
        if (t !== 'debt_payment') opt.push({ value: '__new', label: '+ Nuevo: ' + (t === 'loan_received' ? 'deuda / préstamo que recibo' : 'préstamo que hago') });
        h += '<label class="field" data-field="debtId"><span class="lbl">' + (t === 'debt_payment' ? 'Deuda o préstamo' : 'Asociar a') + '</span><select name="debtId">' + ui.options(opt, state.debtId, 'Elige…') + '</select></label>';
        if (state.debtId === '__new') {
          h += '<div class="grid2"><label class="field" data-field="newDebtName"><span class="lbl">Nombre</span><input name="newDebtName" value="' + esc(state.newDebtName || '') + '" placeholder="' + (t === 'loan_given' ? 'Préstamo a Ana' : 'Préstamo de mamá') + '"></label>' +
            '<label class="field"><span class="lbl">' + (t === 'loan_given' ? 'Persona' : 'Acreedor') + '</span><input name="newDebtWho" value="' + esc(state.newDebtWho || '') + '"></label></div>';
        }
        if (t === 'debt_payment') {
          const d = St.get('debts', state.debtId);
          h += '<label class="field" data-field="interestAmount"><span class="lbl">De ese pago, intereses <em>(se cuentan como ' + (d && d.direction === 'receivable' ? 'ingreso' : 'gasto') + ')</em></span>' +
            '<input name="interestAmount" inputmode="decimal" value="' + esc(state.interestAmount === '' || state.interestAmount === undefined ? '' : ui.amountValue(state.interestAmount)) + '" placeholder="0">' +
            '<span class="hint" data-principal-hint></span></label>';
        }
      }
      // Fecha rápida
      const t0 = U.today(), y0 = U.addDays(t0, -1);
      const isOther = state.date !== t0 && state.date !== y0;
      h += '<div class="field" data-field="date"><span class="lbl">Fecha</span><div class="chips">' + chip('date', t0, 'Hoy', state.date === t0) + chip('date', y0, 'Ayer', state.date === y0) +
        '<input type="date" name="date" class="date-chip' + (isOther ? ' on' : '') + '" value="' + esc(state.date) + '" max="2100-12-31" min="1900-01-01" aria-label="Otra fecha"></div><span class="hint" data-date-hint></span></div>';
      h += '<label class="field" data-field="description"><span class="lbl">Descripción <em>opcional</em></span><input name="description" maxlength="200" value="' + esc(state.description) + '" placeholder="' + esc(placeholderFor(t)) + '" autocomplete="off" list="desc-suggestions"></label>';
      h += '<datalist id="desc-suggestions">' + recentDescriptions(t).map(d => '<option value="' + esc(d) + '">').join('') + '</datalist>';

      // Más detalles
      h += '<details class="more"' + (state.showMore ? ' open' : '') + '><summary>Más detalles</summary><div class="more-body">';
      if (t === 'expense') {
        const cat = St.get('categories', state.categoryId);
        const nat = state.nature || (cat ? cat.nature : 'variable');
        h += '<div class="field"><span class="lbl">Tipo de gasto</span><div class="chips">' + chip('nature', 'fixed', 'Fijo', nat === 'fixed') + chip('nature', 'variable', 'Variable', nat !== 'fixed') + '</div></div>';
        h += '<div class="field"><span class="lbl">¿De quién es el gasto?</span><div class="chips">' + Object.entries(S.PERSONS).map(([k, v]) => chip('person', k, v, (state.person || 'personal') === k)).join('') + '</div></div>';
      }
      if (t === 'income' || t === 'expense') {
        const cat = St.get('categories', state.categoryId);
        if (cat && cat.subcategories && cat.subcategories.length === 0) {} // nada
        h += '<label class="field"><span class="lbl">Método de pago</span><select name="paymentMethod">' + ui.options(S.PAYMENT_METHODS, state.paymentMethod, '—') + '</select></label>';
      }
      h += '<label class="field" data-field="tags"><span class="lbl">Etiquetas <em>separadas por espacio, ej. #universidad #viaje</em></span><input name="tags" value="' + esc((state.tags || []).map(x => '#' + x).join(' ')) + '" autocomplete="off" list="tag-suggestions"></label>';
      h += '<datalist id="tag-suggestions">' + F.analytics.allTags(St).slice(0, 30).map(x => '<option value="#' + esc(x.tag) + '">').join('') + '</datalist>';
      h += '<label class="field" data-field="notes"><span class="lbl">Notas</span><textarea name="notes" rows="2" maxlength="2000">' + esc(state.notes) + '</textarea></label>';
      if (!editing) {
        h += '<label class="switch"><input type="checkbox" name="makeRecurring"' + (state.makeRecurring ? ' checked' : '') + '><span>Es un movimiento recurrente</span></label>';
        if (state.makeRecurring) {
          h += '<div class="grid2"><label class="field"><span class="lbl">Frecuencia</span><select name="frequency">' + ui.options(Object.fromEntries(Object.entries(S.FREQUENCIES).map(([k, v]) => [k, v.label])), state.frequency || 'monthly') + '</select></label>' +
            '<label class="switch compact"><input type="checkbox" name="autoConfirm"' + (state.autoConfirm ? ' checked' : '') + '><span>Registrar automáticamente</span></label></div>';
          if (t === 'expense') h += '<label class="switch"><input type="checkbox" name="isSubscription"' + (state.isSubscription || (St.get('categories', state.categoryId) || {}).id === 'cat_suscripciones' ? ' checked' : '') + '><span>Es una suscripción</span></label>';
        }
      } else if (state.recurringId) {
        h += '<p class="hint">' + ui.icon('repeat') + ' Generado por el recurrente «' + esc((St.get('recurring', state.recurringId) || {}).name || '—') + '».</p>';
      }
      h += '</div></details><div class="form-errors"></div>';
      form.innerHTML = h;
      bind();
      updateHints();
      if (focusAmount) { const a = form.querySelector('[name=amount]'); if (a) try { a.focus({ preventScroll: true }); } catch (_) {} }
    }

    function accountChips(name, label, selected, type, list) {
      list = list || accountsByUsage(type, [selected]);
      if (!list.length) return '<div class="field" data-field="' + name + '"><span class="lbl">' + label + '</span><p class="hint">No tienes cuentas. <button type="button" class="link-btn" data-new-acc>Crear una cuenta</button></p></div>';
      return '<div class="field" data-field="' + name + '"><span class="lbl">' + label + '</span><div class="chips acc">' +
        list.map(a => chip(name, a.id, esc(a.name) + '<small>' + esc(U.money(a.balance, { currency: a.currency, compact: Math.abs(a.balance) >= 1e7 })) + '</small>', a.id === selected)).join('') + '</div></div>';
    }

    function readInputs() {
      const fd = new FormData(form);
      const amt = form.querySelector('[name=amount]');
      if (amt) state.amount = amt.value.trim() === '' ? '' : U.parseAmount(amt.value);
      for (const k of ['description', 'notes', 'paymentMethod', 'goalId', 'investmentId', 'debtId', 'frequency', 'newDebtName', 'newDebtWho']) if (fd.has(k)) state[k] = fd.get(k);
      if (fd.has('date')) { const d = fd.get('date'); if (d) state.date = d; }
      if (fd.has('tags')) state.tags = U.parseTags(fd.get('tags'));
      const ia = form.querySelector('[name=interestAmount]');
      if (ia) state.interestAmount = ia.value.trim() === '' ? 0 : U.parseAmount(ia.value);
      const det = form.querySelector('details.more'); if (det) state.showMore = det.open;
      for (const k of ['makeRecurring', 'autoConfirm', 'isSubscription']) { const c = form.querySelector('[name=' + k + ']'); if (c) state[k] = c.checked; }
    }

    function updateHints() {
      const dh = form.querySelector('[data-date-hint]');
      if (dh) dh.textContent = state.date > U.today() ? 'Fecha futura: el saldo cambiará cuando llegue esa fecha.' : (state.date < U.today() ? U.relativeDayLabel(state.date) : '');
      const ph = form.querySelector('[data-principal-hint]');
      if (ph) {
        const d = St.get('debts', state.debtId);
        const a = U.num(state.amount), i = U.num(state.interestAmount);
        if (d && a > 0) {
          const bal = L.debtBalanceAt(St, d, U.today());
          let txt = 'Abono a capital: ' + U.money(Math.max(0, a - i)) + ' · Saldo actual: ' + U.money(bal);
          if (editing) txt = 'Abono a capital: ' + U.money(Math.max(0, a - i));
          if (!editing && a - i > bal + 0.5) txt += ' · El abono supera el saldo registrado.';
          if (!editing && d.direction === 'payable' && d.interestRate > 0 && !i) {
            const est = Math.round(bal * (Math.pow(1 + d.interestRate / 100, 1 / 12) - 1));
            txt += ' · Interés estimado del mes: ' + U.money(est);
          }
          ph.textContent = txt;
        } else ph.textContent = '';
      }
    }

    function bind() {
      const amt = form.querySelector('[name=amount]');
      ui.bindAmountInput(amt, () => (St.get('accounts', state.accountId) || {}).currency);
      ui.bindAmountInput(form.querySelector('[name=interestAmount]'));
      form.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => switchType(b.dataset.type)));
      const tsel = form.querySelector('[data-type-select]');
      tsel.addEventListener('change', () => { if (tsel.value) switchType(tsel.value); });
      form.querySelectorAll('[data-chip]').forEach(b => b.addEventListener('click', () => {
        readInputs();
        const k = b.dataset.chip, v = b.dataset.value;
        if (k === 'subcategory' && state.subcategory === v) state.subcategory = '';
        else state[k] = v;
        if (k === 'categoryId') { state.subcategory = ''; state.nature = ''; }
        if (k === 'toAccountId' && state.type === 'saving') {
          const g = St.all('goals').find(g => g.accountId === v && !g.archived);
          if (g && !state.goalId) state.goalId = g.id;
        }
        if (k === 'accountId' && state.toAccountId === v) state.toAccountId = '';
        render();
      }));
      const all = form.querySelector('[data-cat-all]');
      if (all) all.addEventListener('change', () => { readInputs(); if (all.value) { state.categoryId = all.value; state.subcategory = ''; render(); } });
      const dateInp = form.querySelector('[name=date]');
      dateInp.addEventListener('change', () => { readInputs(); render(); });
      form.querySelectorAll('[name=makeRecurring],[name=debtId],[name=investmentId]').forEach(el => el.addEventListener('change', () => { readInputs(); render(); }));
      form.querySelectorAll('[name=amount],[name=interestAmount]').forEach(el => el.addEventListener('input', () => { readInputs(); updateHints(); }));
      const ni = form.querySelector('[data-new-inv]');
      if (ni) ni.addEventListener('click', () => { readInputs(); F.forms.investment(null, inv => { state.investmentId = inv.id; render(); }); });
      const na = form.querySelector('[data-new-acc]');
      if (na) na.addEventListener('click', () => { readInputs(); F.forms.account(null, acc => { state.accountId = acc.id; render(); }); });
      form.addEventListener('submit', e => { e.preventDefault(); save(false); });
      amt.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); save(false); } });
    }

    function switchType(t) {
      readInputs();
      if (t === state.type) return;
      const prevCat = St.get('categories', state.categoryId);
      state.type = t;
      if (!prevCat || prevCat.kind !== t) { state.categoryId = ''; state.subcategory = ''; }
      if (!editing) state.accountId = last[t] || state.accountId;
      if (t !== 'transfer' && t !== 'saving') state.toAccountId = '';
      state.debtId = ''; state.investmentId = '';
      render(true);
    }

    function buildTx() {
      readInputs();
      const t = state.type;
      const tx = {
        id: editing ? opts.tx.id : undefined, date: state.date, type: t, amount: state.amount === '' ? '' : state.amount,
        accountId: state.accountId || null, toAccountId: (t === 'transfer' || t === 'saving') ? (state.toAccountId || null) : null,
        categoryId: (t === 'income' || t === 'expense') ? (state.categoryId || null) : null,
        subcategory: (t === 'income' || t === 'expense') ? (state.subcategory || '') : '',
        description: (state.description || '').trim(), paymentMethod: state.paymentMethod || '', tags: state.tags || [],
        notes: (state.notes || '').trim(), recurring: !!(state.recurring || state.makeRecurring), recurringId: state.recurringId || null,
        nature: t === 'expense' ? (state.nature || ((St.get('categories', state.categoryId) || {}).nature) || 'variable') : undefined,
        person: t === 'expense' ? (state.person || 'personal') : 'personal',
        investmentId: (t === 'investment' || t === 'investment_withdrawal' || (t === 'expense' && state.investmentId)) ? (state.investmentId || null) : null,
        debtId: (t === 'debt_payment' || t === 'loan_received' || t === 'loan_given') ? (state.debtId || null) : null,
        goalId: t === 'saving' || t === 'transfer' ? (state.goalId || null) : null,
        interestAmount: t === 'debt_payment' ? U.num(state.interestAmount) : undefined,
        isDemo: editing ? !!opts.tx.isDemo : false
      };
      if (editing) { tx.createdAt = opts.tx.createdAt; }
      return tx;
    }

    let saving = false;
    async function save(again) {
      if (saving) return;
      const tx = buildTx();
      // Préstamo nuevo creado en línea
      if (tx.debtId === '__new') {
        const nm = (state.newDebtName || '').trim();
        if (!nm) { ui.showErrors(form, { newDebtName: 'Ponle un nombre al préstamo.' }); return; }
        const pre = S.validateTransaction(Object.assign({}, tx, { debtId: 'x' }), Object.assign(St.ctx(), { debt: () => ({ direction: tx.type === 'loan_given' ? 'receivable' : 'payable' }) }));
        if (!pre.ok) { ui.showErrors(form, pre.errors); return; }
        saving = true;
        try {
          const d = await St.save('debts', { name: nm, counterparty: (state.newDebtWho || '').trim(), direction: tx.type === 'loan_given' ? 'receivable' : 'payable', kind: 'personal', principal: tx.amount, openingBalance: 0, interestRate: 0, monthlyPayment: 0, startDate: tx.date, endDate: null, dueDay: null, notes: '' });
          tx.debtId = d.id;
        } catch (e) { saving = false; ui.showErrors(form, e.errors || {}); return; }
      }
      const v = St.validate('transactions', tx);
      if (!v.ok) { saving = false; ui.showErrors(form, v.errors); return; }
      saving = true;
      try {
        let rule = null;
        if (!editing && state.makeRecurring) {
          rule = await St.save('recurring', {
            name: tx.description || ((St.get('categories', tx.categoryId) || {}).name) || S.TX_TYPES[tx.type].label,
            type: tx.type, amount: tx.amount, accountId: tx.accountId, toAccountId: tx.toAccountId, categoryId: tx.categoryId, subcategory: tx.subcategory,
            nature: tx.nature, paymentMethod: tx.paymentMethod, tags: tx.tags, person: tx.person, investmentId: tx.investmentId, debtId: tx.debtId,
            goalId: tx.goalId, interestAmount: tx.interestAmount || 0, description: tx.description, frequency: state.frequency || 'monthly',
            startDate: tx.date, anchorDay: Number(tx.date.slice(8, 10)),
            nextDate: F.recurring.step({ frequency: state.frequency || 'monthly', anchorDay: Number(tx.date.slice(8, 10)), startDate: tx.date }, tx.date),
            endDate: null, autoConfirm: !!state.autoConfirm, isSubscription: !!state.isSubscription, active: true
          });
          tx.recurringId = rule.id;
        }
        const saved = await St.save('transactions', tx);
        if (opts.onSaved) await opts.onSaved(saved);
        if (!editing) {
          const lu = Object.assign({}, St.settings().lastUsed || {}); lu[tx.type] = tx.accountId;
          St.saveSettings({ lastUsed: lu });
        }
        const label = S.TX_TYPES[saved.type].label + (editing ? ' actualizado' : ' guardado') + ' · ' + U.money(saved.amount);
        ui.toast(label, editing ? {} : { action: { label: 'Deshacer', fn: async () => { await St.remove('transactions', saved.id); if (rule) await St.remove('recurring', rule.id); ui.toast('Movimiento eliminado'); } } });
        if (again) {
          saving = false;
          Object.assign(state, { amount: '', description: '', notes: '', tags: [], subcategory: '', makeRecurring: false, interestAmount: '' });
          render(true);
        } else m.close();
      } catch (e) {
        saving = false;
        if (e.errors) ui.showErrors(form, e.errors); else ui.toast('No se pudo guardar: ' + e.message, { type: 'error' });
      }
    }

    m.el.querySelector('[data-save]').addEventListener('click', () => save(false));
    const again = m.el.querySelector('[data-again]');
    if (again) again.addEventListener('click', () => save(true));
    const del = m.el.querySelector('[data-del]');
    if (del) del.addEventListener('click', async () => {
      if (!(await ui.confirmDialog({ title: 'Eliminar movimiento', message: 'Se eliminará este movimiento y se recalcularán los saldos. ¿Continuar?', confirmText: 'Eliminar', danger: true }))) return;
      const copy = U.deepClone(opts.tx);
      await St.remove('transactions', opts.tx.id);
      m.close();
      ui.toast('Movimiento eliminado', { action: { label: 'Deshacer', fn: () => St.save('transactions', copy) } });
    });
    render(!editing);
    return m;
  }

  function groupedCategoryOptions(kind, selected) {
    const cats = St.all('categories').filter(c => c.kind === kind && (!c.archived || c.id === selected));
    const groups = U.groupBy(cats, c => c.group || 'Otros');
    let h = '';
    for (const [g, list] of groups) h += '<optgroup label="' + esc(g) + '">' + list.sort((a, b) => a.name.localeCompare(b.name)).map(c => '<option value="' + esc(c.id) + '"' + (c.id === selected ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') + '</optgroup>';
    return h;
  }
  function placeholderFor(t) {
    return { expense: 'Ej. Almuerzo', income: 'Ej. Salario octubre', transfer: 'Ej. Paso a Nu', saving: 'Ej. Ahorro del mes', investment: 'Ej. Aporte mensual', investment_withdrawal: 'Ej. Retiro parcial', debt_payment: 'Ej. Cuota 5 de 24', loan_received: 'Ej. Préstamo', loan_given: 'Ej. Préstamo a Ana' }[t] || '';
  }
  function recentDescriptions(type) {
    const seen = new Set(), out = [];
    const all = L.sortedTx(St);
    for (let i = all.length - 1; i >= 0 && out.length < 25; i--) {
      const d = all[i].description;
      if (all[i].type === type && d && !seen.has(d)) { seen.add(d); out.push(d); }
    }
    return out;
  }

  F.txForm = { open, groupedCategoryOptions };
})(typeof window !== 'undefined' ? (window.FIN = window.FIN || {}) : (globalThis.FIN = globalThis.FIN || {}));

</script>
  <script>
/* js/ui/views/common.js */
/* =========================================================================
 * ui/views/common.js — Piezas de interfaz compartidas por las vistas.
 * ========================================================================= */
(function (F) {
  'use strict';
  const U = F.utils, S = F.schema, St = F.Store, ui = F.ui;
  const esc = U.escapeHTML;

  F.views = F.views || {};

  function card(title, body, opts) {
    opts = opts || {};
    return '<section class="card ' + (opts.cls || '') + '"' + (opts.id ? ' id="' + opts.id + '"' : '') + '>' +
      (title ? '<header class="card-head"><h2>' + (opts.icon ? ui.icon(opts.icon) : '') + esc(title) + '</h2>' + (opts.action || '') + '</header>' : '') +
      (opts.sub ? '<p class="card-sub">' + opts.sub + '</p>' : '') + body + '</section>';
  }
  function kpi(label, valueHTML, sub, cls) {
    return '<div class="kpi ' + (cls || '') + '"><span class="kpi-label">' + esc(label) + '</span><span class="kpi-value">' + valueHTML + '</span>' + (sub ? '<span class="kpi-sub">' + sub + '</span>' : '') + '</div>';
  }
  function pageHead(title, sub, actions) {
    return '<div class="page-head"><div><h1>' + esc(title) + '</h1>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>' + (actions ? '<div class="page-actions">' + actions + '</div>' : '') + '</div>';
  }
  function monthPicker(key, route) {
    const cur = U.currentMonthKey();
    return '<div class="month-picker" data-route="' + esc(route) + '">' +
      '<button class="icon-btn" data-month-step="-1" aria-label="Mes anterior">' + ui.icon('left') + '</button>' +
      '<label class="mp-label"><span>' + esc(U.monthLabel(key)) + '</span><input type="month" value="' + esc(key) + '" data-month-input aria-label="Elegir mes"></label>' +
      '<button class="icon-btn" data-month-step="1" aria-label="Mes siguiente"' + (key >= cur ? ' disabled' : '') + '>' + ui.icon('chevright') + '</button></div>';
  }
  function yearPicker(year, route) {
    const cy = Number(U.today().slice(0, 4));
    return '<div class="month-picker" data-route="' + esc(route) + '">' +
      '<button class="icon-btn" data-year-step="-1" aria-label="Año anterior">' + ui.icon('left') + '</button>' +
      '<span class="mp-label"><span>' + esc(String(year)) + '</span></span>' +
      '<button class="icon-btn" data-year-step="1" aria-label="Año siguiente"' + (Number(year) >= cy ? ' disabled' : '') + '>' + ui.icon('chevright') + '</button></div>';
  }

  const TYPE_ICON = { income: 'income', expense: 'expense', transfer: 'swap', saving: 'coins', investment: 'trending', investment_withdrawal: 'trending', debt_payment: 'debt', loan_received: 'debt', loan_given: 'debt' };

  /** Signo de un movimiento visto desde el patrimonio/flujo. */
  function txSign(tx) {
    if (tx.type === 'income') return 1;
    if (tx.type === 'expense') return -1;
    if (tx.type === 'debt_payment') { const d = St.get('debts', tx.debtId); return d && d.direction === 'receivable' ? 1 : -1; }
    return 0;
  }
  function txTitle(tx) {
    if (tx.description) return tx.description;
    const c = St.get('categories', tx.categoryId);
    if (c) return tx.subcategory || c.name;
    if (tx.type === 'transfer' || tx.type === 'saving') return S.TX_TYPES[tx.type].label + ' a ' + ((St.get('accounts', tx.toAccountId) || {}).name || '—');
    if (tx.investmentId) return ((St.get('investments', tx.investmentId) || {}).name) || S.TX_TYPES[tx.type].label;
    if (tx.debtId) return ((St.get('debts', tx.debtId) || {}).name) || S.TX_TYPES[tx.type].label;
    return S.TX_TYPES[tx.type].label;
  }
  function txMeta(tx, opts) {
    const parts = [];
    const c = St.get('categories', tx.categoryId);
    const acc = St.get('accounts', tx.accountId), to = St.get('accounts', tx.toAccountId);
    if (tx.type === 'transfer' || tx.type === 'saving') parts.push((acc ? acc.name : '—') + ' → ' + (to ? to.name : '—'));
    else {
      if (c) parts.push(c.name + (tx.subcategory && tx.description ? ' · ' + tx.subcategory : ''));
      else parts.push(S.TX_TYPES[tx.type].label);
      if (acc) parts.push(acc.name);
    }
    if (opts && opts.date) parts.push(U.dateLabel(tx.date, { year: tx.date.slice(0, 4) !== U.today().slice(0, 4) }));
    return parts.join(' · ');
  }
  function txRow(tx, opts) {
    const t = S.TX_TYPES[tx.type];
    const sign = txSign(tx);
    const acc = St.get('accounts', tx.accountId);
    const cur = acc ? acc.currency : undefined;
    const c = St.get('categories', tx.categoryId);
    const color = c && (tx.type === 'expense' || tx.type === 'income') ? c.color : null;
    const amount = sign === 0 ? '<span class="amt neutral">' + esc(U.money(tx.amount, { currency: cur })) + '</span>' : ui.amt(sign * tx.amount, { sign: true, colored: true, currency: cur });
    const tags = (tx.tags || []).length ? '<span class="tags">' + tx.tags.map(x => '#' + esc(x)).join(' ') + '</span>' : '';
