    el.innerHTML = '<div class="page">' + vh.pageHead('Deudas y préstamos', 'Los saldos bajan solos con cada «Pago de deuda». Los intereses del pago se cuentan como gasto; el abono a capital no.', '<button class="btn primary" data-new-debt="payable">' + ui.icon('plus') + 'Deuda</button><button class="btn" data-new-debt="receivable">' + ui.icon('plus') + 'Me deben</button>') +
      '<div class="kpis four">' + vh.kpi('Dinero que debo', ui.amt(U.sum(owe, s => s.balance)), owe.length + ' deuda(s)') + vh.kpi('Tarjetas de crédito', ui.amt(nw.cardDebt), 'saldo usado en cuentas tipo tarjeta') +
      vh.kpi('Intereses estimados por pagar', ui.amt(totalInterest), 'según tasa y cuota registradas') + vh.kpi('Dinero que me deben', ui.amt(U.sum(owed, s => s.balance)), owed.length + ' préstamo(s)') + '</div>' +
      '<section class="debt-sec"><h2>Dinero que debo</h2>' + (owe.length ? '<div class="acc-grid">' + owe.map(card).join('') + '</div>' : '<p class="muted">No tienes deudas registradas.</p>') + '</section>' +
      '<section class="debt-sec"><h2>Dinero que me deben</h2>' + (owed.length ? '<div class="acc-grid">' + owed.map(card).join('') + '</div>' : '<p class="muted">Usa el movimiento «Préstamo entregado» cuando le prestes dinero a alguien.</p>') + '</section>' +
      (archived.length ? '<details class="archived"><summary>Archivadas (' + archived.length + ')</summary><div class="acc-grid">' + archived.map(card).join('') + '</div></details>' : '') + '</div>';
    el.querySelectorAll('[data-new-debt]').forEach(b => b.addEventListener('click', () => F.forms.debt(null, b.dataset.newDebt)));
    el.querySelectorAll('[data-debt-edit]').forEach(b => b.addEventListener('click', () => F.forms.debt(St.get('debts', b.dataset.debtEdit))));
    el.querySelectorAll('[data-debt-pay]').forEach(b => b.addEventListener('click', () => {
      const d = St.get('debts', b.dataset.debtPay);
      const bal = L.debtBalanceAt(St, d, U.today());
      const est = d.direction === 'payable' && d.interestRate ? Math.round(bal * (Math.pow(1 + d.interestRate / 100, 1 / 12) - 1)) : 0;

      F.txForm.open({ type: d.direction === 'payable' ? 'loan_received' : 'loan_given', preset: { debtId: d.id } });
    }));
  }

  Object.assign(F.views, {
    cuentas: { title: 'Mis cuentas', render: cuentas },
    patrimonio: { title: 'Patrimonio', render: patrimonio },
    inversiones: { title: 'Inversiones', render: inversiones },
    deudas: { title: 'Deudas', render: deudas }
  });
})(typeof window !== 'undefined' ? (window.FIN = window.FIN || {}) : (globalThis.FIN = globalThis.FIN || {}));

  <script>
/* js/ui/views/plan.js */
/* =========================================================================
 * ui/views/plan.js — Presupuestos, Metas, Recurrentes/Suscripciones y Calendario.
 * ========================================================================= */
(function (F) {
  'use strict';
  const U = F.utils, S = F.schema, L = F.ledger, A = F.analytics, R = F.recurring, St = F.Store, ui = F.ui, vh = F.vh;
  const esc = U.escapeHTML;
  const validMonth = m => /^\d{4}-\d{2}$/.test(m || '') && U.isValidDate(m + '-01') ? m : U.currentMonthKey();

  // ================================ PRESUPUESTOS ================================
  function presupuestos(el, p) {
    const key = validMonth(p.m);
    const s = A.monthSummary(St, key);
    const isCur = key === U.currentMonthKey();
    const days = A.elapsedDays(key), dim = U.daysInMonth(key);
    const budgets = St.all('budgets').map(b => {
      const c = St.get('categories', b.categoryId);
      const spent = U.round2(s.expenseByCategory.get(b.categoryId) || 0);
      const pct = b.amount > 0 ? spent / b.amount * 100 : 0;
      const pace = isCur && days > 0 ? spent / days * dim : null;
      return { b, c, spent, pct, available: U.round2(b.amount - spent), pace };
    }).sort((a, b) => b.pct - a.pct);
    const totalB = U.sum(budgets, x => x.b.amount), totalS = U.sum(budgets, x => x.spent);
    const state = pct => pct > 100 ? 'over' : pct >= 90 ? 'danger' : pct >= 75 ? 'warn' : '';
    const label = pct => pct > 100 ? 'Superado' : pct >= 90 ? 'Casi al límite' : pct >= 75 ? 'Cerca del límite' : 'Dentro del límite';
    const card = x => '<article class="bud-card ' + state(x.pct) + '"><header><h3><i class="dot" style="background:' + esc(x.c ? x.c.color : '#888') + '"></i>' + esc(x.c ? x.c.name : 'Categoría eliminada') + '</h3><span class="badge ' + state(x.pct) + '">' + label(x.pct) + '</span></header>' +
      ui.progress(x.pct, state(x.pct)) +
      '<dl class="bud-nums"><div><dt>Presupuesto</dt><dd>' + ui.amt(x.b.amount) + '</dd></div><div><dt>Gastado</dt><dd>' + ui.amt(x.spent) + '</dd></div><div><dt>' + (x.available >= 0 ? 'Disponible' : 'Excedido') + '</dt><dd>' + ui.amt(Math.abs(x.available)) + '</dd></div><div><dt>Utilizado</dt><dd>' + U.pct(x.pct, 2) + '</dd></div></dl>' +
      (x.pace !== null && x.spent > 0 ? '<p class="muted small">Al ritmo actual el mes cerraría en ' + esc(U.money(x.pace)) + ' (' + U.pct(x.b.amount ? x.pace / x.b.amount * 100 : null, 0) + ' del presupuesto).</p>' : '') +
      '<div class="acc-actions"><a class="btn small ghost" href="#/movimientos?period=month&month=' + key + '&categoryId=' + esc(x.b.categoryId) + '">Ver gastos</a><button class="btn small ghost" data-edit-bud="' + esc(x.b.id) + '">' + ui.icon('edit') + 'Editar</button></div></article>';
    const withB = new Set(budgets.map(x => x.b.categoryId));
    const unb = A.categoryList(St, s.expenseByCategory, s.expense).filter(c => !withB.has(c.id));
    el.innerHTML = '<div class="page">' + vh.pageHead('Presupuestos', 'Límites mensuales por categoría. Los indicadores cambian de color al 75%, 90% y 100%.', vh.monthPicker(key, 'presupuestos') + '<button class="btn primary" data-new-bud>' + ui.icon('plus') + 'Presupuesto</button>') +
      (budgets.length ? '<div class="kpis four">' + vh.kpi('Presupuestado', ui.amt(totalB)) + vh.kpi('Gastado', ui.amt(totalS), U.pct(totalB ? totalS / totalB * 100 : null, 1) + ' utilizado') + vh.kpi('Disponible', ui.amt(totalB - totalS, { colored: true })) + vh.kpi('Días restantes', isCur ? String(dim - days) : '—', isCur ? 'de ' + dim : 'mes cerrado') + '</div>' +
        '<div class="acc-grid">' + budgets.map(card).join('') + '</div>' +
        (unb.length ? vh.card('Gastos sin presupuesto este mes', '<ul class="rank">' + unb.map(c => '<li><span>' + esc(c.name) + '</span>' + ui.amt(c.amount) + '</li>').join('') + '</ul>') : '')
        : ui.emptyState('target', 'Sin presupuestos', 'Define un límite mensual para las categorías que quieras vigilar, por ejemplo Alimentación $400.000.', '<button class="btn primary" data-new-bud>Crear presupuesto</button>')) + '</div>';
    el.querySelectorAll('[data-new-bud]').forEach(b => b.addEventListener('click', () => F.forms.budget(null)));
    el.querySelectorAll('[data-edit-bud]').forEach(b => b.addEventListener('click', () => F.forms.budget(St.get('budgets', b.dataset.editBud))));
  }

  // ================================ METAS ================================
  function timeLeft(months) {
    if (months === null) return '—';
    if (months < 0) return 'Fecha vencida';
    if (months < 1) return Math.max(0, Math.round(months * 30.4)) + ' días';
    const y = Math.floor(months / 12), m = Math.round(months % 12);
    return (y ? y + ' año' + (y > 1 ? 's' : '') + (m ? ' y ' : '') : '') + (m ? m + ' mes' + (m > 1 ? 'es' : '') : '');
  }
  function metas(el) {
    const goals = St.all('goals');
    const card = g => {
      const p = L.goalProgress(St, g);
      const acc = St.get('accounts', g.accountId);
      return '<article class="goal-card' + (p.completed ? ' done' : '') + '"><header><div><h3>' + esc(g.name) + '</h3><span class="muted small">' + esc(S.GOAL_KINDS[g.kind]) + (acc ? ' · saldo de ' + esc(acc.name) : ' · valor manual') + '</span></div><div class="goal-pct">' + U.pct(p.pct, 1) + '</div></header>' +
        ui.progress(p.pct, p.completed ? 'done' : '') +
        '<div class="goal-amounts">' + ui.amt(p.current) + '<span class="muted"> de ' + esc(U.money(p.target)) + '</span></div>' +
        '<dl class="acc-meta"><div><dt>Dinero restante</dt><dd>' + esc(U.money(p.remaining)) + '</dd></div><div><dt>Tiempo restante</dt><dd>' + esc(g.targetDate ? timeLeft(p.monthsLeft) : 'Sin fecha') + '</dd></div>' +
        '<div><dt>Aporte mensual necesario</dt><dd>' + (p.requiredMonthly === null ? (g.targetDate ? 'Fecha vencida' : '—') : esc(U.money(p.requiredMonthly))) + '</dd></div><div><dt>Aporte mensual deseado</dt><dd>' + (g.monthlyContribution ? esc(U.money(g.monthlyContribution)) : '—') + '</dd></div></dl>' +
        (p.monthsAtDesired && !p.completed ? '<p class="small">Con ' + esc(U.money(g.monthlyContribution)) + ' al mes completarías la meta en ' + timeLeft(p.monthsAtDesired) + ' (≈ ' + esc(U.monthLabel(U.monthKey(p.projectedDate)).toLowerCase()) + ')' + (g.targetDate && p.projectedDate > g.targetDate ? ', después de la fecha objetivo' : '') + '.</p>' : '') +
        (p.contributedThisMonth ? '<p class="muted small">Aportado este mes: ' + esc(U.money(p.contributedThisMonth)) + '</p>' : '') +
        '<div class="acc-actions">' + (!p.completed ? '<button class="btn small primary" data-goal-add="' + esc(g.id) + '">Aportar</button>' : '') + '<button class="btn small ghost" data-goal-edit="' + esc(g.id) + '">' + ui.icon('edit') + 'Editar</button></div></article>';
    };
    const active = goals.filter(g => !g.archived);
    const totals = active.map(g => L.goalProgress(St, g));
    el.innerHTML = '<div class="page">' + vh.pageHead('Metas financieras', 'El avance se toma del saldo de la cuenta vinculada o de los aportes registrados.', '<button class="btn primary" data-new-goal>' + ui.icon('plus') + 'Nueva meta</button>') +
      (active.length ? '<div class="kpis three">' + vh.kpi('Total objetivo', ui.amt(U.sum(totals, t => t.target))) + vh.kpi('Acumulado', ui.amt(U.sum(totals, t => t.current))) + vh.kpi('Aportes mensuales deseados', ui.amt(U.sum(active, g => g.monthlyContribution || 0))) + '</div>' +
        '<div class="acc-grid">' + active.map(card).join('') + '</div>' : ui.emptyState('target', 'Sin metas todavía', 'Fondo de emergencia, computador, viaje, vivienda… Define cuánto y para cuándo.', '<button class="btn primary" data-new-goal>Crear meta</button>')) +
      (goals.length > active.length ? '<details class="archived"><summary>Archivadas</summary><div class="acc-grid">' + goals.filter(g => g.archived).map(card).join('') + '</div></details>' : '') + '</div>';
    el.querySelectorAll('[data-new-goal]').forEach(b => b.addEventListener('click', () => F.forms.goal(null)));
    el.querySelectorAll('[data-goal-edit]').forEach(b => b.addEventListener('click', () => F.forms.goal(St.get('goals', b.dataset.goalEdit))));
    el.querySelectorAll('[data-goal-add]').forEach(b => b.addEventListener('click', () => {
      const g = St.get('goals', b.dataset.goalAdd);
      F.txForm.open({ type: 'saving', preset: { goalId: g.id, toAccountId: g.accountId || '', amount: g.monthlyContribution || '', description: 'Aporte ' + g.name } });
    }));
  }

  // ================================ RECURRENTES / SUSCRIPCIONES ================================
  function recurrentes(el) {
    const rules = St.all('recurring');
    const subs = R.subscriptionsSummary(St);
    const pend = R.pending(St);
    const row = r => {
      const cat = St.get('categories', r.categoryId);
      const acc = St.get('accounts', r.accountId);
      const sign = r.type === 'income' ? 1 : r.type === 'expense' ? -1 : 0;
      return '<li class="rec-row' + (r.active ? '' : ' inactive') + '"><div class="rec-main"><strong>' + esc(r.name) + '</strong><span class="muted small">' + esc(S.FREQUENCIES[r.frequency].label) + ' · ' + esc(S.TX_TYPES[r.type].label) + (cat ? ' · ' + esc(cat.name) : '') + (acc ? ' · ' + esc(acc.name) : '') + (r.autoConfirm ? ' · automático' : '') + '</span></div>' +
        '<div class="rec-next"><span class="muted small">' + (r.active ? 'Próximo' : 'Pausado') + '</span><span>' + esc(r.active ? U.dateLabel(r.nextDate) : '—') + '</span></div>' +
        '<div class="rec-amt">' + (sign ? ui.amt(sign * r.amount, { sign: true, colored: sign > 0 }) : ui.amt(r.amount)) + (r.frequency !== 'monthly' ? '<span class="muted small">≈ ' + esc(U.money(R.monthlyEquivalent(r))) + '/mes</span>' : '') + '</div>' +
        '<button class="icon-btn" data-edit-rule="' + esc(r.id) + '" aria-label="Editar">' + ui.icon('edit') + '</button></li>';
    };
    const others = rules.filter(r => !(r.isSubscription && r.type === 'expense'));
    const subRules = rules.filter(r => r.isSubscription && r.type === 'expense');
    el.innerHTML = '<div class="page">' + vh.pageHead('Recurrentes y suscripciones', 'Pagos e ingresos que se repiten. Sin servidor, la app los revisa cada vez que la abres.', '<button class="btn primary" data-new-sub>' + ui.icon('plus') + 'Suscripción</button><button class="btn" data-new-rule>' + ui.icon('plus') + 'Recurrente</button>') +
      (pend.length ? vh.card('Pendientes por confirmar (' + pend.length + ')', '<ul class="rec-list">' + pend.map(p => '<li class="rec-row"><div class="rec-main"><strong>' + esc(p.rule.name) + '</strong><span class="muted small">' + esc(U.relativeDayLabel(p.date)) + '</span></div><div class="rec-amt">' + ui.amt(p.rule.amount) + '</div><div class="pending-actions"><button class="btn small primary" data-confirm-rec="' + esc(p.rule.id) + '">Registrar</button><button class="btn small ghost" data-edit-rec-tx="' + esc(p.rule.id) + '">Editar</button><button class="btn small ghost" data-skip-rec="' + esc(p.rule.id) + '">Omitir</button></div></li>').join('') + '</ul>', { cls: 'pending-card' }) : '') +
      '<section class="subs-hero"><p>Actualmente gastas <b>' + ui.amt(subs.monthly) + '</b> al mes en suscripciones.</p><p>Tu costo anual estimado en suscripciones es <b>' + ui.amt(subs.annual) + '</b>.</p><span class="muted small">' + subs.count + ' suscripción(es) activa(s). Las no mensuales se convierten a su equivalente mensual.</span></section>' +
      vh.card('Suscripciones', subRules.length ? '<ul class="rec-list">' + subRules.map(row).join('') + '</ul>' : '<p class="muted">Netflix, Spotify, gimnasio, software… Regístralas para ver cuánto suman.</p>') +
      vh.card('Otros recurrentes', others.length ? '<ul class="rec-list">' + others.map(row).join('') + '</ul>' : '<p class="muted">Arriendo, internet, salario, ahorro automático, cuotas de crédito…</p>') + '</div>';
    el.querySelector('[data-new-sub]').addEventListener('click', () => F.forms.recurring(null, null, { isSubscription: true, categoryId: 'cat_suscripciones', nature: 'fixed' }));
    el.querySelector('[data-new-rule]').addEventListener('click', () => F.forms.recurring(null));
    el.querySelectorAll('[data-edit-rule]').forEach(b => b.addEventListener('click', () => F.forms.recurring(St.get('recurring', b.dataset.editRule))));
  }

  // ================================ CALENDARIO ================================
  let calSelected = null;
  function calendario(el, p) {
    const key = validMonth(p.m);
    const from = U.monthStart(key), to = U.monthEnd(key);
    const txs = A.filterTransactions(St, { from, to });
    const sched = R.scheduledBetween(St, from, to);
    const byDay = new Map();
    const push = (d, item) => { if (!byDay.has(d)) byDay.set(d, []); byDay.get(d).push(item); };
    for (const t of txs) push(t.date, { kind: 'tx', tx: t });
    for (const o of sched) push(o.date, { kind: 'sched', rule: o.rule, date: o.date });
    for (const d of St.all('debts')) {
      if (!d.dueDay || d.archived || L.debtBalanceAt(St, d, to) <= 0) continue;
      const day = key + '-' + U.pad(Math.min(d.dueDay, U.daysInMonth(key)));
      push(day, { kind: 'due', debt: d, date: day });
    }
    for (const g of St.all('goals')) if (g.targetDate && U.monthKey(g.targetDate) === key && !g.archived) push(g.targetDate, { kind: 'goal', goal: g });
    let inc = 0, exp = 0, schedOut = 0, schedIn = 0;
    for (const t of txs) for (const it of L.flowItems(t, St)) { if (it.kind === 'income') inc += it.amount; else exp += it.amount; }
    for (const o of sched) { if (o.rule.type === 'income') schedIn += o.rule.amount; else if (o.rule.type !== 'transfer') schedOut += o.rule.amount; }

    const firstWd = (U.parseISO(from).getDay() + 6) % 7;
    let grid = '<div class="cal-grid">' + U.WEEKDAYS_SHORT.map(d => '<div class="cal-wd">' + d + '</div>').join('');
    for (let i = 0; i < firstWd; i++) grid += '<div class="cal-cell empty"></div>';
    const dim = U.daysInMonth(key);
    if (!calSelected || U.monthKey(calSelected) !== key) calSelected = key === U.currentMonthKey() ? U.today() : from;
    for (let d = 1; d <= dim; d++) {
      const iso = key + '-' + U.pad(d);
      const items = byDay.get(iso) || [];
      let net = 0;
      for (const it of items) if (it.kind === 'tx') for (const f of L.flowItems(it.tx, St)) net += f.kind === 'income' ? f.amount : -f.amount;
      const kinds = new Set(items.map(it => it.kind === 'tx' ? (it.tx.type === 'income' ? 'in' : it.tx.type === 'expense' ? 'out' : 'move') : it.kind));
      grid += '<button class="cal-cell' + (iso === U.today() ? ' today' : '') + (iso === calSelected ? ' sel' : '') + (items.length ? ' has' : '') + '" data-day="' + iso + '"><span class="cal-d">' + d + '</span>' +
        (net ? '<span class="cal-net ' + (net > 0 ? 'pos' : 'neg') + '">' + esc(U.money(Math.abs(net), { compact: true })) + '</span>' : '') +
        '<span class="cal-dots">' + [...kinds].map(k => '<i class="k-' + k + '"></i>').join('') + '</span></button>';
    }
    grid += '</div>';
    const dayPanel = () => {
      const items = byDay.get(calSelected) || [];
      if (!items.length) return '<p class="muted">Sin movimientos ni pagos programados el ' + esc(U.dateLabel(calSelected)) + '.</p>';
      return '<ul class="cal-items">' + items.map(it => {
        if (it.kind === 'tx') return '<li>' + vh.txRow(it.tx) + '</li>';
        if (it.kind === 'sched') return '<li class="cal-sched"><span class="badge">' + (it.date <= U.today() ? 'Pendiente' : 'Programado') + '</span><span>' + esc(it.rule.name) + ' · ' + esc(S.TX_TYPES[it.rule.type].label) + '</span>' + ui.amt(it.rule.amount) + (it.date <= U.today() && it.date === it.rule.nextDate ? '<button class="btn small" data-confirm-rec="' + esc(it.rule.id) + '">Registrar</button>' : '') + '</li>';
        if (it.kind === 'due') return '<li class="cal-sched"><span class="badge warn">Vence cuota</span><span>' + esc(it.debt.name) + '</span>' + ui.amt(it.debt.monthlyPayment || 0) + '</li>';
        return '<li class="cal-sched"><span class="badge">Meta</span><span>Fecha objetivo: ' + esc(it.goal.name) + '</span></li>';
      }).join('') + '</ul>';
    };
    el.innerHTML = '<div class="page">' + vh.pageHead('Calendario financiero', 'Cómo se distribuye tu dinero durante el mes.', vh.monthPicker(key, 'calendario')) +
      '<div class="kpis four">' + vh.kpi('Ingresos registrados', ui.amt(inc)) + vh.kpi('Gastos registrados', ui.amt(exp)) + vh.kpi('Ingresos programados', ui.amt(schedIn), 'recurrentes aún no registrados') + vh.kpi('Salidas programadas', ui.amt(schedOut), 'gastos, ahorros, cuotas…') + '</div>' +
      '<div class="cal-layout"><div class="card cal-card">' + grid + '<div class="cal-legend"><span><i class="k-in"></i>Ingreso</span><span><i class="k-out"></i>Gasto</span><span><i class="k-move"></i>Otro movimiento</span><span><i class="k-sched"></i>Programado</span><span><i class="k-due"></i>Vencimiento</span></div></div>' +
      '<div class="card cal-day"><h2 data-day-title>' + esc(U.relativeDayLabel(calSelected)) + '</h2><div data-day-panel>' + dayPanel() + '</div></div></div></div>';
    el.querySelectorAll('[data-day]').forEach(b => b.addEventListener('click', () => {
      calSelected = b.dataset.day;
      el.querySelectorAll('.cal-cell.sel').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      el.querySelector('[data-day-title]').textContent = U.relativeDayLabel(calSelected);
      el.querySelector('[data-day-panel]').innerHTML = dayPanel();
      if (window.innerWidth < 900) el.querySelector('.cal-day').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }));
  }

  Object.assign(F.views, {
    presupuestos: { title: 'Presupuestos', render: presupuestos },
    metas: { title: 'Metas', render: metas },
    recurrentes: { title: 'Recurrentes', render: recurrentes },
    calendario: { title: 'Calendario', render: calendario }
  });
})(typeof window !== 'undefined' ? (window.FIN = window.FIN || {}) : (globalThis.FIN = globalThis.FIN || {}));

</script>
  <script>
/* js/ui/views/settings.js */
/* =========================================================================
 * ui/views/settings.js — Categorías, Datos y ajustes (respaldo, importación,
 * exportación, demo, moneda, privacidad) y menú "Más".
 * ========================================================================= */
(function (F) {
  'use strict';
  const U = F.utils, S = F.schema, L = F.ledger, St = F.Store, ui = F.ui, vh = F.vh, IO = F.io;
  const esc = U.escapeHTML;

  // ================================ CATEGORÍAS ================================
  let catKind = 'expense';
  function categorias(el) {
    const cats = St.all('categories').filter(c => c.kind === catKind);
    const since = U.addDays(U.today(), -365);
    const usage = new Map(), amount = new Map();
    for (const t of St.all('transactions')) if (t.categoryId) { usage.set(t.categoryId, (usage.get(t.categoryId) || 0) + 1); if (t.date >= since) amount.set(t.categoryId, (amount.get(t.categoryId) || 0) + t.amount); }
    const groups = catKind === 'income' ? ['Ingresos'] : S.EXPENSE_GROUPS;
    let h = '';
    for (const g of groups) {
      const list = cats.filter(c => (c.group || 'Otros') === g).sort((a, b) => a.name.localeCompare(b.name));
      if (!list.length) continue;
      h += '<section class="cat-group"><h2>' + esc(g) + '</h2><ul class="cat-list">' + list.map(c => '<li><button class="cat-row" data-edit-cat="' + esc(c.id) + '"><i class="dot" style="background:' + esc(c.color) + '"></i><span class="cat-name">' + esc(c.name) +
        '<small class="muted">' + (c.subcategories.length ? esc(c.subcategories.join(', ')) : 'Sin subcategorías') + '</small></span>' + (c.kind === 'expense' ? '<span class="badge">' + esc(S.NATURES[c.nature || 'variable']) + '</span>' : '') +
        '<span class="cat-use"><b>' + (usage.get(c.id) || 0) + '</b> mov.' + (amount.get(c.id) ? '<small>' + esc(U.money(amount.get(c.id), { compact: true })) + ' / 12 m</small>' : '') + '</span></button></li>').join('') + '</ul></section>';
    }
    el.innerHTML = '<div class="page">' + vh.pageHead('Categorías', 'Edita nombres, subcategorías y si un gasto suele ser fijo o variable.', '<button class="btn primary" data-new-cat>' + ui.icon('plus') + 'Nueva categoría</button>') +
      '<nav class="subtabs"><a href="#" data-kind="expense"' + (catKind === 'expense' ? ' class="on"' : '') + '>Gastos</a><a href="#" data-kind="income"' + (catKind === 'income' ? ' class="on"' : '') + '>Ingresos</a></nav>' + h + '</div>';
    el.querySelectorAll('[data-kind]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); catKind = a.dataset.kind; categorias(el); }));
    el.querySelector('[data-new-cat]').addEventListener('click', () => F.forms.category(null, catKind));
    el.querySelectorAll('[data-edit-cat]').forEach(b => b.addEventListener('click', () => F.forms.category(St.get('categories', b.dataset.editCat))));
  }

  // ================================ RESPALDO / IMPORTACIÓN ================================
  function exportBackup() {
    const b = IO.buildBackup(St);
    ui.download(IO.backupFileName(), JSON.stringify(b, null, 1), 'application/json');
    St.saveSettings({ lastBackupAt: new Date().toISOString() });
    ui.toast('Respaldo exportado: ' + IO.backupFileName());
  }

  async function importBackup() {
    const file = await ui.pickFile('.json,application/json');
    if (!file) return;
    let text;
    try { text = await ui.readText(file); } catch (e) { ui.toast(e.message, { type: 'error' }); return; }
    const parsed = IO.parseJSONText(text);
    const v = parsed.ok ? IO.validateBackup(parsed.value) : { ok: false, fatal: [parsed.error], invalid: [] };
    const names = { accounts: 'Cuentas', categories: 'Categorías', transactions: 'Movimientos', recurring: 'Recurrentes', budgets: 'Presupuestos', goals: 'Metas', investments: 'Inversiones', debts: 'Deudas', assets: 'Otros activos', settings: 'Configuración' };
    let body = '<p class="muted small">Archivo: ' + esc(file.name) + ' · ' + U.plainNumber(file.size / 1024, 1) + ' KB</p>';
    if (!v.ok) {
      body += '<div class="alert error">' + ui.icon('alert') + '<div><strong>No se puede importar este archivo.</strong><ul>' + v.fatal.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul><p>Tus datos actuales no se modificaron.</p></div></div>';
      ui.modal({ title: 'Importar respaldo', size: 'small', body, footer: '<button class="btn primary" data-close>Entendido</button>' });
      return;
    }
    body += '<p>Respaldo del <b>' + esc(v.meta.exportedAt ? U.dateLabel(v.meta.exportedAt.slice(0, 10)) : 'fecha desconocida') + '</b>' + (v.meta.currency ? ' · moneda ' + esc(v.meta.currency) : '') + '.</p>' +
      '<div class="table-wrap"><table class="tbl compact"><thead><tr><th></th><th>En el archivo</th><th>Actualmente</th></tr></thead><tbody>' +
      Object.keys(names).filter(k => k !== 'settings').map(k => '<tr><th>' + names[k] + '</th><td>' + U.plainNumber(v.counts[k]) + '</td><td>' + U.plainNumber(St.all(k).length) + '</td></tr>').join('') + '</tbody></table></div>';
    if (v.invalid.length) body += '<div class="alert warn">' + ui.icon('alert') + '<div><strong>' + v.invalid.length + ' registro(s) inválido(s) se omitirán.</strong><ul>' + v.invalid.slice(0, 8).map(i => '<li>' + esc(names[i.store] || i.store) + ' ' + esc(i.id) + ': ' + esc(i.reason) + '</li>').join('') + '</ul></div></div>' +
      '<label class="switch"><input type="checkbox" data-ack><span>Entiendo que esos registros no se importarán</span></label>';
    body += '<div class="import-options"><div><h3>Combinar</h3><p>Agrega los registros del archivo que no existan aquí (mismo id). No borra ni modifica nada de lo que ya tienes.</p><button class="btn" data-merge>Combinar con mis datos</button></div>' +
      '<div><h3>Reemplazar</h3><p>Borra los datos actuales y deja exactamente los del archivo. Antes se descargará un respaldo de lo que tienes ahora.</p><button class="btn danger" data-replace>Reemplazar todo</button></div></div>';
    const m = ui.modal({ title: 'Importar respaldo', body, size: 'wide' });
    const ackOk = () => { const a = m.el.querySelector('[data-ack]'); if (a && !a.checked) { ui.toast('Confirma que entiendes que se omitirán registros inválidos.', { type: 'error' }); return false; } return true; };
    m.el.querySelector('[data-merge]').addEventListener('click', async () => {
      if (!ackOk()) return;
      const counts = await St.merge(v.data);
      const total = Object.values(counts).reduce((a, b) => a + b, 0);
      m.close();
      ui.toast(total ? 'Se agregaron ' + U.plainNumber(total) + ' registro(s).' : 'No había registros nuevos: todo ya existía.');
    });
    m.el.querySelector('[data-replace]').addEventListener('click', async () => {
      if (!ackOk()) return;
      const ok = await ui.confirmDialog({ title: 'Reemplazar todos los datos', html: '<p>Se eliminarán tus ' + U.plainNumber(St.all('transactions').length) + ' movimientos y demás datos actuales, y se cargarán los del archivo.</p><p>Primero se descargará un respaldo automático de tus datos actuales.</p>', confirmText: 'Reemplazar', danger: true, typeToConfirm: 'REEMPLAZAR' });
      if (!ok) return;
      if (!St.isEmpty()) ui.download('financial-backup-antes-de-importar-' + U.today() + '.json', JSON.stringify(IO.buildBackup(St), null, 1), 'application/json');
      const data = Object.assign({}, v.data);
      const keepSettings = St.settings();
      const incomingSettings = (data.settings || []).find(s => s.id === 'main');
      data.settings = [Object.assign({}, keepSettings, incomingSettings || {}, { id: 'main', privacyNoticeSeen: true })];
      try { await St.replaceAll(data); m.close(); ui.toast('Datos reemplazados correctamente.'); }
      catch (e) { ui.toast('No se pudo importar: ' + e.message + '. Tus datos no cambiaron.', { type: 'error', timeout: 8000 }); }
    });
  }

  async function importCSV() {
    const file = await ui.pickFile('.csv,text/csv,.txt');
    if (!file) return;
    let text;
    try { text = await ui.readText(file); } catch (e) { ui.toast(e.message, { type: 'error' }); return; }
    let createMissing = false, skipDup = true;
    const m = ui.modal({ title: 'Importar movimientos (CSV)', size: 'wide', body: '<div data-csv></div>', footer: '<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" data-go disabled>Importar</button>' });
    const go = m.el.querySelector('[data-go]');
    let prep;
    const draw = () => {
      prep = IO.prepareCSVImport(St, text, { createMissing });
      const host = m.el.querySelector('[data-csv]');
      if (!prep.ok) { host.innerHTML = '<div class="alert error">' + ui.icon('alert') + '<div>' + esc(prep.error) + '</div></div><button class="btn small ghost" data-tpl>Descargar plantilla CSV</button>'; go.disabled = true; host.querySelector('[data-tpl]').addEventListener('click', () => ui.download('plantilla-movimientos.csv', IO.csvTemplate(), 'text/csv')); return; }
      const toImport = prep.rows.filter(r => r.ok && !(skipDup && r.duplicate));
      host.innerHTML = '<p>' + U.plainNumber(prep.rows.length) + ' filas leídas (separador «' + (prep.delim === '\t' ? 'tab' : prep.delim) + '»): <b>' + prep.valid + ' válidas</b>, ' + prep.invalid + ' con errores' + (prep.duplicates ? ', ' + prep.duplicates + ' posibles duplicados' : '') + '.</p>' +
        '<label class="switch"><input type="checkbox" data-cm' + (createMissing ? ' checked' : '') + '><span>Crear las cuentas y categorías que no existan</span></label>' +
        (prep.toCreate.accounts.length || prep.toCreate.categories.length ? '<p class="muted small">Se crearán: ' + esc(prep.toCreate.accounts.map(a => 'cuenta «' + a.name + '»').concat(prep.toCreate.categories.map(c => 'categoría «' + c.name + '»')).join(', ')) + '.</p>' : '') +
        '<label class="switch"><input type="checkbox" data-dup' + (skipDup ? ' checked' : '') + '><span>Omitir posibles duplicados (misma fecha, valor, cuenta y descripción)</span></label>' +
        (prep.invalid ? '<details open><summary>Filas con errores (' + prep.invalid + ')</summary><ul class="csv-errors">' + prep.rows.filter(r => !r.ok).slice(0, 30).map(r => '<li>Línea ' + r.line + ': ' + esc(Object.values(r.errors).join(' ')) + '</li>').join('') + '</ul></details>' : '') +
        '<details><summary>Vista previa</summary><div class="table-wrap"><table class="tbl compact"><thead><tr><th>Fecha</th><th>Tipo</th><th>Valor</th><th>Descripción</th><th></th></tr></thead><tbody>' + prep.rows.slice(0, 15).map(r => '<tr><td>' + esc(r.tx.date) + '</td><td>' + esc(S.TX_TYPES[r.tx.type] ? S.TX_TYPES[r.tx.type].short : r.tx.type) + '</td><td>' + (Number.isFinite(r.tx.amount) ? esc(U.money(r.tx.amount)) : '—') + '</td><td>' + esc(r.tx.description) + '</td><td>' + (r.ok ? (r.duplicate ? '<span class="badge warn">duplicado</span>' : '<span class="badge">ok</span>') : '<span class="badge over">error</span>') + '</td></tr>').join('') + '</tbody></table></div></details>';
      go.disabled = toImport.length === 0;
      go.textContent = 'Importar ' + toImport.length + ' movimiento(s)';
      host.querySelector('[data-cm]').addEventListener('change', e => { createMissing = e.target.checked; draw(); });
      host.querySelector('[data-dup]').addEventListener('change', e => { skipDup = e.target.checked; draw(); });
    };
    draw();
    go.addEventListener('click', async () => {
      const rows = prep.rows.filter(r => r.ok && !(skipDup && r.duplicate));
      if (!rows.length) return;
      go.disabled = true;
      try {
        if (prep.toCreate.categories.length) await St.saveMany('categories', prep.toCreate.categories);
        if (prep.toCreate.accounts.length) {
          const accs = prep.toCreate.accounts.map(a => { const first = rows.filter(r => r.tx.accountId === a.id || r.tx.toAccountId === a.id).map(r => r.tx.date).sort()[0]; return Object.assign({}, a, { openedAt: first || U.today() }); });
          await St.saveMany('accounts', accs);
        }
        await St.saveMany('transactions', rows.map(r => Object.assign({}, r.tx, { id: r.tx.id || U.uid('tra'), createdAt: r.tx.date + 'T12:00:00.000Z' })));
        m.close();
        ui.toast('Se importaron ' + rows.length + ' movimiento(s).');
      } catch (e) { go.disabled = false; ui.toast('Error al importar: ' + e.message, { type: 'error' }); }
    });
  }

      vh.card('Exportar a CSV', '<p>Para abrir en Excel o Google Sheets (separador «;», compatible con configuración regional en español).</p><div class="btn-row">' +

      vh.card('Preferencias', '<label class="field"><span class="lbl">Moneda principal</span><select data-set="currency">' + ui.options(Object.fromEntries(Object.entries(U.CURRENCIES).map(([k, c]) => [k, k + ' · ' + c.name])), st.currency) + '</select><span class="hint">Define el formato y qué cuentas se suman a los totales. No convierte monedas: las cuentas en otra moneda se muestran aparte.</span></label>' +

      vh.card('Datos de ejemplo', '<p>Carga 12 meses de información ficticia para explorar gráficos, análisis y filtros. Se marcan como «demo» y se pueden eliminar sin afectar tus datos reales.</p><div class="btn-row">' +
        (St.hasDemo() ? '<button class="btn danger" data-act="remove-demo">Eliminar datos de ejemplo</button>' : '<button class="btn" data-act="load-demo">Cargar datos de ejemplo</button>') + '</div>') + '</div>' +
      '<div class="grid-2">' + vh.card('Almacenamiento', '<div data-storage><p class="muted">Consultando…</p></div><table class="tbl compact"><tbody>' + counts.map(([k, n]) => '<tr><th>' + names[k] + '</th><td>' + U.plainNumber(n) + '</td></tr>').join('') + '</tbody></table>') +

/* =========================================================================
 * pwa.js — Instalación como app y modo sin conexión (service worker).
 * Solo actúa cuando se sirve por http(s); con file:// no hace nada.
 * ========================================================================= */
(function (F) {
  'use strict';
  const KEY = 'finanzas-install-dismissed';
  let deferred = null;

  const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isWeb = () => /^https?:$/.test(location.protocol);
  const get = () => { try { return localStorage.getItem(KEY); } catch (_) { return null; } };
  const set = () => { try { localStorage.setItem(KEY, '1'); } catch (_) {} };

  const pwa = {
    isStandalone,
    /** 'prompt' (Android/Chrome), 'ios' (Safari), o null */
    mode() {
      if (!isWeb() || isStandalone()) return null;
      if (deferred) return 'prompt';
      if (isIOS()) return 'ios';
      return null;
    },
    dismissed: () => !!get(),
    dismiss() { set(); },
    async install() {
      if (!deferred) return false;
      deferred.prompt();
      const r = await deferred.userChoice.catch(() => ({}));
      deferred = null;
      return r.outcome === 'accepted';
    },
    init(onChange) {
      window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; onChange && onChange(); });
      window.addEventListener('appinstalled', () => { deferred = null; onChange && onChange(); F.ui && F.ui.toast('App instalada. Ábrela desde tu pantalla de inicio.'); });
      if (!isWeb() || !('serviceWorker' in navigator)) return;
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').then((reg) => {
        reg.addEventListener('updatefound', () => {
          const w = reg.installing;
          if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) w.postMessage('skipWaiting'); });
        });
      }).catch((e) => console.warn('Service worker no disponible', e));
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hadController && F.ui) F.ui.toast('Hay una versión nueva. Cierra y vuelve a abrir la app para usarla.', { timeout: 7000 });
      });
    }
  };
  F.pwa = pwa;
})(window.FIN);

    { title: 'Configuración', items: [['categorias', 'Categorías', 'tag'], ['ajustes', 'Datos y ajustes', 'settings']] }
  ];
  const TABS = [['inicio', 'Inicio', 'home'], ['movimientos', 'Movimientos', 'list'], ['+', '', 'plus'], ['mes', 'Análisis', 'chart'], ['mas', 'Más', 'more']];
  const ANALYSIS = ['mes', 'anual', 'ingresos', 'gastos', 'ahorro', 'proyeccion', 'salud', 'informes'];

  let current = { name: 'inicio', params: {} };
  let renderQueued = false;
  let lastDay = null;

  function parseHash() {
    const h = location.hash.replace(/^#\/?/, '');
    const [path, query] = h.split('?');
    const params = {};
    if (query) for (const kv of query.split('&')) { const [k, v] = kv.split('='); if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || ''); }
    const name = path && F.views[path] ? path : 'inicio';
    return { name, params };
  }

  function buildShell() {
    const side = document.querySelector('.sidebar nav');
    side.innerHTML = NAV.map(g => '<div class="nav-group"><h3>' + esc(g.title) + '</h3>' + g.items.map(([r, l, i]) => '<a href="#/' + r + '" data-nav="' + r + '">' + ui.icon(i) + '<span>' + esc(l) + '</span></a>').join('') + '</div>').join('');
    document.querySelector('.tabbar').innerHTML = TABS.map(([r, l, i]) => r === '+'
      ? '<button class="tab-add" data-add-tx="expense" aria-label="Registrar movimiento">' + ui.icon('plus') + '</button>'
      : '<a href="#/' + r + '" data-tab="' + r + '">' + ui.icon(i) + '<span>' + esc(l) + '</span></a>').join('');
  }

  function markNav(name) {
    document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === name));
    const tab = ANALYSIS.includes(name) ? 'mes' : ['inicio', 'movimientos'].includes(name) ? name : 'mas';
    document.querySelectorAll('[data-tab]').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
    const v = F.views[name];
    document.querySelector('.topbar-title').textContent = v ? v.title : '';
    document.title = (v && name !== 'inicio' ? v.title + ' · ' : '') + 'Finanzas personales';
  }

  function render(keepScroll) {
    const view = document.getElementById('view');
    const v = F.views[current.name];
    const y = window.scrollY;
    try { v.render(view, current.params || {}); }
    catch (e) {
      console.error(e);
      view.innerHTML = '<div class="page"><div class="alert error">' + ui.icon('alert') + '<div><strong>Algo salió mal al mostrar esta sección.</strong><p>' + esc(e.message) + '</p><p>Tus datos no se modificaron. Puedes exportar un respaldo desde <a href="#/ajustes">Datos y ajustes</a>.</p></div></div></div>';
    }
    markNav(current.name);
    if (keepScroll) window.scrollTo(0, y);
    lastDay = U.today();
  }
  function scheduleRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; render(true); updateBanners(); });
  }

  function navigate() {
    current = parseHash();
    render(false);
    window.scrollTo(0, 0);
    const main = document.getElementById('view');
    if (main) main.focus({ preventScroll: true });
  }

  function applyTheme() {
    const t = St.settings().theme || 'auto';
    if (t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }

  function updateBanners() {
    const host = document.getElementById('banners');
    let h = '';
    if (St.adapter && St.adapter.kind === 'memory') h += '<div class="banner error">' + ui.icon('alert') + '<span>No se pudo abrir el almacenamiento local de este navegador (¿modo privado?). Los cambios <b>no se guardarán</b> al cerrar. Exporta un respaldo antes de salir.</span></div>';
    if (!St.settings().privacyNoticeSeen && !St.isEmpty()) h += '<div class="banner">' + ui.icon('lock') + '<span>Tus datos se guardan solo en este dispositivo, en el navegador. No se envían a ningún servidor.</span><button class="btn small" data-dismiss-privacy>Entendido</button></div>';
    const pm = F.pwa && F.pwa.mode();
    if (pm && !F.pwa.dismissed()) {
      h += '<div class="banner install">' + ui.icon('home') + '<span>' + (pm === 'prompt'
        ? '<b>Instala la app</b> para abrirla desde tu pantalla de inicio y usarla sin conexión.'
        : '<b>Instala la app:</b> toca <b>Compartir</b> y luego <b>Añadir a pantalla de inicio</b>.') +
        '</span>' + (pm === 'prompt' ? '<button class="btn small primary" data-pwa-install>Instalar</button>' : '') +
        '<button class="btn small" data-pwa-dismiss>Ahora no</button></div>';
    }
    host.innerHTML = h;
    const pi = host.querySelector('[data-pwa-install]');
    if (pi) pi.addEventListener('click', () => F.pwa.install().then(updateBanners));
    const pd = host.querySelector('[data-pwa-dismiss]');
    if (pd) pd.addEventListener('click', () => { F.pwa.dismiss(); updateBanners(); });
    const b = host.querySelector('[data-dismiss-privacy]');
    if (b) b.addEventListener('click', () => St.saveSettings({ privacyNoticeSeen: true }));
  }

  // ---------------- Acciones globales (delegación) ----------------
  function onClick(e) {
    const t = e.target.closest('[data-add-tx],[data-edit-tx],[data-act],[data-confirm-rec],[data-skip-rec],[data-edit-rec-tx],[data-month-step],[data-year-step]');
    if (!t) return;
    if (t.hasAttribute('data-add-tx')) { e.preventDefault(); F.txForm.open({ type: t.getAttribute('data-add-tx') }); return; }
    if (t.hasAttribute('data-edit-tx')) {
      e.preventDefault();
      const tx = St.get('transactions', t.getAttribute('data-edit-tx'));
      if (tx) F.txForm.open({ tx });
      return;
    }
    if (t.hasAttribute('data-act')) {
      e.preventDefault();
      const a = t.getAttribute('data-act');
      if (a === 'new-account') F.forms.account(null, acc => ui.toast('Cuenta «' + acc.name + '» creada'));
      else if (a === 'load-demo') F.actions.loadDemo();
      else if (a === 'remove-demo') F.actions.removeDemo();
      else if (a === 'import-backup') F.actions.importBackup();
      else if (a === 'export-backup') F.actions.exportBackup();
      else if (a === 'import-csv') F.actions.importCSV();
      return;
    }
    if (t.hasAttribute('data-confirm-rec')) {
      e.preventDefault(); t.disabled = true;
      R.confirm(St, t.getAttribute('data-confirm-rec')).then(tx => ui.toast(S.TX_TYPES[tx.type].label + ' registrado · ' + U.money(tx.amount), { action: { label: 'Deshacer', fn: () => undoConfirm(tx) } }))
        .catch(err => { t.disabled = false; ui.toast(err.message || 'No se pudo registrar: revisa la regla (cuenta o categoría).', { type: 'error', timeout: 6000 }); });
      return;
    }
    if (t.hasAttribute('data-skip-rec')) { e.preventDefault(); R.skip(St, t.getAttribute('data-skip-rec')).then(() => ui.toast('Pago omitido')); return; }
    if (t.hasAttribute('data-edit-rec-tx')) {
      e.preventDefault();
      const rule = St.get('recurring', t.getAttribute('data-edit-rec-tx'));
      if (!rule) return;
      const preset = R.buildTx(rule, rule.nextDate);
      F.txForm.open({ type: rule.type, preset, onSaved: async () => { const r = St.get('recurring', rule.id); if (r) await St.save('recurring', Object.assign({}, r, { nextDate: R.step(r, r.nextDate) })); } });
      return;
    }
    if (t.hasAttribute('data-month-step')) {
      const box = t.closest('.month-picker');
      const cur = (current.params.m && /^\d{4}-\d{2}$/.test(current.params.m)) ? current.params.m : U.currentMonthKey();
      let next = U.addMonthKey(cur, Number(t.getAttribute('data-month-step')));
      if (next > U.currentMonthKey()) next = U.currentMonthKey();
      location.hash = '#/' + box.dataset.route + '?m=' + next;
      return;
    }
    if (t.hasAttribute('data-year-step')) {
      const box = t.closest('.month-picker');
      const cur = Number(current.params.y || U.today().slice(0, 4));
      location.hash = '#/' + box.dataset.route + '?y=' + Math.min(Number(U.today().slice(0, 4)), cur + Number(t.getAttribute('data-year-step')));
    }
  }
  async function undoConfirm(tx) {
    await St.remove('transactions', tx.id);
    const r = St.get('recurring', tx.recurringId);
    if (r) await St.save('recurring', Object.assign({}, r, { nextDate: tx.date, active: true }));
    ui.toast('Registro deshecho');
  }
  function onChange(e) {
    const inp = e.target.closest('[data-month-input]');
    if (inp && /^\d{4}-\d{2}$/.test(inp.value)) {
      const box = inp.closest('.month-picker');
      const v = inp.value > U.currentMonthKey() ? U.currentMonthKey() : inp.value;
      location.hash = '#/' + box.dataset.route + '?m=' + v;
    }
  }
  function onKey(e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
    if (document.querySelector('.modal-root')) return;
    if (e.key === 'n' || e.key === '+') { e.preventDefault(); F.txForm.open({ type: 'expense' }); }
    if (e.key === '/') { e.preventDefault(); location.hash = '#/movimientos'; setTimeout(() => { const s = document.querySelector('[data-f="q"]'); if (s) s.focus(); }, 50); }
  }

  // ---------------- Arranque ----------------
  async function start() {
    buildShell();
    let adapter = new F.storage.IndexedDBAdapter(S.STORES);
    try { await St.init(adapter); }
    catch (e) {
      console.warn('IndexedDB no disponible, se usa memoria', e);
      adapter = new F.storage.MemoryAdapter(S.STORES);
      await St.init(adapter);
    }
    applyTheme();
    try {
      const created = await R.runAuto(St);
      if (created) ui.toast('Se registraron ' + created + ' movimiento(s) recurrente(s) automáticos.', { timeout: 4500 });
    } catch (e) { console.warn(e); }
    if (!St.isEmpty() && adapter.kind === 'indexeddb') adapter.requestPersistence();
    St.on(scheduleRender);
    // Sincronización entre pestañas: si otra pestaña cambia datos, recargar.
    try {
      const ch = new BroadcastChannel('finanzas-personales');
      let fromOther = false;
      St.on(() => { if (!fromOther) ch.postMessage({ t: 'changed', at: Date.now() }); });
      ch.onmessage = async () => { fromOther = true; try { await St.init(St.adapter); } finally { fromOther = false; } };
    } catch (_) { /* navegador sin BroadcastChannel */ }
    window.addEventListener('hashchange', navigate);
    document.addEventListener('click', onClick);
    document.addEventListener('change', onChange);
    document.addEventListener('keydown', onKey);
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && lastDay && lastDay !== U.today()) {
        await R.runAuto(St);
        F.ledger.invalidate();
        render(true);
      }
    });
    if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => F.charts.redrawAll());
    document.body.classList.remove('booting');
    if (F.pwa) F.pwa.init(updateBanners);
    updateBanners();
    navigate();
    if (current.params.add) { const t = current.params.add; history.replaceState(null, '', location.pathname + '#/' + current.name); F.txForm.open({ type: S.TX_TYPES[t] ? t : 'expense' }); }
  }

  F.app = { start, applyTheme, render, navigate };
  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  }
})(window.FIN);

</script>
</body>
</html>
