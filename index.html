<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- Privacidad: connect-src 'none' impide cualquier petición de red (fetch, XHR, WebSocket, beacons). -->

  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="booting">
  <a class="skip" href="#view">Saltar al contenido</a>
  <div class="app">
    <aside class="sidebar" aria-label="Navegación principal">
      <a class="brand" href="#/">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14"/><path d="M14 44 26 30l9 8 15-17"/></svg>
        <span>Finanzas<small>personales</small></span>
      </a>
      <button class="btn primary block side-add" data-add-tx="expense"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Registrar movimiento</button>
      <nav></nav>
      <p class="side-foot"><svg class="ico tiny" viewBox="0 0 24 24"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"/></svg>Datos solo en este dispositivo</p>
    </aside>
    <div class="main">
      <header class="topbar">
        <a class="brand-mini" href="#/" aria-label="Inicio"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14"/><path d="M14 44 26 30l9 8 15-17"/></svg></a>
        <span class="topbar-title">Inicio</span>
        <a class="icon-btn" href="#/movimientos" aria-label="Buscar movimientos"><svg class="ico" viewBox="0 0 24 24"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/></svg></a>
        <a class="icon-btn" href="#/ajustes" aria-label="Datos y ajustes"><svg class="ico" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"/></svg></a>
      </header>
      <div id="banners"></div>
      <main id="view" tabindex="-1">
        <div class="boot">Cargando tus datos…</div>
      </main>
    </div>
    <nav class="tabbar" aria-label="Navegación rápida"></nav>
  </div>
  <noscript><p class="noscript">Esta aplicación necesita JavaScript activado. Todo se ejecuta localmente en tu navegador.</p></noscript>

  <!-- Núcleo (sin DOM) -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/schema.js"></script>
  <!-- Almacenamiento -->
  <script src="js/storage/adapters.js"></script>
  <script src="js/storage/store.js"></script>
  <!-- Lógica financiera -->
  <script src="js/finance/ledger.js"></script>
  <script src="js/finance/recurring.js"></script>
  <script src="js/finance/analytics.js"></script>
  <!-- Importación / exportación -->
  <script src="js/io/backup.js"></script>
  <script src="js/io/demo.js"></script>
  <!-- Interfaz -->
  <script src="js/ui/dom.js"></script>
  <script src="js/ui/charts.js"></script>
  <script src="js/ui/forms.js"></script>
  <script src="js/ui/tx-form.js"></script>
  <script src="js/ui/views/common.js"></script>
  <script src="js/ui/views/dashboard.js"></script>

  <script src="js/ui/views/plan.js"></script>

  <script src="js/pwa.js"></script>
  <script src="js/app.js"></script>
